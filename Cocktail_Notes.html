  .save-btn:hover { background: #7a5fc0; }

/vi/RLawvTSlsWM/mqdefault.jpg", "dur": "3:16:28"}, {"id": "Z8v8tSX1IY4", "title": "ＮＥＧＲＯＮＩ ✦ Italian Funk, Acid Jazz & Mellow Bossa Nova Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/Z8v8tSX1IY4/mqdefault.jpg", "dur": "2:55:26"}, {"id": "YaTT-PpieFs", "title": "ＯＬＤ ＦＡＳＨＩＯＮＥＤ ✦ Slow Jazz, Vintage Soul & Americana Blues Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/YaTT-PpieFs/mqdefault.jpg", "dur": "2:36:04"}, {"id": "tXwVPDy3NW8", "title": "ＢＬＯＯＤＹ ＭＡＲＹ ✦ Slow Funk, Jazzy R&B & Gospel Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/tXwVPDy3NW8/mqdefault.jpg", "dur": "2:35:22"}, {"id": "sLjAgdB0s5M", "title": "ＥＳＰＲＥＳＳＯ ＭＡＲＴＩＮＩ ✦ Deep House, Minimal Techno & Acid Jazz Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/sLjAgdB0s5M/mqdefault.jpg", "dur": "2:51:55"}, {"id": "Ef5zszAOL50", "title": "ＡＶＩＡＴＩＯＮ ✦ Chillwave, Ethereal Synth & Dream Pop Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/Ef5zszAOL50/mqdefault.jpg", "dur": "2:45:14"}, {"id": "ZFR1Qwg1zFo", "title": "ＳＩＤＥＣＡＲ ✦ Classic Parisian Jazz, Cabaret & Roaring Twenties Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/ZFR1Qwg1zFo/mqdefault.jpg", "dur": "2:39:20"}, {"id": "0Ar2O9hlT3o", "title": "ＭＩＮＴ ＪＵＬＥＰ ✦ Southern Folk, Bluesgrass & Americana Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/0Ar2O9hlT3o/mqdefault.jpg", "dur": "3:07:56"}, {"id": "DyvAc60uxak", "title": "ＡＰＥＲＯＬ ＳＰＲＩＴＺ ✦ Italian Jazz, Bossa Nova & Lo-Fi Chill Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/DyvAc60uxak/mqdefault.jpg", "dur": "2:48:43"}, {"id": "mNKCEFQBs10", "title": "ＦＲＥＮＣＨ ７５ ✦ 1920s Parisian Jazz, Swing & Champagne Pop Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/mNKCEFQBs10/mqdefault.jpg", "dur": "2:36:29"}, {"id": "Pi5V_qmv1DI", "title": "ＰＩÑ Ａ ＣＯＬＡＤＡ ✦ Calypso, Reggae-Fusion & Tropical Pop Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/Pi5V_qmv1DI/mqdefault.jpg", "dur": "2:28:10"}, {"id": "cISPAaLZAv4", "title": "ＭＡＲＴＩＮＩ ✦ Cool Jazz, Cinematic Noir & Solo Trumpet Mix | Cocktail bar music", "thumb": "https://i.ytimg.com/vi/cISPAaLZAv4/mqdefault.jpg", "dur": "2:51:19"}, {"id": "DXUjYWXXHic", "title": "ＭＡＲＧＡＲＩＴＡ ✦ Latin Jazz, Cuban Son & Upbeat Reggaeton Mix | Coctail bar music", "thumb": "https://i.ytimg.com/vi/DXUjYWXXHic/mqdefault.jpg", "dur": "2:16:22"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  // Meta-Daten für Best-Of mitspeichern
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
