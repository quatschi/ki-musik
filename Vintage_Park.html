// Robuste UTF-8-sichere Base64-Kodierung/Dekodierung (für koreanische/asiatische Zeichen etc.)
function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64DecodeUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function saveToken() {

  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);

  init();
}

}

async function loadKanalMeta() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      kanalMeta = JSON.parse(b64DecodeUtf8(data.content));
    }
  } catch(e) {}
  const entry = kanalMeta[KANAL] || {};
  document.getElementById('meta-categories').value = (entry.categories !== undefined) ? entry.categories : ORIG_CATEGORIES;
  document.getElementById('meta-notes').value = entry.notizen || '';
}

      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }

      const existing = await getResp.json();
      sha = existing.sha;
      currentMeta = JSON.parse(b64DecodeUtf8(existing.content));
    }

      {
        method: 'PUT',

function renderGrid() {

    card.className = 'video-card';
    card.id = 'song-' + v.id;
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>

        <div class="stars" id="stars-${v.id}">

        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });

  highlightSongFromUrl();
}

function highlightSongFromUrl() {
  const songId = new URLSearchParams(window.location.search).get('song');
  if (!songId) return;
  const el = document.getElementById('song-' + songId);
  if (!el) return;
  setTimeout(() => {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'box-shadow 0.3s ease, border-color 0.3s ease';
    el.style.boxShadow = '0 0 0 2px rgba(180,150,255,0.9)';
    el.style.borderColor = 'rgba(180,150,255,0.9)';
    setTimeout(() => {
      el.style.boxShadow = '';
      el.style.borderColor = '';
    }, 4000);
  }, 300);
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);

      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,

async function saveEdit() {
  const btn = document.getElementById('edit-save-btn');
  btn.disabled = true;
  setEditStatus('Speichern...', '');
  const keptVideos = VIDEOS.filter(v => editSelection[v.id] !== false);
  const removedIds = VIDEOS.filter(v => editSelection[v.id] === false).map(v => v.id);
  try {
    let sha = null;
    let rawContent = '';
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${KANAL}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) {
      const existing = await getResp.json();
      sha = existing.sha;
      rawContent = b64DecodeUtf8(existing.content);
    } else {
      throw new Error('Kanal-Datei konnte nicht geladen werden');
    }
    const newVideosJson = JSON.stringify(keptVideos);
    let newContent = rawContent.replace(/const VIDEOS = \[.*?\];/s, 'const VIDEOS = ' + newVideosJson + ';');
    newContent = newContent.replace(/(<div class="channel-count">)\d+(\s*Videos<\/div>)/, '$1' + keptVideos.length + '$2');
    const encoded = b64EncodeUtf8(newContent);
    const body = { message: 'Redaktion: Videoliste aktualisiert (' + KANAL + ')', content: encoded, sha };
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${KANAL}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (!putResp.ok) {
      const err = await putResp.json();
      throw new Error(err.message || ('HTTP ' + putResp.status));
    }

    if (removedIds.length > 0) {
      const metaGetResp = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
        { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
      );
      let metaSha = null;
      let currentMeta = {};
      if (metaGetResp.ok) {
        const existingMeta = await metaGetResp.json();
        metaSha = existingMeta.sha;
        currentMeta = JSON.parse(b64DecodeUtf8(existingMeta.content));
      }
      const entry = currentMeta[KANAL] || {};
      const existingBlacklist = Array.isArray(entry.blacklist) ? entry.blacklist : [];
      entry.blacklist = Array.from(new Set([...existingBlacklist, ...removedIds]));
      currentMeta[KANAL] = entry;
      const metaEncoded = b64EncodeUtf8(JSON.stringify(currentMeta, null, 2));
      const metaBody = { message: 'Blacklist aktualisiert: ' + KANAL, content: metaEncoded };
      if (metaSha) metaBody.sha = metaSha;
      const metaPutResp = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
        {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(metaBody)
        }
      );
      if (!metaPutResp.ok) {
        const err = await metaPutResp.json();
        throw new Error('Blacklist: ' + (err.message || metaPutResp.status));
      }
      kanalMeta = currentMeta;
    }

    VIDEOS.length = 0;
    keptVideos.forEach(v => VIDEOS.push(v));
    document.querySelector('.channel-count').textContent = VIDEOS.length + ' Videos';
    renderGrid();
    setEditStatus('✓ Gespeichert (' + removedIds.length + ' entfernt)', 'ok');
  } catch(e) {
    setEditStatus('Fehler: ' + e.message, 'err');
  }
  btn.disabled = false;
}

function checkThumbUnavailable(v) {
  return new Promise(resolve => {
    if (!v.thumb) { resolve(true); return; }
    const img = new Image();
    let settled = false;
    const finish = (val) => { if (!settled) { settled = true; resolve(val); } };
    img.onload = () => {
      // YouTube liefert für gelöschte/nicht verfügbare Videos ein 120x90-Platzhalterbild
      // statt des echten Thumbnails – die URL selbst bleibt dabei gültig (kein leerer thumb-Wert).
      finish(img.naturalWidth === 120 && img.naturalHeight === 90);
    };
    img.onerror = () => finish(true);
    setTimeout(() => finish(false), 8000); // im Zweifel (Timeout) behalten
    img.src = v.thumb;
  });
}

async function checkAllThumbs(videos, onProgress) {
  const BATCH_SIZE = 20;
  const results = [];
  for (let i = 0; i < videos.length; i += BATCH_SIZE) {
    const batch = videos.slice(i, i + BATCH_SIZE);
    const batchResults = await Promise.all(batch.map(v => checkThumbUnavailable(v).then(bad => ({ id: v.id, bad }))));
    results.push(...batchResults);
    if (onProgress) onProgress(Math.min(i + BATCH_SIZE, videos.length), videos.length);
  }
  return results;
}

async function removeUnavailable() {
  const btn = document.getElementById('remove-unavailable-btn');
  btn.disabled = true;
  setStatus('Prüfe Verfügbarkeit der Thumbnails (0/' + VIDEOS.length + ')...', '');
  const checks = await checkAllThumbs(VIDEOS, (done, total) => {
    setStatus('Prüfe Verfügbarkeit der Thumbnails (' + done + '/' + total + ')...', '');
  });
  const missingIds = new Set(checks.filter(c => c.bad).map(c => c.id));
  const missing = VIDEOS.filter(v => missingIds.has(v.id));
  if (missing.length === 0) {
    setStatus('Keine nicht verfügbaren Videos gefunden', 'status-ok');
    btn.disabled = false;
    return;
  }
  if (!confirm(missing.length + ' Video(s) ohne gültiges Thumbnail (vermutlich nicht mehr verfügbar) werden entfernt. Fortfahren?')) {
    btn.disabled = false;
    return;
  }
  setStatus('Entferne nicht verfügbare Videos...', '');
  const keptVideos = VIDEOS.filter(v => !missingIds.has(v.id));
  try {
    let sha = null;
    let rawContent = '';
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${KANAL}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) {
      const existing = await getResp.json();
      sha = existing.sha;
      rawContent = b64DecodeUtf8(existing.content);
    } else {
      throw new Error('Kanal-Datei konnte nicht geladen werden');
    }
    const newVideosJson = JSON.stringify(keptVideos);
    let newContent = rawContent.replace(/const VIDEOS = \[.*?\];/s, 'const VIDEOS = ' + newVideosJson + ';');
    newContent = newContent.replace(/(<div class="channel-count">)\d+(\s*Videos<\/div>)/, '$1' + keptVideos.length + '$2');
    const encoded = b64EncodeUtf8(newContent);
    const body = { message: 'Nicht verfügbare Videos entfernt (' + KANAL + ')', content: encoded, sha };
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${KANAL}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (!putResp.ok) {
      const err = await putResp.json();
      throw new Error(err.message || ('HTTP ' + putResp.status));
    }
    VIDEOS.length = 0;
    keptVideos.forEach(v => VIDEOS.push(v));
    document.querySelector('.channel-count').textContent = VIDEOS.length + ' Videos';
    renderGrid();
    setStatus('✓ ' + missing.length + ' nicht verfügbare(s) Video(s) entfernt', 'status-ok');
  } catch(e) {
    setStatus('Fehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
</html>
