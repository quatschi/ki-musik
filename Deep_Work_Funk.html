/vi/nE_XbQzpeSE/mqdefault.jpg", "dur": "1:21:58"}, {"id": "oxe5X0tgGfs", "title": "Vintage Grooves To Trush Yourself 🔥", "thumb": "https://i.ytimg.com/vi/oxe5X0tgGfs/mqdefault.jpg", "dur": "1:22:09"}, {"id": "cMgyZzIguXE", "title": "Vintage Soul Funk 🔥 Rare Groove, Deep Funk & Old School 70s Soul", "thumb": "https://i.ytimg.com/vi/cMgyZzIguXE/mqdefault.jpg", "dur": "1:21:46"}, {"id": "fuWmqTzC6Zg", "title": "Don’t Skip This Groove… Trust Me 🎧 Ultimate Old School Soul Funk Groove 🎧", "thumb": "https://i.ytimg.com/vi/fuWmqTzC6Zg/mqdefault.jpg", "dur": "1:22:08"}, {"id": "66MiWjZUMa8", "title": "Ultimate Rare Soul Funk Mix   Deep Pocket Groove", "thumb": "https://i.ytimg.com/vi/66MiWjZUMa8/mqdefault.jpg", "dur": "1:22:34"}, {"id": "M24jFWYsegY", "title": "1 Hours Deep Work Funk – Coding Music for Maximum Focus & Productivity", "thumb": "https://i.ytimg.com/vi/M24jFWYsegY/mqdefault.jpg", "dur": "1:11:14"}, {"id": "mQvkHOTXPlI", "title": "Deep Work Funk Mix – Smooth Groove Music for Programmers & Creators", "thumb": "https://i.ytimg.com/vi/mQvkHOTXPlI/mqdefault.jpg", "dur": "1:12:06"}, {"id": "bXv1srj8mEQ", "title": "Focus Better Instantly – Funk & Neo Soul Music for Deep Work Sessions", "thumb": "https://i.ytimg.com/vi/bXv1srj8mEQ/mqdefault.jpg", "dur": "1:11:52"}, {"id": "2ZA_D2aBnyc", "title": "Groove Line Flow – Smooth Funk Music for Productivity & Focus", "thumb": "https://i.ytimg.com/vi/2ZA_D2aBnyc/mqdefault.jpg", "dur": "1:10:52"}, {"id": "H_lOvGyQ9ac", "title": "Rhodes Funk for Coding – Calm, Distraction Free Work Music", "thumb": "https://i.ytimg.com/vi/H_lOvGyQ9ac/mqdefault.jpg", "dur": "1:11:17"}, {"id": "nQND2Lb-gtU", "title": "Stay in the Groove – 1 Hour Funk Music for Coding & Deep Focus", "thumb": "https://i.ytimg.com/vi/nQND2Lb-gtU/mqdefault.jpg", "dur": "1:11:56"}, {"id": "8Sc_o6xrtO4", "title": "No Distractions, Just Groove – 1 Hour Funk Music for Deep Work", "thumb": "https://i.ytimg.com/vi/8Sc_o6xrtO4/mqdefault.jpg", "dur": "1:10:53"}, {"id": "5UIkLKaLMQg", "title": "Deep Focus Funk – Stay in Flow State for Hours", "thumb": "https://i.ytimg.com/vi/5UIkLKaLMQg/mqdefault.jpg", "dur": "1:10:55"}, {"id": "hmZ0shjpJww", "title": "Vintage Soul Funk Groove – Ultimate Coding & Focus Playlist", "thumb": "https://i.ytimg.com/vi/hmZ0shjpJww/mqdefault.jpg", "dur": "1:11:45"}, {"id": "J-lhb2zcx6A", "title": "Work Faster, Focus Longer – Funk & Jazz Grooves for Deep Work", "thumb": "https://i.ytimg.com/vi/J-lhb2zcx6A/mqdefault.jpg", "dur": "1:11:14"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
