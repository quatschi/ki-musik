  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';

const CHANNEL = "Amber Lounge";

"thumb": "https://i.ytimg.com/vi/s_qtSYVWO1I/mqdefault.jpg", "dur": "2:26:25"}, {"id": "BvK2vfSYzFU", "title": "Empty Bench. – Vintage Noir Jazz for Empty Night Walks", "thumb": "https://i.ytimg.com/vi/BvK2vfSYzFU/mqdefault.jpg", "dur": "2:26:19"}, {"id": "-DzNtDcBdgU", "title": "Empty Corner. – Vintage Noir Jazz for Empty Night Walks", "thumb": "https://i.ytimg.com/vi/-DzNtDcBdgU/mqdefault.jpg", "dur": "2:21:38"}, {"id": "z3bmAoykpSg", "title": "Empty Lanes. – Vintage Noir Jazz for Empty Night Walks", "thumb": "https://i.ytimg.com/vi/z3bmAoykpSg/mqdefault.jpg", "dur": "2:23:18"}, {"id": "J_IyU062rT8", "title": "Empty Avenue. – Vintage Noir Jazz for Empty Night Walks", "thumb": "https://i.ytimg.com/vi/J_IyU062rT8/mqdefault.jpg", "dur": "2:25:46"}, {"id": "57dIGRYBNy8", "title": "Late Walk. – Vintage Noir Jazz for Empty Streets", "thumb": "https://i.ytimg.com/vi/57dIGRYBNy8/mqdefault.jpg", "dur": "2:23:54"}, {"id": "zqfmZmeQv6k", "title": "Empty Sidewalks. – Vintage Noir Jazz for Quiet Nights", "thumb": "https://i.ytimg.com/vi/zqfmZmeQv6k/mqdefault.jpg", "dur": "2:18:22"}, {"id": "DK_BHMupYP4", "title": "Quiet Streetlights. – Vintage Noir Jazz for Empty Sidewalks", "thumb": "https://i.ytimg.com/vi/DK_BHMupYP4/mqdefault.jpg", "dur": "2:28:04"}, {"id": "C6JmeIEzZDg", "title": "Before Dawn. – Vintage Noir Jazz for the Coldest Hours", "thumb": "https://i.ytimg.com/vi/C6JmeIEzZDg/mqdefault.jpg", "dur": "2:33:34"}, {"id": "WTwS4PFgpBE", "title": "After Midnight. – Vintage Noir Jazz for the Quiet Hours", "thumb": "https://i.ytimg.com/vi/WTwS4PFgpBE/mqdefault.jpg", "dur": "2:23:44"}, {"id": "tU2L7Z-JrEU", "title": "Empty Streets. – Vintage Noir Jazz for Late Night Walks", "thumb": "https://i.ytimg.com/vi/tU2L7Z-JrEU/mqdefault.jpg", "dur": "2:25:02"}, {"id": "TvoHbJZJHWs", "title": "No Rush. – Vintage Noir Jazz for Slow Evenings & Late Drinks", "thumb": "https://i.ytimg.com/vi/TvoHbJZJHWs/mqdefault.jpg", "dur": "2:20:46"}, {"id": "dgqJva6haDk", "title": "Last Call. – Vintage Noir Jazz for Late Drinks & After Hours", "thumb": "https://i.ytimg.com/vi/dgqJva6haDk/mqdefault.jpg", "dur": "2:07:14"}, {"id": "Ylyh6_yjj1c", "title": "Slow Pour. – Vintage Noir Jazz for Slow Mornings & First Cups", "thumb": "https://i.ytimg.com/vi/Ylyh6_yjj1c/mqdefault.jpg", "dur": "2:31:42"}, {"id": "o2xrH-e8KwQ", "title": "Page by Page. – Vintage Noir Jazz for Late Reading & Cozy Studies", "thumb": "https://i.ytimg.com/vi/o2xrH-e8KwQ/mqdefault.jpg", "dur": "2:11:42"}, {"id": "iEblXiRI4Vs", "title": "By the Fire. – Vintage Noir Jazz for Quiet Winter Evenings", "thumb": "https://i.ytimg.com/vi/iEblXiRI4Vs/mqdefault.jpg", "dur": "2:20:18"}, {"id": "NOaWqUgSXkQ", "title": "Last Train Home. – Vintage Noir Jazz for Late Commutes & Quiet Rides", "thumb": "https://i.ytimg.com/vi/NOaWqUgSXkQ/mqdefault.jpg", "dur": "2:10:07"}, {"id": "8GVemlZ9Wtk", "title": "First Light. – Vintage Noir Jazz for Slow Mornings & Soft Coffee", "thumb": "https://i.ytimg.com/vi/8GVemlZ9Wtk/mqdefault.jpg", "dur": "2:08:30"}, {"id": "wrqQZwRwacA", "title": "Quiet Pages. – Vintage Noir Jazz for Late Reading & Slow Evenings", "thumb": "https://i.ytimg.com/vi/wrqQZwRwacA/mqdefault.jpg", "dur": "2:15:50"}, {"id": "oRbCt9u91HU", "title": "Late Hours. – Vintage Noir Jazz for Late Drinks & Quiet Nights", "thumb": "https://i.ytimg.com/vi/oRbCt9u91HU/mqdefault.jpg", "dur": "2:27:21"}, {"id": "2jiAGzQvwGw", "title": "Smoky Hours. – Noir Jazz for Quiet Evenings", "thumb": "https://i.ytimg.com/vi/2jiAGzQvwGw/mqdefault.jpg", "dur": "2:01:29"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
