<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Musik Radio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: white; padding: 20px; }
  .back { align-self: flex-start; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
  .back:hover { color: #e0d7ff; }
  h1 { font-size: 1.8rem; font-weight: 300; color: #e0d7ff; margin-bottom: 6px; text-align: center; }
  .subtitle { font-size: 0.8rem; color: #9b8fc0; margin-bottom: 20px; text-align: center; }
  .filter-section { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; width: 100%; }
  .filter-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: #9b8fc0; padding: 6px 16px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s ease; }
  .filter-btn.active { background: rgba(180,150,255,0.25); border-color: rgba(180,150,255,0.6); color: #e8e0ff; }
  .player-container { width: 100%; max-width: 640px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; overflow: hidden; }
  .video-frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
  .video-frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .video-frame .placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #9b8fc0; font-size: 0.9rem; }
  .info { padding: 16px 20px; }
  .channel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .channel-thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(180,150,255,0.3); flex-shrink: 0; }
  .channel-name { font-size: 0.75rem; color: #9b8fc0; }
  .video-title { font-size: 0.95rem; color: #e8e0ff; line-height: 1.4; margin-bottom: 4px; }
  .video-dur { font-size: 0.75rem; color: #7a6fa0; margin-bottom: 16px; }
  .btn-next { background: rgba(180,150,255,0.2); border: 1px solid rgba(180,150,255,0.5); border-radius: 50px; color: #e8e0ff; padding: 14px 32px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; display: block; width: 100%; font-family: inherit; }
  .btn-next:hover { background: rgba(180,150,255,0.35); }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(180,150,255,0.3); border-top-color: #b496ff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <a class="back" href="index.html">← Übersicht</a>
  <h1>🎵 KI-Musik Radio</h1>
  <p class="subtitle" id="subtitle">Zufälliger Kanal · Zufälliges Video</p>
  <div class="filter-section" id="filters">
    <button class="filter-btn active" onclick="setFilter('Alle')">Alle</button>
  </div>
  <div class="player-container">
    <div class="video-frame">
      <div class="placeholder" id="placeholder"><span class="spinner"></span>Lade...</div>
      <div id="yt-player"></div>
    </div>
    <div class="info" id="info"></div>
  </div>

<script>
  let channelList = [];
  let playbackTimeout = null;

  function startPlaybackTimeout() {
    clearPlaybackTimeout();
    // Nach 6 Sekunden prüfen ob Video wirklich spielt
    playbackTimeout = setTimeout(() => {
      if (ytPlayer && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
        console.log('Kein Abspielen erkannt – weiter zum nächsten Video');
        pickRandom();
      }
    }, 6000);
  }

  function clearPlaybackTimeout() {
    if (playbackTimeout) {
      clearTimeout(playbackTimeout);
      playbackTimeout = null;
    }
  }
  let currentFilter = 'Alle';
  let ytPlayer = null;
  let playerReady = false;

  const urlParams = new URLSearchParams(window.location.search);
  const startFilter = urlParams.get('kategorie') || 'Alle';

  // YouTube IFrame API laden
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      playerVars: { autoplay: 1, rel: 0 },
      events: {
        onReady: () => { playerReady = true; },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) {
            // Video spielt wirklich – Timeout abbrechen
            clearPlaybackTimeout();
          }
          if (e.data === YT.PlayerState.ENDED) {
            pickRandom();
          }
        },
        onError: (e) => {
          console.log('YouTube Fehler:', e.data);
          clearPlaybackTimeout();
          setTimeout(() => pickRandom(), 1500);
        }
      }
    });
    // Stil anpassen
    const iframe = document.querySelector('#yt-player iframe');
    if (iframe) { iframe.style.position = 'absolute'; iframe.style.top = '0'; iframe.style.left = '0'; iframe.style.width = '100%'; iframe.style.height = '100%'; }
  }

  async function loadChannelList() {
    const resp = await fetch('index.html');
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const links = [];
    doc.querySelectorAll('a.card').forEach(a => {
      const href = a.getAttribute('href');
      const cats = a.getAttribute('data-cats') || '';
      const name = a.querySelector('.card-name')?.textContent?.trim() || '';
      const thumb = a.querySelector('.ch-thumb')?.getAttribute('src') || '';
      if (href && href.endsWith('.html') && href !== 'neu.html' && href !== 'radio.html') {
        links.push({ file: href, categories: cats, name, thumb });
      }
    });
    return links;
  }

  async function loadOneChannel(entry) {
    document.getElementById('placeholder').innerHTML = '<span class="spinner"></span>Lade ' + entry.name + '...';
    document.getElementById('placeholder').style.display = 'flex';
    const resp = await fetch(entry.file);
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const videos = [];
    doc.querySelectorAll('.video-card').forEach(card => {
      const url = card.getAttribute('href');
      const title = card.querySelector('.video-title')?.textContent?.trim() || '';
      const dur = card.querySelector('.video-dur')?.textContent?.trim() || '';
      if (url && title) {
        const match = url.match(/v=([a-zA-Z0-9_-]{11})/);
        if (match) videos.push({ videoId: match[1], url, title, dur });
      }
    });
    return videos;
  }

  function setFilter(kat) {
    currentFilter = kat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === kat));
    document.getElementById('subtitle').textContent = kat === 'Alle' ? 'Alle Kategorien · Zufälliges Video' : kat + ' · Zufälliges Video';
    pickRandom();
  }

  function getFiltered() {
    if (currentFilter === 'Alle') return channelList;
    return channelList.filter(c => c.categories.includes(currentFilter));
  }

  async function pickRandom() {
    const filtered = getFiltered();
    if (!filtered.length) {
      document.getElementById('info').innerHTML = '<p style="color:#9b8fc0;text-align:center;padding:10px">Keine Kanäle in dieser Kategorie.</p>';
      return;
    }
    const channel = filtered[Math.floor(Math.random() * filtered.length)];
    const videos = await loadOneChannel(channel);
    if (!videos.length) { pickRandom(); return; }
    const video = videos[Math.floor(Math.random() * videos.length)];

    document.getElementById('placeholder').style.display = 'none';

    // Video im YouTube-Player laden
    if (ytPlayer && playerReady) {
      ytPlayer.loadVideoById(video.videoId);
      startPlaybackTimeout();
    } else {
      // Fallback falls API noch nicht bereit
      setTimeout(() => { if (ytPlayer && playerReady) ytPlayer.loadVideoById(video.videoId); }, 1000);
    }

    document.getElementById('info').innerHTML = `
      <div class="channel-row">
        ${channel.thumb ? `<img class="channel-thumb" src="${channel.thumb}" onerror="this.style.display='none'">` : ''}
        <span class="channel-name">${channel.name}</span>
      </div>
      <div class="video-title">${video.title}</div>
      <div class="video-dur">${video.dur}</div>
      <button class="btn-next" onclick="pickRandom()">⟳ Nächstes zufälliges Video</button>
    `;
  }

  async function init() {
    channelList = await loadChannelList();
    const cats = new Set();
    channelList.forEach(c => {
      if (c.categories) c.categories.split(',').forEach(cat => { const t = cat.trim(); if (t) cats.add(t); });
    });
    const filterDiv = document.getElementById('filters');
    [...cats].sort().forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cat;
      btn.onclick = () => setFilter(cat);
      filterDiv.appendChild(btn);
    });

    if (startFilter !== 'Alle') {
      currentFilter = startFilter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === startFilter));
      document.getElementById('subtitle').textContent = startFilter + ' · Zufälliges Video';
    }

    // Warten bis YouTube API bereit
    const waitForPlayer = setInterval(() => {
      if (playerReady) { clearInterval(waitForPlayer); pickRandom(); }
    }, 200);
  }

  init();
</script>
</body>
</html>
