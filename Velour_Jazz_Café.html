.ytimg.com/vi/pwwSFMRw8bQ/mqdefault.jpg", "dur": "39:01"}, {"id": "Pz7jUbzsEHU", "title": "Elegant Jazz Café Nights ✨ Smooth Soul R&B Lounge Music", "thumb": "https://i.ytimg.com/vi/Pz7jUbzsEHU/mqdefault.jpg", "dur": "40:00"}, {"id": "ktzl76CvZoU", "title": "Relaxing Smooth Jazz Café ☕ Late Night Soul R&B Ambience Music", "thumb": "https://i.ytimg.com/vi/ktzl76CvZoU/mqdefault.jpg", "dur": "42:01"}, {"id": "GTSVvypen6E", "title": "Smooth Jazz Lounge at Midnight 🌙 Soul R&B Chill Background Music", "thumb": "https://i.ytimg.com/vi/GTSVvypen6E/mqdefault.jpg", "dur": "41:01"}, {"id": "jclIT57ebHo", "title": "Late Night Coffee Jazz ☕ Smooth R&B Lounge Music for Study & Chill", "thumb": "https://i.ytimg.com/vi/jclIT57ebHo/mqdefault.jpg", "dur": "39:00"}, {"id": "nwINa0eDdkQ", "title": "Rainy Night Smooth Jazz Café 🌧️ Soul R&B Lounge Ambience", "thumb": "https://i.ytimg.com/vi/nwINa0eDdkQ/mqdefault.jpg", "dur": "35:01"}, {"id": "ztax0pKUzno", "title": "Deep Night Jazz Café ☕ Smooth Soul R&B for Focus & Relaxation", "thumb": "https://i.ytimg.com/vi/ztax0pKUzno/mqdefault.jpg", "dur": "39:01"}, {"id": "sSj_KhM9iMI", "title": "Velour Jazz Café ☕ Smooth Jazz Soul R&B for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/sSj_KhM9iMI/mqdefault.jpg", "dur": "44:25"}, {"id": "5wFj9lq3YAM", "title": "Smooth Jazz Café at Midnight 🌃 Cozy Soul R&B Background Music", "thumb": "https://i.ytimg.com/vi/5wFj9lq3YAM/mqdefault.jpg", "dur": "45:37"}, {"id": "ILulIk1207Y", "title": "Luxury Smooth Jazz Soul R&B 🎷 Night Lounge Café Ambience Music", "thumb": "https://i.ytimg.com/vi/ILulIk1207Y/mqdefault.jpg", "dur": "44:41"}, {"id": "e9_2nNELIDs", "title": "Late Night Smooth Jazz Café 🌙 Soul R&B Instrumental for Relaxing Evenings", "thumb": "https://i.ytimg.com/vi/e9_2nNELIDs/mqdefault.jpg", "dur": "45:37"}, {"id": "YfKaDmQeNDk", "title": "Smooth Jazz Soul R&B Night Café ☕ Cozy Luxury Lounge Music for Relax & Work", "thumb": "https://i.ytimg.com/vi/YfKaDmQeNDk/mqdefault.jpg", "dur": "44:53"}, {"id": "x-DHERZGYPg", "title": "Smooth Jazz Soul RnB Lounge – Late Night Chill & Relax Vibes", "thumb": "https://i.ytimg.com/vi/x-DHERZGYPg/mqdefault.jpg", "dur": "44:36"}, {"id": "V9UhLf2EP3g", "title": "Smooth Jazz Lounge ☕ Luxury Cafe Night Jazz & Soul Instrumental", "thumb": "https://i.ytimg.com/vi/V9UhLf2EP3g/mqdefault.jpg", "dur": "44:25"}, {"id": "M-pE1R2tJDg", "title": "Smooth Jazz Café ☕ Luxury Night Jazz & Soul Instrumental | Relaxing Background Music", "thumb": "https://i.ytimg.com/vi/M-pE1R2tJDg/mqdefault.jpg", "dur": "44:25"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  // Meta-Daten für Best-Of mitspeichern
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
