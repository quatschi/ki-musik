<script>
const GITHUB_USER = 'quatschi';

const CHANNEL = "Cozy Jazz Fireplace";

k & Relaxation", "thumb": "https://i.ytimg.com/vi/r75adc4aPiI/mqdefault.jpg", "dur": "1:26:41"}, {"id": "FT5UBJ3PA6w", "title": "Smooth Jazz & Soul R&B - Perfect Background Music for Studying & Relaxation.", "thumb": "https://i.ytimg.com/vi/FT5UBJ3PA6w/mqdefault.jpg", "dur": "1:27:20"}, {"id": "fm8ioqRnTaU", "title": "Smooth Jazz Soul & R&B instrumental - Warm Sounds for Gentle Relaxing Moments.", "thumb": "https://i.ytimg.com/vi/fm8ioqRnTaU/mqdefault.jpg", "dur": "1:51:21"}, {"id": "k7nCMBI9zOE", "title": "Smooth Jazz & Soul R&B - Elegant Vibes For Calm Evenings.", "thumb": "https://i.ytimg.com/vi/k7nCMBI9zOE/mqdefault.jpg", "dur": "1:29:42"}, {"id": "d6YlgS_vnI8", "title": "Smooth Jazz & Soul R&B instrumental – Warm Sounds for Gentle Relaxing Moments", "thumb": "https://i.ytimg.com/vi/d6YlgS_vnI8/mqdefault.jpg", "dur": "1:29:42"}, {"id": "9JjIoetZD5o", "title": "Smooth Jazz Soul & R&B - Smooth Vibes for Relaxing & Thinking.", "thumb": "https://i.ytimg.com/vi/9JjIoetZD5o/mqdefault.jpg", "dur": "1:35:16"}, {"id": "PNpjki2HMvY", "title": "Smooth Jazz & Soulful R&B Grooves Cozy Cafe Ambience - Relax & Focus", "thumb": "https://i.ytimg.com/vi/PNpjki2HMvY/mqdefault.jpg", "dur": "1:51:21"}, {"id": "my0y42VRA9Q", "title": "Smooth Jazz Soul & R&B - Warm Instrumentals for Late Night Relaxation.", "thumb": "https://i.ytimg.com/vi/my0y42VRA9Q/mqdefault.jpg", "dur": "1:50:32"}, {"id": "48D-ZwnINiY", "title": "Smooth Jazz Soul & R&B instrumental - Warm Sounds for Gentle Relaxing Moments.", "thumb": "https://i.ytimg.com/vi/48D-ZwnINiY/mqdefault.jpg", "dur": "1:36:32"}, {"id": "bZh7JN8X3Wo", "title": "Smooth Jazz & Soul R&B instrumental – Warm Sounds for Gentle Relaxing Moments", "thumb": "https://i.ytimg.com/vi/bZh7JN8X3Wo/mqdefault.jpg", "dur": "1:51:21"}, {"id": "tBEF8_Tr8lI", "title": "Smooth Jazz & Soul R&B – Cozy Sounds for Relaxation and Quiet Moments.", "thumb": "https://i.ytimg.com/vi/tBEF8_Tr8lI/mqdefault.jpg", "dur": "1:35:16"}, {"id": "18mp64SbscU", "title": "Smooth Jazz & Soul R&B – Warm Melodies for Peaceful Relaxing Moments.", "thumb": "https://i.ytimg.com/vi/18mp64SbscU/mqdefault.jpg", "dur": "2:06:05"}, {"id": "9CW90kOiM-I", "title": "Smooth Jazz & Soulful R&B Instrumental | Warm Emotional Melodies for a Peaceful & Relaxing Weekend", "thumb": "https://i.ytimg.com/vi/9CW90kOiM-I/mqdefault.jpg", "dur": "1:55:32"}, {"id": "LwEEuUCo6Qs", "title": "Smooth Jazz & Soul R&B – Perfect background music for studying & relaxation.", "thumb": "https://i.ytimg.com/vi/LwEEuUCo6Qs/mqdefault.jpg", "dur": "1:55:04"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  // Meta-Daten für Best-Of mitspeichern
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
