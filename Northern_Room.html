<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICMLN</title>
<!-- categories: Lounge -->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(180,150,255,0.4); }
  .channel-title { font-size: 1.5rem; font-weight: 300; color: #e0d7ff; letter-spacing: 0.05em; }
  .channel-count { font-size: 0.8rem; color: #7a6fa0; margin-top: 4px; }
  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .play-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(180,150,255,0.15); border: 1px solid rgba(180,150,255,0.4); color: #b496ff; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s ease; }
  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .save-btn:disabled { background: #3a2a70; cursor: wait; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }
  .status-ok { color: #6fcf97; }
  .status-err { color: #eb5757; }
  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>
</head>
<body>

<div class="token-overlay" id="token-overlay">
  <div class="token-box">
    <h2>🔑 GitHub Token eingeben</h2>
    <p>Das Token wird nur in diesem Browser gespeichert und direkt an GitHub übertragen.</p>
    <input type="password" id="token-input" placeholder="github_pat_...">
    <button class="token-confirm" onclick="saveToken()">Bestätigen</button>
  </div>
</div>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <a class="back" href="index.html">← Zurück zur Übersicht</a>
    <a class="back" href="radio2.html?kanal=Northern_Room.html" style="border:1px solid rgba(180,150,255,0.4);padding:6px 14px;border-radius:20px">▶ Nur diesen Kanal im Radio</a>
  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/jWBxkNhX1kmbaMZ-tmqFpkxpNpX_Q4GwbN3XbywxvVno-j4dq2QMGcVKC0NKJY5mxhujNdVOj7E=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">VICMLN</div>
      <div class="channel-count">23 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "VICMLN";
const KANAL = "Northern_Room.html";
const VIDEOS = [{"id": "jwFjuiMQbpI", "title": "Northern Lights Soul Funk | 70s & 80s R&B Groove, Smooth Jazz & Cozy Fireplace Mix", "thumb": "https://i.ytimg.com/vi/jwFjuiMQbpI/mqdefault.jpg", "dur": ""}, {"id": "HJZaAHrR_Lg", "title": "Late Night Jungle Mix | Piano, Sax & Emotional Night Drive", "thumb": "https://i.ytimg.com/vi/HJZaAHrR_Lg/mqdefault.jpg", "dur": "46:51"}, {"id": "vBVK0ZmkSno", "title": "Summer All Night 🌊 80s Yacht Jazz From Italy #music #Summer #YachtJazz #80sfunk #yacht #chillhouse", "thumb": "https://i.ytimg.com/vi/vBVK0ZmkSno/mqdefault.jpg", "dur": "0:09"}, {"id": "fTtdI2DtWaY", "title": "Yacht Jazz Italiano 1984 | Summer Vacation, Italo Funk & Marina Jazz-Soul Mix", "thumb": "https://i.ytimg.com/vi/fTtdI2DtWaY/mqdefault.jpg", "dur": "50:32"}, {"id": "cIYbqQUp0G4", "title": "We’re 1000 now. Thank you for listening, supporting and being here. This means a lot.", "thumb": "https://i.ytimg.com/vi/cIYbqQUp0G4/mqdefault.jpg", "dur": "0:07"}, {"id": "iVdGhfOmKIY", "title": "Cold Bay Night Drive | Luxury Funk, Nu Disco & Smooth Soul Mix", "thumb": "https://i.ytimg.com/vi/iVdGhfOmKIY/mqdefault.jpg", "dur": "54:00"}, {"id": "CyMHww6fbek", "title": "Chill House Mix | Cold Water & Silver Light | Northern House", "thumb": "https://i.ytimg.com/vi/CyMHww6fbek/mqdefault.jpg", "dur": "40:12"}, {"id": "SwHMcdLvG80", "title": "Cold Bay Café — Vintage Jazz Funk & Soulful House | Morning Groove by Northern Room", "thumb": "https://i.ytimg.com/vi/SwHMcdLvG80/mqdefault.jpg", "dur": "52:18"}, {"id": "sCOg6W5UZVo", "title": "90s Funk in the North | Smooth Soul, Jazz Hop & Cold Bay Lounge Mix", "thumb": "https://i.ytimg.com/vi/sCOg6W5UZVo/mqdefault.jpg", "dur": "41:43"}, {"id": "aIY0snmbkOU", "title": "Private Northern Funk | 80s Smooth Soul, Cold Bay Groove & Luxury Lounge Mix", "thumb": "https://i.ytimg.com/vi/aIY0snmbkOU/mqdefault.jpg", "dur": "39:40"}, {"id": "2mn5gwVh-Mc", "title": "Vintage Soul Funk & Smooth Jazz House Mix | Morning Café Groove by Northern Room", "thumb": "https://i.ytimg.com/vi/2mn5gwVh-Mc/mqdefault.jpg", "dur": "53:32"}, {"id": "v4GyGUuEiwc", "title": "Luxury Funk & Nu Disco Mix — 80s, 90s, 00s Groove | Northern Private Funk", "thumb": "https://i.ytimg.com/vi/v4GyGUuEiwc/mqdefault.jpg", "dur": "43:25"}, {"id": "aWajA19oKQM", "title": "Champagne & Scandal — Luxury Electropop & Pop House Mix", "thumb": "https://i.ytimg.com/vi/aWajA19oKQM/mqdefault.jpg", "dur": "43:56"}, {"id": "9mQG0TMSL-U", "title": "Northern Breakfast — Morning Funk & Smooth Soul by the Cold Bay | Luxury Morning Lounge Mix", "thumb": "https://i.ytimg.com/vi/9mQG0TMSL-U/mqdefault.jpg", "dur": "44:23"}, {"id": "Ket8ewb1btQ", "title": "80s Funk in the North | Smooth Soul, Cold Bay Lounge & Luxury Funk Mix", "thumb": "https://i.ytimg.com/vi/Ket8ewb1btQ/mqdefault.jpg", "dur": "1:00:57"}, {"id": "6avqCfM88uQ", "title": "AFTER MIDNIGHT | Luxury Deep House Mix 2026 | Night Drive & Lounge House", "thumb": "https://i.ytimg.com/vi/6avqCfM88uQ/mqdefault.jpg", "dur": "36:05"}, {"id": "BL4_2zd5gac", "title": "Midnight Embankment | Sax, Piano & Drum & Bass", "thumb": "https://i.ytimg.com/vi/BL4_2zd5gac/mqdefault.jpg", "dur": "38:46"}, {"id": "npN6Z9FEvpM", "title": "Northern House: Cold Mist | Chill House DJ Set | Lounge Deep House", "thumb": "https://i.ytimg.com/vi/npN6Z9FEvpM/mqdefault.jpg", "dur": "47:39"}, {"id": "1KH6Ghd71Js", "title": "Twilight Rite | Ritual Folklore Deep Set", "thumb": "https://i.ytimg.com/vi/1KH6Ghd71Js/mqdefault.jpg", "dur": "37:22"}, {"id": "5KP_jM0hbzE", "title": "Twilight Rite teaser #TwilightRite #DeepHouse #OrganicHouse #AmbientHouse", "thumb": "https://i.ytimg.com/vi/5KP_jM0hbzE/mqdefault.jpg", "dur": "0:36"}, {"id": "uI7F_6HJorg", "title": "Cold Water, Warm Light — Northern Room  #deepjazzyhouse #chillhouse #slowliving", "thumb": "https://i.ytimg.com/vi/uI7F_6HJorg/mqdefault.jpg", "dur": "0:15"}, {"id": "ni9s4NJqpaY", "title": "Northern Room — Deep Jazzy House", "thumb": "https://i.ytimg.com/vi/ni9s4NJqpaY/mqdefault.jpg", "dur": "0:15"}, {"id": "Najck8ovF-s", "title": "Deep Jazzy House by the Cold Bay  #DeepJazzyHouse #ChillHouse #LoungeHouse #HouseMusic", "thumb": "https://i.ytimg.com/vi/Najck8ovF-s/mqdefault.jpg", "dur": "42:18"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
