<style>

  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }

  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>

<script>
const CHANNEL = "Retro Soul Funk Vibes";
const KANAL = "Retro_Soul_Funk_Vibes.html";
const VIDEOS = [{"id": "QZR14RMZiH8", "title": "Deep Soul & Funk Revival | 2 Hours of Non-Stop Retro Grooves & Smooth Vibes", "thumb": "https://i.ytimg.com/vi/QZR14RMZiH8/mqdefault.jpg", "dur": "2:07:07"}, {"id": "8F1TARVADYo", "title": "Soul & Funk Infinity | 2 Hours of Deep Retro Grooves & Timeless Vibes", "thumb": "https://i.ytimg.com/vi/8F1TARVADYo/mqdefault.jpg", "dur": "2:07:07"}, {"id": "0L2f9eM189E", "title": "2 Hours of Retro Soul & Deep Funk • Smooth Vintage Grooves for Focus, Study & Relax", "thumb": "https://i.ytimg.com/vi/0L2f9eM189E/mqdefault.jpg", "dur": "2:07:07"}, {"id": "YjVXDlLqXfs", "title": "Vintage Soul Funk Mix 2026 🔥 Rare Groove, Deep Funk & Old School 70s Soul", "thumb": "https://i.ytimg.com/vi/YjVXDlLqXfs/mqdefault.jpg", "dur": "2:07:07"}, {"id": "s70LwGMoweY", "title": "Locks You in the Groove 🎧 Vintage Soul Funk Vibes", "thumb": "https://i.ytimg.com/vi/s70LwGMoweY/mqdefault.jpg", "dur": "2:07:07"}, {"id": "csqGAed6eZo", "title": "Ultimate Rare Soul Funk Mix Deep Pocket Groove", "thumb": "https://i.ytimg.com/vi/csqGAed6eZo/mqdefault.jpg", "dur": "2:07:07"}, {"id": "yzDMPTjzSdg", "title": "🎹When the City Finally Goes Quiet | Minimal Soul Funk • Smooth Power Relaxation", "thumb": "https://i.ytimg.com/vi/yzDMPTjzSdg/mqdefault.jpg", "dur": "2:07:07"}, {"id": "TaqvRsEKxdQ", "title": "🎷Where Jazz Meets Soul Funk | Minimal Soul Funk · Vintage Groove", "thumb": "https://i.ytimg.com/vi/TaqvRsEKxdQ/mqdefault.jpg", "dur": "2:07:07"}, {"id": "LArtN_Q3ot8", "title": "🎹When the City Finally Goes Quiet | Minimal Soul Funk • Smooth Power Relaxation", "thumb": "https://i.ytimg.com/vi/LArtN_Q3ot8/mqdefault.jpg", "dur": "2:07:07"}, {"id": "cFOYGK4mB9Q", "title": "🥃 Soul Funk Lounge Mix | Amber Whiskey Bar • Slow Deep Groove", "thumb": "https://i.ytimg.com/vi/cFOYGK4mB9Q/mqdefault.jpg", "dur": "2:07:07"}, {"id": "Zt8YUKBdfXs", "title": "🌇When the City Turns Golden | Minimal Soul Funk • Late Night Drive", "thumb": "https://i.ytimg.com/vi/Zt8YUKBdfXs/mqdefault.jpg", "dur": "2:07:07"}, {"id": "GXzNbvqRPvI", "title": "🌙When the Voice Carries the Night | Minimal Soul Funk • Vintage Jazz Bar Mood", "thumb": "https://i.ytimg.com/vi/GXzNbvqRPvI/mqdefault.jpg", "dur": "2:07:07"}, {"id": "Vpuwn0WI0Qo", "title": "🌆This Is How the Night Pays You Back | Minimal Soul Funk · After Work Drive", "thumb": "https://i.ytimg.com/vi/Vpuwn0WI0Qo/mqdefault.jpg", "dur": "2:07:07"}, {"id": "sPg13RmVpGo", "title": "🚀 Ultimate Vintage Soul Funk Mix 2026 🔥 Deep Rare Groove & Old School 70s Funk Vibes", "thumb": "https://i.ytimg.com/vi/sPg13RmVpGo/mqdefault.jpg", "dur": "2:07:07"}, {"id": "PLo-3Nq79gc", "title": "Ultimate Rare Soul Funk Mix | Deep Pocket Groove", "thumb": "https://i.ytimg.com/vi/PLo-3Nq79gc/mqdefault.jpg", "dur": "2:07:07"}, {"id": "rHtzQH6NWAQ", "title": "Ultimate Vintage Soul Funk Mix | Rare Groove Layers & Smooth Night Flow", "thumb": "https://i.ytimg.com/vi/rHtzQH6NWAQ/mqdefault.jpg", "dur": "2:07:17"}, {"id": "6Tm7xqYXPQc", "title": "Ultimate Rare Soul Funk Mix | Deep Pocket Groove", "thumb": "https://i.ytimg.com/vi/6Tm7xqYXPQc/mqdefault.jpg", "dur": "2:07:12"}, {"id": "059-PQ4BSo4", "title": "🔥 Vintage 70s Soul Funk Groove You’ve Been Waiting For | Raw, Deep & Ultra-Dry Vibes", "thumb": "https://i.ytimg.com/vi/059-PQ4BSo4/mqdefault.jpg", "dur": "2:06:41"}, {"id": "KkKWj9M78Ok", "title": "🚀 Ultimate Vintage Soul Funk Mix 2026 🔥 Deep Rare Groove & Old School 70s Funk Vibes", "thumb": "https://i.ytimg.com/vi/KkKWj9M78Ok/mqdefault.jpg", "dur": "2:07:14"}, {"id": "L97pMcrYHdc", "title": "Ultimate Vintage Soul Funk Mix | Rare Groove Layers & Smooth Night Flow", "thumb": "https://i.ytimg.com/vi/L97pMcrYHdc/mqdefault.jpg", "dur": "2:07:42"}, {"id": "4r_A_006LE4", "title": "Vintage Soul Funk Groove That Feels Right | Warm Analog Rhythm & Deep Soul", "thumb": "https://i.ytimg.com/vi/4r_A_006LE4/mqdefault.jpg", "dur": "2:07:00"}, {"id": "f67P6dGczS4", "title": "🔥 Vintage 60s Soul Funk Groove You’ve Been Waiting For | Raw, Deep & Ultra-Dry Vibes", "thumb": "https://i.ytimg.com/vi/f67P6dGczS4/mqdefault.jpg", "dur": "2:08:07"}, {"id": "BWcdlXXGgEo", "title": "🚀 Ultimate Vintage Soul Funk Mix 2026 🔥 Deep Rare Groove & Old School 50s , 60s, 70s  Funk Vibes", "thumb": "https://i.ytimg.com/vi/BWcdlXXGgEo/mqdefault.jpg", "dur": "2:06:31"}, {"id": "exWbb1kr_Ws", "title": "Ultimate Rare Soul Funk Mix | Deep Pocket Groove", "thumb": "https://i.ytimg.com/vi/exWbb1kr_Ws/mqdefault.jpg", "dur": "2:06:38"}, {"id": "wBknjGDvvc4", "title": "🎤 Soul Funk Lounge Mix | Late Night Bar • Slow Deep Groove", "thumb": "https://i.ytimg.com/vi/wBknjGDvvc4/mqdefault.jpg", "dur": "2:06:48"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
