<style>

  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>

<script>
const CHANNEL = "Ancestral Groove";
const KANAL = "Ancestral_Groove.html";
const VIDEOS = [{"id": "d0LOmp8YX10", "title": "Tribal Jazz Instrumental ~ Deep Ritual Jazz Music 2026 & Ancestral Fusion Groove Sounds", "thumb": "https://i.ytimg.com/vi/d0LOmp8YX10/mqdefault.jpg", "dur": ""}, {"id": "IYTsrqMTGVw", "title": "Deep Tribal Jazz Instrumental | Ancestral Groove Rhythms - Smooth Tribal Lounge Jazz Music", "thumb": "https://i.ytimg.com/vi/IYTsrqMTGVw/mqdefault.jpg", "dur": "2:02:33"}, {"id": "t_agnvqyk98", "title": "Deep Tribal Jazz Instrumental | Ancestral Rhythms & Ethno Fusion Beats | Smooth Jazz Music 2026", "thumb": "https://i.ytimg.com/vi/t_agnvqyk98/mqdefault.jpg", "dur": "2:05:19"}, {"id": "bbsR4nSPSeo", "title": "Deep Tribal Jazz Instrumental | Ancestral Ritual Rhythms & Ethnic Fusion Jazz Music 2026", "thumb": "https://i.ytimg.com/vi/bbsR4nSPSeo/mqdefault.jpg", "dur": "2:06:24"}, {"id": "zAkzJo2TT6A", "title": "Deep Tribal Jazz Instrumental ~ Ancient Rhythms & Ancestral Groove Music 2026", "thumb": "https://i.ytimg.com/vi/zAkzJo2TT6A/mqdefault.jpg", "dur": "2:10:47"}, {"id": "8mCFc9W_TWQ", "title": "Deep Tribal Jazz Instrumental | Ancestral Ritual Music ~ Smooth Tribal Lounge Jazz & 2026", "thumb": "https://i.ytimg.com/vi/8mCFc9W_TWQ/mqdefault.jpg", "dur": "2:07:59"}, {"id": "VUKgMh3c9cI", "title": "Deep Tribal Jazz Instrumental | Ancestral Jazz Beats & Ritual Rhythms for Focus - Jazz 2026", "thumb": "https://i.ytimg.com/vi/VUKgMh3c9cI/mqdefault.jpg", "dur": "2:04:11"}, {"id": "dBDjauprWMU", "title": "Deep Tribal Jazz Instrumental ~ Ancestral Rhythms for Meditation & Focus 2026", "thumb": "https://i.ytimg.com/vi/dBDjauprWMU/mqdefault.jpg", "dur": "2:06:12"}, {"id": "qwoIv8nX0sM", "title": "Tribal Jazz Instrumental | Deep Tribal Ritual Rhythms - Smooth Ancestral Jazz Fusion & 2026", "thumb": "https://i.ytimg.com/vi/qwoIv8nX0sM/mqdefault.jpg", "dur": "2:01:07"}, {"id": "Qj2tIm8uNyo", "title": "Tribal Jazz Odyssey 2026 Deep Rhythms & Primal Beats", "thumb": "https://i.ytimg.com/vi/Qj2tIm8uNyo/mqdefault.jpg", "dur": "2:02:38"}, {"id": "h0EFakUQ2fk", "title": "Deep Tribal Jazz Instrumental | Ancestral Rhythms for Meditation and Focus | Jazz Music 2026", "thumb": "https://i.ytimg.com/vi/h0EFakUQ2fk/mqdefault.jpg", "dur": "2:02:16"}, {"id": "SL02YOht0Oo", "title": "Deep Tribal Jazz Instrumental ~ Shamanic Rhythms for Ancestral Healing & Focus 2026", "thumb": "https://i.ytimg.com/vi/SL02YOht0Oo/mqdefault.jpg", "dur": "2:04:12"}, {"id": "h7k-3lEUihs", "title": "Deep Tribal Jazz Instrumental | Ancestral Rhythms for Ritual and Meditation Music 2026", "thumb": "https://i.ytimg.com/vi/h7k-3lEUihs/mqdefault.jpg", "dur": "2:04:15"}, {"id": "nuRthV_tHsY", "title": "Deep Tribal Jazz Instrumental | Primal Ancestral Rhythms | Ethnic Fusion Jazz Music 2026", "thumb": "https://i.ytimg.com/vi/nuRthV_tHsY/mqdefault.jpg", "dur": "2:11:24"}, {"id": "RH6hJvj9BsM", "title": "Deep Tribal Jazz Instrumental | Ancestral Rhythms for Ritual and Meditation | Jazz Music 2026", "thumb": "https://i.ytimg.com/vi/RH6hJvj9BsM/mqdefault.jpg", "dur": "2:08:45"}, {"id": "c-JLU0p1rTQ", "title": "Deep Tribal Jazz Instrumental - Ancestral Ritual Beats - Ethnic Jazz Fusion - Jazz 2026 Mix", "thumb": "https://i.ytimg.com/vi/c-JLU0p1rTQ/mqdefault.jpg", "dur": "2:00:56"}, {"id": "TaxV4QXCRMA", "title": "Deep Tribal Jazz Instrumental | Ancestral Groove Rituals - Smooth Ethnic Fusion Jazz 2026", "thumb": "https://i.ytimg.com/vi/TaxV4QXCRMA/mqdefault.jpg", "dur": "2:03:45"}, {"id": "MtNLGG_2W6w", "title": "Deep Tribal Jazz Instrumental | Ancestral Jazz Music 2026 | Primal Ritual Jazz Fusion Mix", "thumb": "https://i.ytimg.com/vi/MtNLGG_2W6w/mqdefault.jpg", "dur": "2:01:42"}, {"id": "Ekr8m2BEjSM", "title": "Tribal Jazz Instrumental | Deep Ritual Jazz & Ancestral Groove ~ Smooth Ethnic Lounge 2026", "thumb": "https://i.ytimg.com/vi/Ekr8m2BEjSM/mqdefault.jpg", "dur": "2:02:31"}, {"id": "RkDjLK_qFr4", "title": "Deep Tribal Jazz Instrumental | Ancestral Ritual Music for Focus & Deep Relaxation Jazz 2026", "thumb": "https://i.ytimg.com/vi/RkDjLK_qFr4/mqdefault.jpg", "dur": "2:08:27"}, {"id": "qK4lDq4jTVw", "title": "Deep Tribal Jazz Instrumental-Ritual Ancestral Jazz Music 2026 ~ Primal Ethnic Lounge Jazz", "thumb": "https://i.ytimg.com/vi/qK4lDq4jTVw/mqdefault.jpg", "dur": "2:05:39"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
