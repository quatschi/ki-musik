<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    padding: 30px 20px;
    color: white;
  }
  .back {
    display: inline-block;
    color: #9b8fc0;
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .back:hover { color: #e0d7ff; }
  .channel-header {
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 860px;
    margin: 0 auto 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .channel-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(180,150,255,0.4);
  }
  .channel-title {
    font-size: 1.5rem;
    font-weight: 300;
    color: #e0d7ff;
    letter-spacing: 0.05em;
  }
  .channel-count {
    font-size: 0.8rem;
    color: #7a6fa0;
    margin-top: 4px;
  }
  .grid {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .video-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 16px 10px 10px;
    text-decoration: none;
    color: white;
    transition: all 0.2s ease;
  }
  .video-card:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(180,150,255,0.35);
    transform: translateX(4px);
  }
  .thumb {
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .nothumb {
    width: 120px;
    height: 68px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: #cc0000;
    flex-shrink: 0;
  }
  .video-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .video-title {
    font-size: 0.92rem;
    color: #e8e0ff;
    line-height: 1.3;
  }
  .video-dur {
    font-size: 0.78rem;
    color: #7a6fa0;
  }
  .rating-area {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .stars {
    display: flex;
    gap: 3px;
  }
  .star {
    font-size: 1.3rem;
    cursor: pointer;
    color: #4a4060;
    transition: color 0.15s;
    user-select: none;
  }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn {
    font-size: 0.7rem;
    cursor: pointer;
    padding: 2px 6px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    background: none;
    color: #9b8fc0;
  }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20,15,50,0.97);
    border-top: 1px solid rgba(180,150,255,0.3);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 100;
  }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn {
    background: #5a3fa0;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
  .status-err { color: #eb5757; }
  .save-btn:disabled { background: #3a2a70; cursor: wait; }
  body { padding-bottom: 70px; }
  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>
</head>
<body>
<div class="token-overlay" id="token-overlay">
  <div class="token-box">
    <h2>🔑 GitHub Token eingeben</h2>
    <p>Das Token wird nur in diesem Browser gespeichert und direkt an GitHub übertragen.</p>
    <input type="password" id="token-input" placeholder="github_pat_...">
    <button class="token-confirm" onclick="saveToken()">Bestätigen</button>
  </div>
</div>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <a class="back" href="index.html">← Zurück zur Übersicht</a>
    <a class="back" href="radio2.html?kanal=Sad_String.html" style="border:1px solid rgba(180,150,255,0.4);padding:6px 14px;border-radius:20px">▶ Nur diesen Kanal im Radio</a>
  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/JHPFTC7dXxeP08ZaI1rgayXcvIPF8DlNODN80Phqi8A0-yng6NU0kJbR2r-P3PmLnouSdRWx=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Sad String</div>
      <div class="channel-count">13 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "Sad String";
const VIDEOS = [{"id": "nbvNJV38zVA", "title": "Sad String 11 - Vintage Jazz Guitar & Whiskey Mood | Relaxing Blues Bar Ambience", "thumb": "https://i.ytimg.com/vi/nbvNJV38zVA/mqdefault.jpg", "dur": "13:30"}, {"id": "tQLC3A1gLNs", "title": "Rainy Night Blues Bedroom Ambience | Cozy Jazz Blues Sleep Music, Relaxing Rain Sounds & City Lights", "thumb": "https://i.ytimg.com/vi/tQLC3A1gLNs/mqdefault.jpg", "dur": "17:22"}, {"id": "H0yTkY6TNgk", "title": "Sad String Blues 🎸 | Vintage Archtop Guitar, Whiskey & Midnight Blues Bar Ambience", "thumb": "https://i.ytimg.com/vi/H0yTkY6TNgk/mqdefault.jpg", "dur": "15:46"}, {"id": "IOSV3IkFmA4", "title": "Sad String 10 - Whiskey, Regret & Midnight Memories | Relaxing Vintage Blues Guitar", "thumb": "https://i.ytimg.com/vi/IOSV3IkFmA4/mqdefault.jpg", "dur": "18:56"}, {"id": "AVprMizW2B8", "title": "Sad String 9 - Deep Emotional Guitar Blues for Lonely Nights | Vintage Whiskey Bar Ambience", "thumb": "https://i.ytimg.com/vi/AVprMizW2B8/mqdefault.jpg", "dur": "52:15"}, {"id": "kZ45Upj6wDk", "title": "Sad String 8 - Blues Instrumental | Deep Blues Guitar for Lonely Nights & Whiskey Mood", "thumb": "https://i.ytimg.com/vi/kZ45Upj6wDk/mqdefault.jpg", "dur": "24:13"}, {"id": "3jdPW0P2PvE", "title": "Sad String 7 - Midnight Whiskey & Vintage Guitar | Relaxing Slow Blues Mood", "thumb": "https://i.ytimg.com/vi/3jdPW0P2PvE/mqdefault.jpg", "dur": "1:02:40"}, {"id": "y_lESg_DP_0", "title": "Sad String 6 - Whiskey, Smoke & Midnight Memories | Deep Soulful Blues", "thumb": "https://i.ytimg.com/vi/y_lESg_DP_0/mqdefault.jpg", "dur": "35:36"}, {"id": "6CpLQ4WCbLA", "title": "Sad String 5 - Deep Soulful Blues Guitar & Whiskey Bar Ambience | Vintage Blues Mood", "thumb": "https://i.ytimg.com/vi/6CpLQ4WCbLA/mqdefault.jpg", "dur": "31:11"}, {"id": "oG8s1fbqIgc", "title": "Sad Sring 4 - Deep Emotional Blues for Lonely Nights & Soulful Reflection", "thumb": "https://i.ytimg.com/vi/oG8s1fbqIgc/mqdefault.jpg", "dur": "27:01"}, {"id": "TUMYrtaHAsc", "title": "Sad String 3 - Midnight Jazz Guitar for Lonely Souls | Relaxing Vintage Blues 🎸", "thumb": "https://i.ytimg.com/vi/TUMYrtaHAsc/mqdefault.jpg", "dur": "21:05"}, {"id": "anoTmIVYv4M", "title": "Sad String 2 - Midnight Vinyl Blues | Cozy Jazz Lounge Ambience with Vintage Whiskey & Fireplace 🎷🔥", "thumb": "https://i.ytimg.com/vi/anoTmIVYv4M/mqdefault.jpg", "dur": "20:14"}, {"id": "5GYOlTDdJ8A", "title": "Sad String 1 - Smoky Jazz Guitar Nights by the Fireplace", "thumb": "https://i.ytimg.com/vi/5GYOlTDdJ8A/mqdefault.jpg", "dur": "15:44"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; const exContent = JSON.parse(decodeURIComponent(escape(atob(existing.content)))); meta = Object.assign(exContent.meta || {}, meta); }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
</html>
