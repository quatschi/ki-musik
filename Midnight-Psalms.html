<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "Midnight-Psalms";
const VIDEOS = [{"id": "yWDIbOPimSs", "title": "Tribal Lounge Jazz 2026 🌙 Warm Jazz & Hypnotic Tribal Grooves | Deep Night Ritual Vibes", "thumb": "https://i.ytimg.com/vi/yWDIbOPimSs/mqdefault.jpg", "dur": "0:23"}, {"id": "4tJDpyPaGJQ", "title": "Tribal Lounge Jazz Ritual 🌙 Deep Bass, Hypnotic Grooves & Midnight Lounge Sessions", "thumb": "https://i.ytimg.com/vi/4tJDpyPaGJQ/mqdefault.jpg", "dur": "2:04:15"}, {"id": "k5SaCEog7_w", "title": "Tribal Lounge Jazz 2026 🌙 Warm Jazz & Hypnotic Tribal Grooves | Deep Night Ritual Vibes", "thumb": "https://i.ytimg.com/vi/k5SaCEog7_w/mqdefault.jpg", "dur": "0:36"}, {"id": "96tCkCEJmn8", "title": "Tribal Lounge Jazz 2026 🌙 Warm Jazz & Hypnotic Tribal Grooves | Deep Night Ritual Vibes", "thumb": "https://i.ytimg.com/vi/96tCkCEJmn8/mqdefault.jpg", "dur": "2:27:45"}, {"id": "8o5Z5U0wRWI", "title": "Sacred Tribal Lounge Jazz 🌙 Deep Night Rituals for Focus & Relaxation", "thumb": "https://i.ytimg.com/vi/8o5Z5U0wRWI/mqdefault.jpg", "dur": "2:07:11"}, {"id": "dBUGIc-UhTI", "title": "Deep Tribal Jazz 🌒 Dark Lounge Beats for Focus, Work & Late Night Flow", "thumb": "https://i.ytimg.com/vi/dBUGIc-UhTI/mqdefault.jpg", "dur": "4:39:48"}, {"id": "TwhNBCk5rfw", "title": "Tribal Lounge Jazz ✨ Hypnotic Tribal Rhythms & Warm Midnight Jazz for Relaxation", "thumb": "https://i.ytimg.com/vi/TwhNBCk5rfw/mqdefault.jpg", "dur": "2:05:15"}, {"id": "AFq1r4Z_1fQ", "title": "Tribal Lounge Jazz 🌙 Deep Ritual Grooves for Focus, Study & Night Work", "thumb": "https://i.ytimg.com/vi/AFq1r4Z_1fQ/mqdefault.jpg", "dur": "2:10:41"}, {"id": "qFSSPjgPLiY", "title": "Sacred Tribal Lounge Jazz 🌙 Night Ritual Grooves for Deep Focus & Flow", "thumb": "https://i.ytimg.com/vi/qFSSPjgPLiY/mqdefault.jpg", "dur": "2:22:52"}, {"id": "t5FGHKV-C1k", "title": "Tribal Lounge Jazz After Dark 🌙 – Sacred Ritual Grooves | Deep Focus & Night Vibes", "thumb": "https://i.ytimg.com/vi/t5FGHKV-C1k/mqdefault.jpg", "dur": "2:11:20"}, {"id": "QGsDWu5eFME", "title": "After Hours Ritual Jazz 🌙 Tribal Lounge Grooves for Deep Focus & Sacred Vibes", "thumb": "https://i.ytimg.com/vi/QGsDWu5eFME/mqdefault.jpg", "dur": "2:04:05"}, {"id": "AZIaliPC7pk", "title": "Hypnotic Tribal Jazz Nights 🌙 Deep Instrumental Grooves for Focus & Late-Night Flow", "thumb": "https://i.ytimg.com/vi/AZIaliPC7pk/mqdefault.jpg", "dur": "2:01:59"}, {"id": "WC_09ApEt10", "title": "Hypnotic Tribal Jazz Nights 🌙 Deep Instrumental Grooves for Focus & Late Vibes", "thumb": "https://i.ytimg.com/vi/WC_09ApEt10/mqdefault.jpg", "dur": "2:08:08"}, {"id": "tXt_3DsRQrw", "title": "After Hours Tribal Lounge Jazz 🌙 Sacred Grooves for Night Vibes & Deep Relaxation", "thumb": "https://i.ytimg.com/vi/tXt_3DsRQrw/mqdefault.jpg", "dur": "2:22:32"}, {"id": "-WqlmLul7e4", "title": "Listen for 4 Minutes… Feel the Shift 🌿 | Tibetan Flute Healing & Deep Relaxation", "thumb": "https://i.ytimg.com/vi/-WqlmLul7e4/mqdefault.jpg", "dur": "1:14:32"}, {"id": "UP3TwBk6xFQ", "title": "An Ancient Tibetan Flute That Feels Like Healing 🎧｜Deep Calm & Inner Peace", "thumb": "https://i.ytimg.com/vi/UP3TwBk6xFQ/mqdefault.jpg", "dur": "1:21:21"}, {"id": "Ot2MAanWHwE", "title": "This Ancient Tibetan Flute Heals What Medicine Can’t | Deep Soul Cleanse", "thumb": "https://i.ytimg.com/vi/Ot2MAanWHwE/mqdefault.jpg", "dur": "1:01:34"}, {"id": "0K_bMF-PoWA", "title": "Ancient Tibetan Flute for Healing & Deep Sleep | 432Hz Miracle Meditation Music", "thumb": "https://i.ytimg.com/vi/0K_bMF-PoWA/mqdefault.jpg", "dur": "1:51:12"}, {"id": "egDjqx5jrcw", "title": "This Ancient Tibetan Flute Feels Like Healing 🌿 | Deep Relaxation Music", "thumb": "https://i.ytimg.com/vi/egDjqx5jrcw/mqdefault.jpg", "dur": "1:17:04"}, {"id": "u7o_ouQRCNQ", "title": "This Healing Flute Sound Feels Unbelievable 🌿 Deep Relaxation & Inner Peace", "thumb": "https://i.ytimg.com/vi/u7o_ouQRCNQ/mqdefault.jpg", "dur": "1:07:43"}, {"id": "7UCe_NtVkDU", "title": "Listen 5 Minutes a Day ✨ Healing Flute for Deep Relaxation & Inner Peace", "thumb": "https://i.ytimg.com/vi/7UCe_NtVkDU/mqdefault.jpg", "dur": "1:35:25"}, {"id": "9Q_NIfNUoNE", "title": "Ancient Tibetan Flute Healing 🧘‍♂️ | Deep Sleep & Meditation Music That Feels Like Magic", "thumb": "https://i.ytimg.com/vi/9Q_NIfNUoNE/mqdefault.jpg", "dur": "1:18:20"}, {"id": "4hj-Hd5bhso", "title": "Deep Healing Tibetan Flute 🧘‍♂️ | Feel Calm Instantly • Sleep & Meditation", "thumb": "https://i.ytimg.com/vi/4hj-Hd5bhso/mqdefault.jpg", "dur": "1:39:39"}, {"id": "otJNscz-XrQ", "title": "This Ancient Tibetan Flute Heals What Words Cannot 🧘‍♂️ | Deep Sleep & Inner Peace", "thumb": "https://i.ytimg.com/vi/otJNscz-XrQ/mqdefault.jpg", "dur": "2:42:12"}, {"id": "opyWOLhwzKI", "title": "Listen 5 Minutes a Day: Tibetan Healing Flute to Stop Overthinking & Relax Mind", "thumb": "https://i.ytimg.com/vi/opyWOLhwzKI/mqdefault.jpg", "dur": "2:17:59"}, {"id": "skZVcLJDkDk", "title": "This Ancient Tibetan Flute Heals What Medicine Cannot | Deep Healing Meditation Music", "thumb": "https://i.ytimg.com/vi/skZVcLJDkDk/mqdefault.jpg", "dur": "2:35:10"}, {"id": "blGdJNKvTwM", "title": "Doctors Can't Explain This Ancient Tibetan Flute! A Healing Miracle", "thumb": "https://i.ytimg.com/vi/blGdJNKvTwM/mqdefault.jpg", "dur": "13:11"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
