l | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/wKzapDcS2fc/mqdefault.jpg", "dur": "5:24"}, {"id": "g4u6DygUR5s", "title": "Say My Name Again — MOYO | Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/g4u6DygUR5s/mqdefault.jpg", "dur": "4:58"}, {"id": "DVAv7wDXJfI", "title": "MOYO –My House is Open", "thumb": "https://i.ytimg.com/vi/DVAv7wDXJfI/mqdefault.jpg", "dur": "0:29"}, {"id": "u09zv1r2RK8", "title": "MOYO — Tempus Fugit – Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/u09zv1r2RK8/mqdefault.jpg", "dur": "3:57"}, {"id": "CDfe2MxTt_Y", "title": "MOYO — REMAIN (Organic House / Afro Soul)", "thumb": "https://i.ytimg.com/vi/CDfe2MxTt_Y/mqdefault.jpg", "dur": "5:37"}, {"id": "DAQdwITfKX4", "title": "Hope with Feathers", "thumb": "https://i.ytimg.com/vi/DAQdwITfKX4/mqdefault.jpg", "dur": "0:21"}, {"id": "ULkULMuNg_k", "title": "DON'T TURN AROUND", "thumb": "https://i.ytimg.com/vi/ULkULMuNg_k/mqdefault.jpg", "dur": "0:31"}, {"id": "PrNkuNCvh_o", "title": "OH MY FIRE", "thumb": "https://i.ytimg.com/vi/PrNkuNCvh_o/mqdefault.jpg", "dur": "0:16"}, {"id": "ohniyG_yvvU", "title": "MOYO –My House is Open – Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/ohniyG_yvvU/mqdefault.jpg", "dur": "4:58"}, {"id": "rb7TeBsGxtY", "title": "Couldn’t Protect You from Myself - Deep Afro Soul | Emotional Male Vocal", "thumb": "https://i.ytimg.com/vi/rb7TeBsGxtY/mqdefault.jpg", "dur": "3:35"}, {"id": "ooCrofXpECg", "title": "MOYO AFRICA", "thumb": "https://i.ytimg.com/vi/ooCrofXpECg/mqdefault.jpg", "dur": "0:45"}, {"id": "Cc4kkfRyukw", "title": "MOYO AFRICA – Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/Cc4kkfRyukw/mqdefault.jpg", "dur": "5:29"}, {"id": "yIl11wApnXA", "title": "HOPE WITH FEATHERS – Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/yIl11wApnXA/mqdefault.jpg", "dur": "5:18"}, {"id": "AoBeNEyFqZw", "title": "DON’T TURN AROUND", "thumb": "https://i.ytimg.com/vi/AoBeNEyFqZw/mqdefault.jpg", "dur": "0:25"}, {"id": "5H14yQhORDE", "title": "DON’T TURN AROUND – Deep Afro Soul | Emotional Cinematic Song", "thumb": "https://i.ytimg.com/vi/5H14yQhORDE/mqdefault.jpg", "dur": "3:59"}, {"id": "xR9LrbpF12g", "title": "MAMA JUST LIVE", "thumb": "https://i.ytimg.com/vi/xR9LrbpF12g/mqdefault.jpg", "dur": "0:21"}, {"id": "qDtOICcv044", "title": "This is not a song. This is a feeling. | Oh My Fire 🔥", "thumb": "https://i.ytimg.com/vi/qDtOICcv044/mqdefault.jpg", "dur": "0:12"}, {"id": "qbUdEkAJFc8", "title": "Mama Just Live – Afro Soul Cinematic Song | Deep Emotional Male Vocal", "thumb": "https://i.ytimg.com/vi/qbUdEkAJFc8/mqdefault.jpg", "dur": "5:19"}, {"id": "TtzElOhegmw", "title": "Oh My Fire – Afro Soul Cinematic Song | Tribal Nylon Guitar | Deep Emotional Female Vocal", "thumb": "https://i.ytimg.com/vi/TtzElOhegmw/mqdefault.jpg", "dur": "5:47"}, {"id": "09eiJUJ9lr4", "title": "MOYO — Meditative Afro Soul | Relaxing Cinematic Song", "thumb": "https://i.ytimg.com/vi/09eiJUJ9lr4/mqdefault.jpg", "dur": "3:39"}, {"id": "0vtjzovHre4", "title": "Where I Breathe — Afro Soul | MOYO", "thumb": "https://i.ytimg.com/vi/0vtjzovHre4/mqdefault.jpg", "dur": "2:35"}, {"id": "rMD9AnYt60M", "title": "Where I Breathe — Afro Soul | MOYO", "thumb": "https://i.ytimg.com/vi/rMD9AnYt60M/mqdefault.jpg", "dur": "0:17"}, {"id": "oCBeO8Et75o", "title": "MOYA — Afro Soul", "thumb": "https://i.ytimg.com/vi/oCBeO8Et75o/mqdefault.jpg", "dur": "0:09"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;
let kanalMeta = {};

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  await loadKanalMeta();
  renderGrid();
}

async function loadKanalMeta() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      kanalMeta = JSON.parse(atob(data.content));
    }
  } catch(e) {}
  const entry = kanalMeta[KANAL] || {};
  document.getElementById('meta-categories').value = (entry.categories !== undefined) ? entry.categories : ORIG_CATEGORIES;
  document.getElementById('meta-notes').value = entry.notizen || '';
}

function setMetaStatus(msg, cls) {
  const el = document.getElementById('meta-status');
  el.textContent = msg;
  el.className = 'meta-status ' + (cls || '');
}

async function saveMeta() {
  const btn = document.getElementById('meta-save-btn');
  btn.disabled = true;
  setMetaStatus('Speichern...', '');
  const newCategories = document.getElementById('meta-categories').value.trim();
  const newNotes = document.getElementById('meta-notes').value;
  try {
    let sha = null;
    let currentMeta = {};
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) {
      const existing = await getResp.json();
      sha = existing.sha;
      currentMeta = JSON.parse(atob(existing.content));
    }
    currentMeta[KANAL] = { categories: newCategories, notizen: newNotes };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(currentMeta, null, 2))));
    const body = { message: 'Kategorien/Notizen aktualisiert: ' + KANAL, content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      kanalMeta = currentMeta;
      setMetaStatus('✓ Gespeichert', 'ok');
    } else {
      const err = await putResp.json();
      setMetaStatus('Fehler: ' + (err.message || putResp.status), 'err');
    }
  } catch(e) {
    setMetaStatus('Netzwerkfehler: ' + e.message, 'err');
  }
  btn.disabled = false;
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
