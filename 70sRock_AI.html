  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }

<script>
const CHANNEL = "70sRock AI";
const KANAL = "70sRock_AI.html";
const VIDEOS = [{"id": "024X0of7Rqs", "title": "Gary Moore & Jimi Hendrix 🔥 Midnight Crossroads | Emotional Blues Guitar Legends (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/024X0of7Rqs/mqdefault.jpg", "dur": "2:31:30"}, {"id": "mQxc3xDN7mM", "title": "Santana & Pink Floyd 🔥 Mountain of Echoes | Psychedelic Latin Rock Journey 432Hz (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/mQxc3xDN7mM/mqdefault.jpg", "dur": "2:31:30"}, {"id": "NLx6OVgH9Mk", "title": "Santana – Whiskey Knows My Name Slow Blues Guitar Night Session Santana Blues", "thumb": "https://i.ytimg.com/vi/NLx6OVgH9Mk/mqdefault.jpg", "dur": "1:45:38"}, {"id": "fNP9GuRd4wM", "title": "Carlos Santana & Robert Plant 🔥 Raw Blues Rock Explosion | Lost 70s Vocal Session (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/fNP9GuRd4wM/mqdefault.jpg", "dur": "2:22:29"}, {"id": "NAybxFQSdTE", "title": "Santana & Aretha Franklin - LIVE at Fillmore West 1971 (Lost Tapes - Full Album) [TRIBUTE]", "thumb": "https://i.ytimg.com/vi/NAybxFQSdTE/mqdefault.jpg", "dur": "2:22:29"}, {"id": "npCSXKLJQV8", "title": "Santana & Mark Knopfler – Soul Blues Explosion | Raw Emotion Inspired Tribute Session", "thumb": "https://i.ytimg.com/vi/npCSXKLJQV8/mqdefault.jpg", "dur": "2:22:29"}, {"id": "HcGvoBwDzKk", "title": "Pink Floyd & Santana – Psychedelic Rock & Cosmic Guitar | Full Experience Tribute", "thumb": "https://i.ytimg.com/vi/HcGvoBwDzKk/mqdefault.jpg", "dur": "2:06:37"}, {"id": "ETCld9G9euU", "title": "Gary Moore & Santana – Midnight Blues Inspired Tribute Soulful Guitar Legends Session", "thumb": "https://i.ytimg.com/vi/ETCld9G9euU/mqdefault.jpg", "dur": "2:06:37"}, {"id": "C9MYrcsSr_U", "title": "Carlos Santana & Mark Knopfler – The Sultans of Latin Rock | Legendary Guitar Tribute (Live 1980s)", "thumb": "https://i.ytimg.com/vi/C9MYrcsSr_U/mqdefault.jpg", "dur": "2:06:37"}, {"id": "86xCXVBOycs", "title": "Carlos Santana & Gary Moore – Midnight Sustain 1970s Electric Blues Duel - Inspired Tribute Session", "thumb": "https://i.ytimg.com/vi/86xCXVBOycs/mqdefault.jpg", "dur": "1:56:54"}, {"id": "4zZUsn0zHU4", "title": "Santana & Hendrix – Lost Tape Tribute | Rare Psychedelic Blues Rock Guitar Session", "thumb": "https://i.ytimg.com/vi/4zZUsn0zHU4/mqdefault.jpg", "dur": "1:56:54"}, {"id": "JaTqta9B194", "title": "Gary Moore & Santana – Midnight Blues Inspired Tribute Soulful Guitar Legends Session", "thumb": "https://i.ytimg.com/vi/JaTqta9B194/mqdefault.jpg", "dur": "1:56:54"}, {"id": "p4UvkJQsztU", "title": "Eric Clapton & B.B. King 🔥 Legendary Blues Session | Slow Hand Meets Lucille (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/p4UvkJQsztU/mqdefault.jpg", "dur": "1:56:17"}, {"id": "etad6ns8OSo", "title": "Janis Joplin & Etta James – Raw Blues Soul Experience | Lost Sessions Inspired Tribute", "thumb": "https://i.ytimg.com/vi/etad6ns8OSo/mqdefault.jpg", "dur": "1:56:17"}, {"id": "p0GVkGahPpI", "title": "Gary Moore & Mark Knopfler – Lost Blues Masterpiece | Emotional Guitar Tribute Experience", "thumb": "https://i.ytimg.com/vi/p0GVkGahPpI/mqdefault.jpg", "dur": "1:56:17"}, {"id": "9-T4fcxpcz0", "title": "Pink Floyd & Santana – Psychedelic Rock & Cosmic Guitar | Full Experience Tribute", "thumb": "https://i.ytimg.com/vi/9-T4fcxpcz0/mqdefault.jpg", "dur": "2:18:26"}, {"id": "zJe8Zd3avH4", "title": "Carlos Santana & Peter Green – Supernatural Albatross 1969 Psychedelic Blues Rare Inspired Tribute", "thumb": "https://i.ytimg.com/vi/zJe8Zd3avH4/mqdefault.jpg", "dur": "2:18:26"}, {"id": "MjPPwv2FZmE", "title": "Gary Moore & Santana – Midnight Blues Inspired Tribute Soulful Guitar Legends Session #music", "thumb": "https://i.ytimg.com/vi/MjPPwv2FZmE/mqdefault.jpg", "dur": "2:18:26"}, {"id": "0egDWJQltHM", "title": "B B King & Santana  – Midnight Blues Inspired Tribute Soulful Guitar Legends Session", "thumb": "https://i.ytimg.com/vi/0egDWJQltHM/mqdefault.jpg", "dur": "2:21:56"}, {"id": "NcwOtCmMR2c", "title": "B B King & Eric Clapton – The Thrill of the Crossroads 🎸 Classic Blues Guitar Album 1980s Style I", "thumb": "https://i.ytimg.com/vi/NcwOtCmMR2c/mqdefault.jpg", "dur": "2:21:56"}, {"id": "Z2Qz8E81-XU", "title": "John Lee Hooker & Howlin' Wolf – The Deep Growl Session 1962 Chicago Blues Rare Inspired Tribute Se", "thumb": "https://i.ytimg.com/vi/Z2Qz8E81-XU/mqdefault.jpg", "dur": "2:21:56"}, {"id": "AZ2CwtfgegI", "title": "Pink Floyd & David Gilmour 🎸 The Endless Solo (1975 Lost Sessions) | Psychedelic – Inspired Tribute", "thumb": "https://i.ytimg.com/vi/AZ2CwtfgegI/mqdefault.jpg", "dur": "2:14:24"}, {"id": "7dTFFni8HHk", "title": "B B King & Aretha Franklin – Lost Soul Blues Sessions Inspired Tribute Album", "thumb": "https://i.ytimg.com/vi/7dTFFni8HHk/mqdefault.jpg", "dur": "2:14:24"}, {"id": "50rfXuo11Gk", "title": "B B King & Eric Clapton – The Thrill of the Crossroads 🎸 Classic Blues Guitar Album 1980s Style I", "thumb": "https://i.ytimg.com/vi/50rfXuo11Gk/mqdefault.jpg", "dur": "2:14:24"}, {"id": "D8w7zITG6UY", "title": "Gary Moore & Santana – Midnight Blues Inspired Tribute Soulful Guitar Legends Session", "thumb": "https://i.ytimg.com/vi/D8w7zITG6UY/mqdefault.jpg", "dur": "2:08:03"}, {"id": "-lPr_8eBIU0", "title": "Carlos Santana & Mark Knopfler – The Sultans of Latin Rock | Legendary Guitar Tribute (Live 1980s)", "thumb": "https://i.ytimg.com/vi/-lPr_8eBIU0/mqdefault.jpg", "dur": "2:08:56"}, {"id": "OepORPm1-Og", "title": "Santana & Eric Clapton – Lost Guitar Sessions Latin Blues Rock Fusion (Full Album Tribute)", "thumb": "https://i.ytimg.com/vi/OepORPm1-Og/mqdefault.jpg", "dur": "2:08:56"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
