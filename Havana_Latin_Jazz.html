<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(180,150,255,0.4); }
  .channel-title { font-size: 1.5rem; font-weight: 300; color: #e0d7ff; letter-spacing: 0.05em; }
  .channel-count { font-size: 0.8rem; color: #7a6fa0; margin-top: 4px; }
  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>
</head>
<body>

  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/f7IDxj2YjEzaccNg-Deby_grlJcvy4CiGFZbxYDWRYlDUWTsMPyqkL7nBkrK_BOjDZBVMksvObQ=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Havana Latin Jazz</div>

<script>
const CHANNEL = "Havana Latin Jazz";
const VIDEOS = [{"id": "sQKHInRK7cs", "title": "Café Cubano Experience 🎶 Son Cubano, Latin Jazz & Cuban Soul", "thumb": "https://i.ytimg.com/vi/sQKHInRK7cs/mqdefault.jpg", "dur": "1:35:27"}, {"id": "TAdujaXZmYA", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/TAdujaXZmYA/mqdefault.jpg", "dur": "1:36:03"}, {"id": "LzEOiRsRTwM", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/LzEOiRsRTwM/mqdefault.jpg", "dur": "1:45:07"}, {"id": "TJDgljpFarI", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/TJDgljpFarI/mqdefault.jpg", "dur": "1:34:44"}, {"id": "LFQcSZ2WHVM", "title": "Happy Latin Jazz and Bossa Nova - Summer Jazz Music to Relax", "thumb": "https://i.ytimg.com/vi/LFQcSZ2WHVM/mqdefault.jpg", "dur": "1:33:38"}, {"id": "4zjDdMUT1D8", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/4zjDdMUT1D8/mqdefault.jpg", "dur": "1:34:49"}, {"id": "2swoW12P3Ms", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/2swoW12P3Ms/mqdefault.jpg", "dur": "1:20:32"}, {"id": "bKqfHn-fZFU", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/bKqfHn-fZFU/mqdefault.jpg", "dur": "1:35:27"}, {"id": "xxkwErmLwac", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/xxkwErmLwac/mqdefault.jpg", "dur": "2:15:20"}, {"id": "gBUv7Q8Jo14", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/gBUv7Q8Jo14/mqdefault.jpg", "dur": "1:36:05"}, {"id": "jAmUqmZWg74", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/jAmUqmZWg74/mqdefault.jpg", "dur": "1:23:18"}, {"id": "1xqvs64a8hw", "title": "Smooth Jazz Nights 🔥 Relaxing Latin Jazz & Lounge Music", "thumb": "https://i.ytimg.com/vi/1xqvs64a8hw/mqdefault.jpg", "dur": "1:17:14"}, {"id": "mAQbji1Y9pI", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/mAQbji1Y9pI/mqdefault.jpg", "dur": "1:19:30"}, {"id": "HFtTRjXjgMI", "title": "Smooth Jazz Nights - Relaxing Latin Jazz & Lounge Music (NO MID - ROLL ADS)", "thumb": "https://i.ytimg.com/vi/HFtTRjXjgMI/mqdefault.jpg", "dur": "3:12:10"}, {"id": "gcOrNzvrnp4", "title": "Smooth Jazz Nights - Relaxing Latin Jazz & Lounge Music", "thumb": "https://i.ytimg.com/vi/gcOrNzvrnp4/mqdefault.jpg", "dur": "1:11:58"}, {"id": "PcWdODyxCi8", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/PcWdODyxCi8/mqdefault.jpg", "dur": "1:29:48"}, {"id": "hyfMwNfjCgk", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/hyfMwNfjCgk/mqdefault.jpg", "dur": "1:29:42"}, {"id": "_aGpWSMewYA", "title": "Salsa Jazz Café - Latin Jazz Mix – Chill Latin Lounge, Cuban Vibes & Relaxing Music", "thumb": "https://i.ytimg.com/vi/_aGpWSMewYA/mqdefault.jpg", "dur": "1:32:37"}, {"id": "QWGnouGdbPY", "title": "Smooth Jazz Nights 🔥 Relaxing Latin Jazz & Lounge Music", "thumb": "https://i.ytimg.com/vi/QWGnouGdbPY/mqdefault.jpg", "dur": "1:40:00"}, {"id": "hFck6d-dFLg", "title": "Salsa Jazz Nights 🔥 Tropical Latin Jazz & Chill Lounge Mix", "thumb": "https://i.ytimg.com/vi/hFck6d-dFLg/mqdefault.jpg", "dur": "1:28:43"}, {"id": "77LWjPabfWg", "title": "Chill Latin Jazz for Sunset Cocktails - 1 HOUR Mellow Saxophone and Guitar", "thumb": "https://i.ytimg.com/vi/77LWjPabfWg/mqdefault.jpg", "dur": "1:40:54"}, {"id": "Y5yQzrt0ojA", "title": "Havana Cuban Jazz Playlist - Perfect Summer Vibes for Shoulder Dancing 🎷☀️", "thumb": "https://i.ytimg.com/vi/Y5yQzrt0ojA/mqdefault.jpg", "dur": "1:35:19"}, {"id": "Nqix24FRmhw", "title": "Smooth Jazz Nights 🔥 Relaxing Latin Jazz & Lounge Music", "thumb": "https://i.ytimg.com/vi/Nqix24FRmhw/mqdefault.jpg", "dur": "1:32:45"}, {"id": "KRfXW_E2jys", "title": "LATINO JAZZ - 1 Hour of Smooth Latino Jazz - Dance Rhythms & Vibrant Vibes 🎶🎷 -  NO ADS", "thumb": "https://i.ytimg.com/vi/KRfXW_E2jys/mqdefault.jpg", "dur": "1:36:16"}, {"id": "W1ZaDiOeJK4", "title": "(NO MID - ROLL ADS) Salsa Jazz Nights - Latin Jazz & Chill Lounge Mix - 1 Hour of Latin Jazz", "thumb": "https://i.ytimg.com/vi/W1ZaDiOeJK4/mqdefault.jpg", "dur": "1:24:04"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
