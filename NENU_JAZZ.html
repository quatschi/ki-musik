<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(180,150,255,0.4); }
  .channel-title { font-size: 1.5rem; font-weight: 300; color: #e0d7ff; letter-spacing: 0.05em; }
  .channel-count { font-size: 0.8rem; color: #7a6fa0; margin-top: 4px; }
  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .play-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(180,150,255,0.15); border: 1px solid rgba(180,150,255,0.4); color: #b496ff; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s ease; }
  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>
</head>
<body>
  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <a class="back" href="index.html">← Zurück zur Übersicht</a>
    <a class="back" href="radio2.html?kanal=NENU_JAZZ.html" style="border:1px solid rgba(180,150,255,0.4);padding:6px 14px;border-radius:20px">▶ Nur diesen Kanal im Radio</a>
  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/OhoSrWbPfJQXoub1mlqtz9B4wW8CAZcpAQb3MGdKV478v5kBMJfvu1CmS4PXnmxO9m7dg7ZJ2ws=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">NENU JAZZ</div>
      <div class="channel-count">18 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const CHANNEL = "NENU JAZZ";
const KANAL = "NENU_JAZZ.html";
const VIDEOS = [{"id": "XjwC_FydBug", "title": "KABUL JAZZ | The Melody of Your Inner Soul | 1 Hour Jazz for Deep Focus | Best Middle Eastern Jazz", "thumb": "https://i.ytimg.com/vi/XjwC_FydBug/mqdefault.jpg", "dur": "1:13:23"}, {"id": "SIl8tehzAro", "title": "Arabic Bulbul Jazz | When You are Alone | Chill Your Mind and Focus on Your Soul (1 HOUR)", "thumb": "https://i.ytimg.com/vi/SIl8tehzAro/mqdefault.jpg", "dur": "1:10:48"}, {"id": "pS4AIf6NPZM", "title": "Habibi Jazz | Midnight Arabic Desert Jazz | Chill Your Mind and Focus on Your Soul", "thumb": "https://i.ytimg.com/vi/pS4AIf6NPZM/mqdefault.jpg", "dur": "1:35:55"}, {"id": "TRnR9jlJ55g", "title": "Istanbul Noir Jazz | Where the soul is always alive | 1 Hour Noir Jazz for Late Night Relax", "thumb": "https://i.ytimg.com/vi/TRnR9jlJ55g/mqdefault.jpg", "dur": "1:07:56"}, {"id": "de7rbdV9l9w", "title": "Flamenco Meets Arabic Jazz | Midnight in Granada | Emotional Night Ambience", "thumb": "https://i.ytimg.com/vi/de7rbdV9l9w/mqdefault.jpg", "dur": "59:09"}, {"id": "AhTh77ILfrE", "title": "Echoes of the Orient: Dark Academia Arabic Noir Jazz for a Melancholic Soul", "thumb": "https://i.ytimg.com/vi/AhTh77ILfrE/mqdefault.jpg", "dur": "1:02:45"}, {"id": "qMGGt87P3-Q", "title": "Midnight in Isfahan | Dark Academia & Persian Noir Jazz for Deep Focus", "thumb": "https://i.ytimg.com/vi/qMGGt87P3-Q/mqdefault.jpg", "dur": "1:07:48"}, {"id": "2i7nlBgMEzw", "title": "Liberation of the Soul | Midnight Turkish Jazz", "thumb": "https://i.ytimg.com/vi/2i7nlBgMEzw/mqdefault.jpg", "dur": "1:09:49"}, {"id": "n6fE4QjfRHU", "title": "Afghan Midnight Jazz – Beloved Gone Forever | 1 Hour Chill & Deep Focus Music", "thumb": "https://i.ytimg.com/vi/n6fE4QjfRHU/mqdefault.jpg", "dur": "1:04:50"}, {"id": "_GvxmB-IRdE", "title": "Silent Moon Night Jazz | Persian Chill Jazz for Deep Focus (1 Hour)", "thumb": "https://i.ytimg.com/vi/_GvxmB-IRdE/mqdefault.jpg", "dur": "1:26:01"}, {"id": "d6sEmBKlb4Y", "title": "Full Moon Persian Jazz | Melancholy Afghan | 1 Hour Late Night Noir Jazz for Deep Focus", "thumb": "https://i.ytimg.com/vi/d6sEmBKlb4Y/mqdefault.jpg", "dur": "1:29:07"}, {"id": "snBA54pflco", "title": "Midnight Persian Jazz | 1 Hour Chill Jazz | Smoky Oud & Late Night Brass", "thumb": "https://i.ytimg.com/vi/snBA54pflco/mqdefault.jpg", "dur": "1:19:18"}, {"id": "CwroB5MIUV4", "title": "Persian Noir Jazz | Midnight Tea & Smoky Saxophone | Tehran After Dark | Melancholic Persian Jazz", "thumb": "https://i.ytimg.com/vi/CwroB5MIUV4/mqdefault.jpg", "dur": "1:04:56"}, {"id": "T2pgKRC5F7A", "title": "Habibi’s Blue Note | The Ultimate Arabic Jazz Fusion | Maqams Meet Jazz in One Seamless Groove", "thumb": "https://i.ytimg.com/vi/T2pgKRC5F7A/mqdefault.jpg", "dur": "1:02:32"}, {"id": "OML3GIhqicU", "title": "Desert Silent Moon | 1 Hour Arabian Midnight Jazz | Smoky Oud & Late Night Brass", "thumb": "https://i.ytimg.com/vi/OML3GIhqicU/mqdefault.jpg", "dur": "1:01:01"}, {"id": "l_KIlEuBcvk", "title": "Love of rain with silence । French Jazz Café | 1 Hour Relaxing Music", "thumb": "https://i.ytimg.com/vi/l_KIlEuBcvk/mqdefault.jpg", "dur": "1:28:50"}, {"id": "C2Z-OFrXUM0", "title": "Midnight Arabic Jazz – Soft Love, Silent Feelings | 1 Hour Relaxing Music", "thumb": "https://i.ytimg.com/vi/C2Z-OFrXUM0/mqdefault.jpg", "dur": "1:09:15"}, {"id": "1e1rbZpM8aY", "title": "ARABIC JAZZ - For Those Who Seek Solitude | 1 Hour Late Night Heart-touching Oasis Jazz", "thumb": "https://i.ytimg.com/vi/1e1rbZpM8aY/mqdefault.jpg", "dur": "1:02:48"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
</html>
