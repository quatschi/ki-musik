<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }

  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }

  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>
</head>
<body>

  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/IciwgDKEC0gGZ9P7yMZntPug-pUdH0GltRtwPvhU_hXPmBkj61LaficyOb0QNCk4n60kEns9bA=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Tribal Lounge Jazz</div>

<script>
const CHANNEL = "Tribal Lounge Jazz";
const VIDEOS = [{"id": "SRNJAcFrdMc", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/SRNJAcFrdMc/mqdefault.jpg", "dur": "2:08:24"}, {"id": "AEBGcB-JrKU", "title": "Tribal Lounge Jazz - Sacred Melodies ~ Instrumental Tribal Jazz", "thumb": "https://i.ytimg.com/vi/AEBGcB-JrKU/mqdefault.jpg", "dur": "2:01:26"}, {"id": "hudsOve1XjQ", "title": "Afro Ritual Jazz Instrumental | Midnight Tribal Lounge Mix ~ Deep African Rhythms", "thumb": "https://i.ytimg.com/vi/hudsOve1XjQ/mqdefault.jpg", "dur": "2:09:03"}, {"id": "AMU0GASPEfU", "title": "Hypnotic Tribal Lounge Jazz ~ Deeply Focused Ritual Melodies", "thumb": "https://i.ytimg.com/vi/AMU0GASPEfU/mqdefault.jpg", "dur": "2:06:20"}, {"id": "zKJ2x4nXqKs", "title": "Hypnotic Tribal Lounge Jazz ~ Deeply Focused Ritual Melodies", "thumb": "https://i.ytimg.com/vi/zKJ2x4nXqKs/mqdefault.jpg", "dur": "2:00:15"}, {"id": "HyNXvCfPsfM", "title": "Hypnotic Tribal Lounge Jazz ~ Deeply Focused Ritual Melodies", "thumb": "https://i.ytimg.com/vi/HyNXvCfPsfM/mqdefault.jpg", "dur": "2:01:00"}, {"id": "6SiPf3i7Ng0", "title": "Afro Tribal Jazz Night 🔥 Deep Grooves for Soulful Relaxation", "thumb": "https://i.ytimg.com/vi/6SiPf3i7Ng0/mqdefault.jpg", "dur": "2:02:01"}, {"id": "Qp6WP-hO4n0", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/Qp6WP-hO4n0/mqdefault.jpg", "dur": "2:09:31"}, {"id": "HMu--RdaivA", "title": "Tribal Lounge Jazz - Sacred Melodies ~ Instrumental Tribal Jazz", "thumb": "https://i.ytimg.com/vi/HMu--RdaivA/mqdefault.jpg", "dur": "2:02:40"}, {"id": "16pe_mD0lpE", "title": "Tribal Lounge Jazz - Sacred Melodies ~ Instrumental Tribal Jazz", "thumb": "https://i.ytimg.com/vi/16pe_mD0lpE/mqdefault.jpg", "dur": "2:09:07"}, {"id": "sJx5USAEG-Q", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/sJx5USAEG-Q/mqdefault.jpg", "dur": "2:12:27"}, {"id": "8c_7Klk5xy0", "title": "Late Night Afro Rituals | Deep Tribal Jazz | Sacred Rhythms", "thumb": "https://i.ytimg.com/vi/8c_7Klk5xy0/mqdefault.jpg", "dur": "2:06:33"}, {"id": "oNQXKHxkYto", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/oNQXKHxkYto/mqdefault.jpg", "dur": "2:07:30"}, {"id": "gjnsqx1Zi40", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/gjnsqx1Zi40/mqdefault.jpg", "dur": "2:11:17"}, {"id": "-5LdnLz-Vd8", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/-5LdnLz-Vd8/mqdefault.jpg", "dur": "2:05:55"}, {"id": "AJt0XGUfyi0", "title": "Deep Tribal Jazz Instrumental | After Hours Ritual Jazz ~ Relaxing Midnight Afro Rituals", "thumb": "https://i.ytimg.com/vi/AJt0XGUfyi0/mqdefault.jpg", "dur": "2:01:02"}, {"id": "WUL9LfORQZc", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/WUL9LfORQZc/mqdefault.jpg", "dur": "2:02:41"}, {"id": "nkKAfny_Qo0", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/nkKAfny_Qo0/mqdefault.jpg", "dur": "2:11:20"}, {"id": "Vq3kKtJpw4w", "title": "Deep Tribal Jazz | Midnight Afro Rituals ~ Relaxing Sacred Melodies", "thumb": "https://i.ytimg.com/vi/Vq3kKtJpw4w/mqdefault.jpg", "dur": "2:09:31"}, {"id": "aCdD4gpUmTE", "title": "Deep Tribal Jazz Instrumental | After Hours Ritual Jazz ~ Relaxing Midnight Afro Rituals", "thumb": "https://i.ytimg.com/vi/aCdD4gpUmTE/mqdefault.jpg", "dur": "2:00:50"}, {"id": "henvPNMrzrU", "title": "Afro Tribal Jazz ~ Deep Ritual Grooves for Focus & Study", "thumb": "https://i.ytimg.com/vi/henvPNMrzrU/mqdefault.jpg", "dur": "2:07:22"}, {"id": "Y7J531t5VRM", "title": "Afro Tribal Jazz - Ancient Rhythms ~ Deep Tribal Grooves", "thumb": "https://i.ytimg.com/vi/Y7J531t5VRM/mqdefault.jpg", "dur": "2:01:53"}, {"id": "rp0fAX-Kf8o", "title": "Deep Tribal Jazz | Sacred Afro Rituals | Mystic Lounge", "thumb": "https://i.ytimg.com/vi/rp0fAX-Kf8o/mqdefault.jpg", "dur": "2:00:16"}, {"id": "7ljeWtH8nyg", "title": "Deep Tribal Jazz Instrumental | Afro Ritual Lounge for Relaxation", "thumb": "https://i.ytimg.com/vi/7ljeWtH8nyg/mqdefault.jpg", "dur": "2:01:42"}, {"id": "3Eh06uUzNQk", "title": "Hypnotic Tribal Lounge Jazz ~ Deeply Focused Ritual Melodies", "thumb": "https://i.ytimg.com/vi/3Eh06uUzNQk/mqdefault.jpg", "dur": "2:09:40"}, {"id": "yyQ2MIu-IjE", "title": "Deep Tribal Jazz Instrumental | Relaxing Afro Ritual Music for Focus", "thumb": "https://i.ytimg.com/vi/yyQ2MIu-IjE/mqdefault.jpg", "dur": "2:07:14"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
