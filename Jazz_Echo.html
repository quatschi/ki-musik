mb": "https://i.ytimg.com/vi/qz1gxBaxkEk/mqdefault.jpg", "dur": "1:24:44"}, {"id": "EYFw09x9B38", "title": "Noir Jazz & Smoky Blues for a Rain-Slicked Night - Late Night Jazz Lounge for Deep Focus", "thumb": "https://i.ytimg.com/vi/EYFw09x9B38/mqdefault.jpg", "dur": "1:25:08"}, {"id": "qZ_gZJQSWLI", "title": "Noir Jazz Lounge   Late Night Chill Blues   Relaxing Vintage Mood Music for Sleep & Study", "thumb": "https://i.ytimg.com/vi/qZ_gZJQSWLI/mqdefault.jpg", "dur": "1:25:03"}, {"id": "imK04gg4SLI", "title": "Noir Jazz Lounge | Late Night Chill Vibes & Smooth City Blues and Relaxation 🌃", "thumb": "https://i.ytimg.com/vi/imK04gg4SLI/mqdefault.jpg", "dur": "1:22:49"}, {"id": "qSb0l6ROb3k", "title": "Midnight Noir Jazz Lounge~ Relaxing Late Night Blues Whiskey Vibes", "thumb": "https://i.ytimg.com/vi/qSb0l6ROb3k/mqdefault.jpg", "dur": "1:21:10"}, {"id": "SSC4M4Ewv4k", "title": "Noir Jazz ~ Midnight Jazz Lounge and Relaxing Jazz for a Smoky Late Night Jazz Atmosphere", "thumb": "https://i.ytimg.com/vi/SSC4M4Ewv4k/mqdefault.jpg", "dur": "1:23:47"}, {"id": "zm04-bFyM8c", "title": "Noir Jazz Lounge ~ Late Night Chill Jazz Whiskey Vibes", "thumb": "https://i.ytimg.com/vi/zm04-bFyM8c/mqdefault.jpg", "dur": "1:26:15"}, {"id": "A3dSxnOKg3M", "title": "Noir Jazz & Smoky Jazz Lounge - Late Night Jazz Melodies for a Relaxing Midnight Atmosphere", "thumb": "https://i.ytimg.com/vi/A3dSxnOKg3M/mqdefault.jpg", "dur": "1:25:42"}, {"id": "j7c8mfyghpE", "title": "Late Night Jazz - Relaxing Jazz Lounge Music with Smoky Jazz & Chill Jazz Instrumental Mix", "thumb": "https://i.ytimg.com/vi/j7c8mfyghpE/mqdefault.jpg", "dur": "1:21:35"}, {"id": "LwnjWxN9gKA", "title": "Noir Jazz Lounge ~ Midnight Jazz Vibes for a Smoky Whiskey Night", "thumb": "https://i.ytimg.com/vi/LwnjWxN9gKA/mqdefault.jpg", "dur": "1:23:36"}, {"id": "zkw3bbDMLFs", "title": "Noir Jazz & Smoky Blues ~ Relaxing Jazz Lounge for Late Night Midnight Vibes at Jazz Echo", "thumb": "https://i.ytimg.com/vi/zkw3bbDMLFs/mqdefault.jpg", "dur": "1:22:16"}, {"id": "gV188hZezh8", "title": "Noir Jazz Lounge | Late Night Chill Vibes & Whiskey Blues for Deep Relaxation & Calm", "thumb": "https://i.ytimg.com/vi/gV188hZezh8/mqdefault.jpg", "dur": "1:24:09"}, {"id": "5yDXrvO_v5Q", "title": "Noir Jazz Evening Smooth Vintage Melodies ~ Relaxing Late Night Jazz Lounge Playlists", "thumb": "https://i.ytimg.com/vi/5yDXrvO_v5Q/mqdefault.jpg", "dur": "1:22:55"}, {"id": "p8aTYg2yh3g", "title": "Noir jazz music for a rainy night ~ Relaxing jazz lounge and smooth midnight jazz rhythm", "thumb": "https://i.ytimg.com/vi/p8aTYg2yh3g/mqdefault.jpg", "dur": "1:23:18"}, {"id": "ithN-0FS0kI", "title": "Noir Jazz & Smoky Jazz Lounge - Relaxing Late Night Jazz Music for a Vintage Midnight Vibe", "thumb": "https://i.ytimg.com/vi/ithN-0FS0kI/mqdefault.jpg", "dur": "1:20:58"}, {"id": "sHhMQVRYjhc", "title": "Vintage Jazz Music | Whiskey Jazz | Smooth Saxophone for a Rainy Night in the Urban Jungle", "thumb": "https://i.ytimg.com/vi/sHhMQVRYjhc/mqdefault.jpg", "dur": "1:23:12"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
