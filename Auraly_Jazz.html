<style>

  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }

  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }

  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .play-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(180,150,255,0.15); border: 1px solid rgba(180,150,255,0.4); color: #b496ff; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s ease; }
  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>

    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>

<script>
const CHANNEL = "Auraly Jazz";
const KANAL = "Auraly_Jazz.html";
const VIDEOS = [{"id": "6gQYtedBWWo", "title": "Relaxing Jazz by the Lake 🌅 Smooth Evening Jazz & Chill Lounge Music", "thumb": "https://i.ytimg.com/vi/6gQYtedBWWo/mqdefault.jpg", "dur": "29:43"}, {"id": "T7nQH6d6pQQ", "title": "Smooth Jazz Countryside 🌿 Relaxing Jazz Music for Morning Coffee & Peaceful Vibes", "thumb": "https://i.ytimg.com/vi/T7nQH6d6pQQ/mqdefault.jpg", "dur": "33:53"}, {"id": "CEN-nwKzH4s", "title": "Smooth Jazz Lounge • Relax & Unwind | Chill Night Jazz Music 🎷🌙", "thumb": "https://i.ytimg.com/vi/CEN-nwKzH4s/mqdefault.jpg", "dur": "36:19"}, {"id": "v1DMz2sdKcs", "title": "Midnight Jazz Vibes 🌙 | Relaxing Smooth Jazz Music for Study, Work & Sleep", "thumb": "https://i.ytimg.com/vi/v1DMz2sdKcs/mqdefault.jpg", "dur": "35:30"}, {"id": "bxNXGuvYboo", "title": "Smooth Jazz by the Lake 🌅 Relaxing Evening Jazz Music for Study, Sleep & Chill", "thumb": "https://i.ytimg.com/vi/bxNXGuvYboo/mqdefault.jpg", "dur": "28:47"}, {"id": "RalP7glKuOA", "title": "Neon City Jazz Lounge 🌆☕ | Smooth Jazz Cafe Music for Relaxing Nights", "thumb": "https://i.ytimg.com/vi/RalP7glKuOA/mqdefault.jpg", "dur": "32:21"}, {"id": "9HM9XoNZ0pw", "title": "Soft Jazz for Calm Nights ☕🎷 | Relaxing Night Jazz & Coffee Shop Ambience", "thumb": "https://i.ytimg.com/vi/9HM9XoNZ0pw/mqdefault.jpg", "dur": "31:29"}, {"id": "8uzpemSrq6w", "title": "Smooth Jazz Night Vibes 🌃🎷 Relaxing Jazz Music for Chill Nights & City Lights", "thumb": "https://i.ytimg.com/vi/8uzpemSrq6w/mqdefault.jpg", "dur": "28:12"}, {"id": "InF11fr39kU", "title": "Smooth Jazz & Chill ☕ Sunset Lounge Ambience | Relaxing Jazz Music for Evening Mood", "thumb": "https://i.ytimg.com/vi/InF11fr39kU/mqdefault.jpg", "dur": "29:32"}, {"id": "SOCB9pr8U8k", "title": "Late Night Jazz Lounge ☕ Smooth Jazz & Chill Beats for Relaxing Evenings", "thumb": "https://i.ytimg.com/vi/SOCB9pr8U8k/mqdefault.jpg", "dur": "35:05"}, {"id": "p0Nor9Or9Zg", "title": "Rainy Night Jazz Lounge ☔ Smooth Jazz Music for Relax, Study & Sleep", "thumb": "https://i.ytimg.com/vi/p0Nor9Or9Zg/mqdefault.jpg", "dur": "32:17"}, {"id": "v9MFInllH-I", "title": "Smooth Jazz Nights ☕ Relaxing Jazz Music for Evening Chill & Cozy Lounge Ambience", "thumb": "https://i.ytimg.com/vi/v9MFInllH-I/mqdefault.jpg", "dur": "37:18"}, {"id": "zjDb_X3KvDM", "title": "Golden Hour Jazz Lounge ☀️ Smooth Jazz Music for Relax, Study & Evening Chill", "thumb": "https://i.ytimg.com/vi/zjDb_X3KvDM/mqdefault.jpg", "dur": "38:49"}, {"id": "eTPEiqkemd8", "title": "Midnight Lounge Sessions 🌙 Smooth Jazz & Chill Night Vibes", "thumb": "https://i.ytimg.com/vi/eTPEiqkemd8/mqdefault.jpg", "dur": "30:33"}, {"id": "Rgn3KDkV5AQ", "title": "Relaxing Sunset Jazz 🌅 Smooth Lounge Music for Chill & Cozy Evening", "thumb": "https://i.ytimg.com/vi/Rgn3KDkV5AQ/mqdefault.jpg", "dur": "10:08"}, {"id": "H-KeuplDCf0", "title": "Smooth Lounge Nights 🎷 Relaxing Jazz Cafe Music for Study, Chill & Sleep", "thumb": "https://i.ytimg.com/vi/H-KeuplDCf0/mqdefault.jpg", "dur": "30:31"}, {"id": "P4RieHNW_Yo", "title": "Smooth Night Lounge 🎷 Relaxing Jazz & Chill Cafe Music for Study, Work, Sleep", "thumb": "https://i.ytimg.com/vi/P4RieHNW_Yo/mqdefault.jpg", "dur": "30:34"}, {"id": "fQr13zuYRss", "title": "Smooth Jazz Lounge ☕ Relaxing Evening Jazz Music for Chill, Study & Cozy Nights", "thumb": "https://i.ytimg.com/vi/fQr13zuYRss/mqdefault.jpg", "dur": "30:18"}, {"id": "XHdasU9pa5g", "title": "Elegant Jazz Lounge ☕ Smooth Night Jazz Music for Relax, Study & Chill", "thumb": "https://i.ytimg.com/vi/XHdasU9pa5g/mqdefault.jpg", "dur": "33:35"}, {"id": "ioI-dXq1rbA", "title": "Evening Jazz Lounge 🌅 Smooth Jazz by the Sea | Relaxing Sunset Music", "thumb": "https://i.ytimg.com/vi/ioI-dXq1rbA/mqdefault.jpg", "dur": "32:02"}, {"id": "JZdFtiNLwuM", "title": "Late Night Jazz Lounge 🌙 Smooth Jazz Music for Relaxing Nights & Chill Vibes", "thumb": "https://i.ytimg.com/vi/JZdFtiNLwuM/mqdefault.jpg", "dur": "30:08"}, {"id": "_Z0-j2Mb96c", "title": "Rainy Night Jazz Vibes 🌧️ | Smooth Jazz for Relax, Study & Sleep", "thumb": "https://i.ytimg.com/vi/_Z0-j2Mb96c/mqdefault.jpg", "dur": "32:57"}, {"id": "WEfb7Yp5Kqw", "title": "Evening Jazz Escape 🎷 Cozy Night Vibes & Relaxing Smooth Jazz", "thumb": "https://i.ytimg.com/vi/WEfb7Yp5Kqw/mqdefault.jpg", "dur": "30:08"}, {"id": "C72pm157s34", "title": "Soft Lights, Smooth Jazz Nights | Cozy Evening Jazz for Relaxing & Chilling", "thumb": "https://i.ytimg.com/vi/C72pm157s34/mqdefault.jpg", "dur": "30:48"}, {"id": "QWFM-sk72P0", "title": "Chill Jazz Cafe – Smooth Saxophone & R&B Instrumental Mix", "thumb": "https://i.ytimg.com/vi/QWFM-sk72P0/mqdefault.jpg", "dur": "32:47"}, {"id": "g68I-Kn9iSw", "title": "Relaxing Jazz & Soul R&B – Warm Saxophone Chill Mix", "thumb": "https://i.ytimg.com/vi/g68I-Kn9iSw/mqdefault.jpg", "dur": "30:07"}, {"id": "nFfg9yozdI4", "title": "Smooth Jazz & Soul R&B Instrumental – Warm Sax & Guitar for Relaxing Night", "thumb": "https://i.ytimg.com/vi/nFfg9yozdI4/mqdefault.jpg", "dur": "30:20"}, {"id": "EWkKQVqUOSw", "title": "Midnight Jazz Escape – Smooth Sax & Soul R&B for Relaxing Nights", "thumb": "https://i.ytimg.com/vi/EWkKQVqUOSw/mqdefault.jpg", "dur": "30:45"}, {"id": "0qMIQb6kCps", "title": "Smooth Jazz Sunset – Piano, Trumpet & Guitar for a Relaxing Evening", "thumb": "https://i.ytimg.com/vi/0qMIQb6kCps/mqdefault.jpg", "dur": "31:33"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
