<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestige Coffee Jazz</title>
<!-- categories: Lounge, Jazz -->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(180,150,255,0.4); }
  .channel-title { font-size: 1.5rem; font-weight: 300; color: #e0d7ff; letter-spacing: 0.05em; }
  .channel-count { font-size: 0.8rem; color: #7a6fa0; margin-top: 4px; }
  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .play-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(180,150,255,0.15); border: 1px solid rgba(180,150,255,0.4); color: #b496ff; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s ease; }
  .play-btn:hover { background: rgba(180,150,255,0.35); border-color: rgba(180,150,255,0.8); color: #fff; }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .save-btn:disabled { background: #3a2a70; cursor: wait; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }
  .status-ok { color: #6fcf97; }
  .status-err { color: #eb5757; }
  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
  .meta-box { max-width: 860px; margin: 0 auto 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px 20px; }
  .meta-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .meta-row:last-child { margin-bottom: 0; }
  .meta-label { font-size: 0.78rem; color: #9b8fc0; letter-spacing: 0.03em; }
  .meta-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 12px; color: white; font-size: 0.88rem; font-family: inherit; }
  .meta-input:focus { outline: none; border-color: rgba(180,150,255,0.5); }
  textarea.meta-input { resize: vertical; min-height: 60px; }
  .meta-save-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .meta-save-btn { background: #5a3fa0; color: white; border: none; padding: 7px 18px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .meta-save-btn:hover { background: #7a5fc0; }
  .meta-save-btn:disabled { background: #3a2a70; cursor: wait; }
  .meta-status { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }
  .meta-status.ok { color: #6fcf97; }
  .meta-status.err { color: #eb5757; }
</style>
</head>
<body>

<div class="token-overlay" id="token-overlay">
  <div class="token-box">
    <h2>🔑 GitHub Token eingeben</h2>
    <p>Das Token wird nur in diesem Browser gespeichert und direkt an GitHub übertragen.</p>
    <input type="password" id="token-input" placeholder="github_pat_...">
    <button class="token-confirm" onclick="saveToken()">Bestätigen</button>
  </div>
</div>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <a class="back" href="index.html">← Zurück zur Übersicht</a>
    <a class="back" href="radio2.html?kanal=Prestige_Coffee_Jazz.html" style="border:1px solid rgba(180,150,255,0.4);padding:6px 14px;border-radius:20px">▶ Nur diesen Kanal im Radio</a>
  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/4IMb_j_9YPTaM_kMWh9aoWru01-7TwM35O7OTGVB9A7DGOLZ5-TrQDOSduMBkVMnfJ81CqUD4m4=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Prestige Coffee Jazz</div>
      <div class="channel-count">18 Videos</div>
    </div>
  </div>

  <div class="meta-box">
    <div class="meta-row">
      <label class="meta-label" for="meta-categories">Kategorien</label>
      <input type="text" id="meta-categories" class="meta-input" placeholder="z.B. Jazz, Lounge">
    </div>
    <div class="meta-row">
      <label class="meta-label" for="meta-notes">Notizen</label>
      <textarea id="meta-notes" class="meta-input" placeholder="Beobachtungen zu diesem Kanal..."></textarea>
    </div>
    <div class="meta-save-row">
      <button class="meta-save-btn" id="meta-save-btn" onclick="saveMeta()">💾 Kategorien/Notizen speichern</button>
      <span class="meta-status" id="meta-status"></span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const META_FILE = 'kanal_meta.json';
const CHANNEL = "Prestige Coffee Jazz";
const KANAL = "Prestige_Coffee_Jazz.html";
const ORIG_CATEGORIES = "Lounge, Jazz";
const VIDEOS = [{"id": "pdx9OQUuSKY", "title": "Relaxing Jazz Coffee | Morning Coffee Jazz & Smooth Jazz Coffee Shop Music for Study Work", "thumb": "https://i.ytimg.com/vi/pdx9OQUuSKY/mqdefault.jpg", "dur": "2:03:29"}, {"id": "CG9yxNa6kLM", "title": "Relaxing Jazz Coffee & Smooth Morning Coffee Jazz Music for a Positive Day and Focus Work", "thumb": "https://i.ytimg.com/vi/CG9yxNa6kLM/mqdefault.jpg", "dur": "2:06:18"}, {"id": "en4pv5UfJHI", "title": "Relaxing Jazz Coffee Music | Smooth Coffee Shop Jazz & Cafe Jazz Ambience for Focus & Chill -", "thumb": "https://i.ytimg.com/vi/en4pv5UfJHI/mqdefault.jpg", "dur": "2:04:08"}, {"id": "RpA4RiMjVbk", "title": "Relaxing Jazz Coffee | Morning Vibes & Smooth Melodies for Your Cafe", "thumb": "https://i.ytimg.com/vi/RpA4RiMjVbk/mqdefault.jpg", "dur": "2:06:44"}, {"id": "d3oQgIdM180", "title": "Jazz Coffee & Chill Cafe Ambience | Relaxing Smooth Jazz for Morning Serenity", "thumb": "https://i.ytimg.com/vi/d3oQgIdM180/mqdefault.jpg", "dur": "2:02:32"}, {"id": "Up3vJtMU_3Q", "title": "Relaxing Jazz Coffee - Soft Jazz Cafe Music for Your Morning Coffee Jazz ~ Smooth Melodies", "thumb": "https://i.ytimg.com/vi/Up3vJtMU_3Q/mqdefault.jpg", "dur": "2:01:59"}, {"id": "aE7GQFVZQb4", "title": "Relaxing Jazz Coffee Vibes ~ Smooth Jazz Music for Coffee Time", "thumb": "https://i.ytimg.com/vi/aE7GQFVZQb4/mqdefault.jpg", "dur": "2:04:09"}, {"id": "Rv46AEiZ4kA", "title": "Relaxing Jazz Coffee | Smooth Jazz Music Cafe ~ Cozy Coffee Lounge Jazz Instrumental Ambient", "thumb": "https://i.ytimg.com/vi/Rv46AEiZ4kA/mqdefault.jpg", "dur": "2:04:19"}, {"id": "iHtnPJEziqc", "title": "Morning Coffee Jazz ~ Relaxing Cafe Ambiance for Your Day", "thumb": "https://i.ytimg.com/vi/iHtnPJEziqc/mqdefault.jpg", "dur": "2:05:25"}, {"id": "IQhAClIHdBA", "title": "Relaxing Jazz Coffee - Smooth Coffee Jazz Music & Cozy Coffee Shop Jazz Cafe Ambience Rela", "thumb": "https://i.ytimg.com/vi/IQhAClIHdBA/mqdefault.jpg", "dur": "2:03:50"}, {"id": "zenFdHd_fyI", "title": "Relaxing Jazz Coffee & Smooth Morning Coffee Jazz - Chill Coffee Shop Jazz Music Ambience", "thumb": "https://i.ytimg.com/vi/zenFdHd_fyI/mqdefault.jpg", "dur": "2:01:47"}, {"id": "cxansjrBHKY", "title": "Morning coffee jazz | Relaxing jazz coffee and cafe jazz ambience for a productive day", "thumb": "https://i.ytimg.com/vi/cxansjrBHKY/mqdefault.jpg", "dur": "2:07:33"}, {"id": "FdD2M4-HRN0", "title": "Relaxing Jazz Coffee Music | Smooth Jazz Cafe Ambience for Work, Study & Morning Coffee Time", "thumb": "https://i.ytimg.com/vi/FdD2M4-HRN0/mqdefault.jpg", "dur": "2:05:08"}, {"id": "zIziueyGDpM", "title": "Morning Coffee Jazz | Relaxing Ocean View & Smooth Cafe Jazz Music Ambience", "thumb": "https://i.ytimg.com/vi/zIziueyGDpM/mqdefault.jpg", "dur": "2:01:58"}, {"id": "TF6Dxc_vslg", "title": "Relaxing Jazz Coffee & Smooth Jazz Coffee Music ~ Soft Jazz Cafe Ambience for Chill Morning-", "thumb": "https://i.ytimg.com/vi/TF6Dxc_vslg/mqdefault.jpg", "dur": "2:00:17"}, {"id": "WK2BmnSesOM", "title": "Relaxing Jazz Coffee - Smooth Morning Coffee Jazz & Chill Cafe Jazz Ambience for Studying", "thumb": "https://i.ytimg.com/vi/WK2BmnSesOM/mqdefault.jpg", "dur": "2:07:03"}, {"id": "3o7Tml9c3hU", "title": "Relaxing Jazz Coffee | Smooth Morning Coffee Jazz Music & Cozy Cafe Ambiance for Focus Now", "thumb": "https://i.ytimg.com/vi/3o7Tml9c3hU/mqdefault.jpg", "dur": "2:03:48"}, {"id": "jIux6wS4RmY", "title": "Relaxing Jazz Coffee Music | Smooth Jazz Cafe Ambience for Work, Study & Morning Focus", "thumb": "https://i.ytimg.com/vi/jIux6wS4RmY/mqdefault.jpg", "dur": "2:05:41"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;
let kanalMeta = {};

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  await loadKanalMeta();
  renderGrid();
}

async function loadKanalMeta() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      kanalMeta = JSON.parse(atob(data.content));
    }
  } catch(e) {}
  const entry = kanalMeta[KANAL] || {};
  document.getElementById('meta-categories').value = (entry.categories !== undefined) ? entry.categories : ORIG_CATEGORIES;
  document.getElementById('meta-notes').value = entry.notizen || '';
}

function setMetaStatus(msg, cls) {
  const el = document.getElementById('meta-status');
  el.textContent = msg;
  el.className = 'meta-status ' + (cls || '');
}

async function saveMeta() {
  const btn = document.getElementById('meta-save-btn');
  btn.disabled = true;
  setMetaStatus('Speichern...', '');
  const newCategories = document.getElementById('meta-categories').value.trim();
  const newNotes = document.getElementById('meta-notes').value;
  try {
    let sha = null;
    let currentMeta = {};
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) {
      const existing = await getResp.json();
      sha = existing.sha;
      currentMeta = JSON.parse(atob(existing.content));
    }
    currentMeta[KANAL] = { categories: newCategories, notizen: newNotes };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(currentMeta, null, 2))));
    const body = { message: 'Kategorien/Notizen aktualisiert: ' + KANAL, content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${META_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      kanalMeta = currentMeta;
      setMetaStatus('✓ Gespeichert', 'ok');
    } else {
      const err = await putResp.json();
      setMetaStatus('Fehler: ' + (err.message || putResp.status), 'err');
    }
  } catch(e) {
    setMetaStatus('Netzwerkfehler: ' + e.message, 'err');
  }
  btn.disabled = false;
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
