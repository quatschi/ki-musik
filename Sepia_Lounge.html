r": "2:10:59"}, {"id": "SYoDqLOLX6w", "title": "Slow Sips – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/SYoDqLOLX6w/mqdefault.jpg", "dur": "2:17:50"}, {"id": "Z1myHXZRGxk", "title": "One More Pour – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/Z1myHXZRGxk/mqdefault.jpg", "dur": "2:13:22"}, {"id": "SoQXvmr6NXA", "title": "After Hours  – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/SoQXvmr6NXA/mqdefault.jpg", "dur": "2:08:24"}, {"id": "Adt3eNMRyqY", "title": "Coffee. Jazz. Nothing Else. – Vintage Noir Jazz for a Calm Morning", "thumb": "https://i.ytimg.com/vi/Adt3eNMRyqY/mqdefault.jpg", "dur": "2:17:10"}, {"id": "g4dScvHrXC8", "title": "No Rush. Just Jazz. – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/g4dScvHrXC8/mqdefault.jpg", "dur": "2:16:31"}, {"id": "3SePnUkfyV0", "title": "Take It Slow Tonight – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/3SePnUkfyV0/mqdefault.jpg", "dur": "2:33:37"}, {"id": "4JIWnF6OiBs", "title": "No Rush Tonight – Vintage Noir Jazz for Quiet Evenings", "thumb": "https://i.ytimg.com/vi/4JIWnF6OiBs/mqdefault.jpg", "dur": "2:00:27"}, {"id": "meyUsak02Wc", "title": "The Black Cat’s Table – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/meyUsak02Wc/mqdefault.jpg", "dur": "2:32:45"}, {"id": "Nke6Ss6xhWU", "title": "The Quiet Gentleman – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/Nke6Ss6xhWU/mqdefault.jpg", "dur": "2:25:20"}, {"id": "k1hI-S6t4c8", "title": "1940s Nostalgic Jazz Playlist – Cozy Vintage Jazz Vibes", "thumb": "https://i.ytimg.com/vi/k1hI-S6t4c8/mqdefault.jpg", "dur": "2:37:40"}, {"id": "bX9fNj0vPGk", "title": "Velvet Noir Jazz Nights – 1940s Lounge Music for Quiet Evenings", "thumb": "https://i.ytimg.com/vi/bX9fNj0vPGk/mqdefault.jpg", "dur": "2:32:44"}, {"id": "bc07FlQ5ZXo", "title": "The Velvet Trumpet – Vintage Noir Jazz for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/bc07FlQ5ZXo/mqdefault.jpg", "dur": "2:32:47"}, {"id": "gk-lceWik1c", "title": "The Gentleman's Hour – Vintage Jazz Noir for Quiet Evenings", "thumb": "https://i.ytimg.com/vi/gk-lceWik1c/mqdefault.jpg", "dur": "2:18:30"}, {"id": "A35hxcieay0", "title": "Vintage Jazz Piano – 1940s Smooth Retro Jazz Lounge", "thumb": "https://i.ytimg.com/vi/A35hxcieay0/mqdefault.jpg", "dur": "2:24:50"}, {"id": "4aDUET73elY", "title": "1940s Jazz Noir - Deep Jazz Instrumental | Soothing Midnight Trumpet Music", "thumb": "https://i.ytimg.com/vi/4aDUET73elY/mqdefault.jpg", "dur": "2:09:19"}, {"id": "my14H66iGQU", "title": "Vintage Jazz for Late Hours – 1940s Noir Lounge Atmosphere", "thumb": "https://i.ytimg.com/vi/my14H66iGQU/mqdefault.jpg", "dur": "3:04:59"}, {"id": "TovjyfE6-2I", "title": "Midnight Jazz – Smoky 1940s Vintage Saxophone for Late Night Relaxation", "thumb": "https://i.ytimg.com/vi/TovjyfE6-2I/mqdefault.jpg", "dur": "2:35:30"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
