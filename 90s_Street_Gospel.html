<style>

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }

  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }

  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }

  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .save-btn:disabled { background: #3a2a70; cursor: wait; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }
  .status-ok { color: #6fcf97; }

  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>

<body>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">

  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/N5E_qVCQaq4ogRviAS0IT0yzknKR0F02B56diNBy9m-4d53JrnsR8kDap2yto4WrVc3f6xzQ=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">90s Street Gospel</div>
      <div class="channel-count">31 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "90s Street Gospel";
const VIDEOS = [{"id": "65oYaa0ZOEs", "title": "Macy Gray – Midnight Soul Stories 🌙 | Neo Soul, Jazz & Timeless Groove Sessions", "thumb": "https://i.ytimg.com/vi/65oYaa0ZOEs/mqdefault.jpg", "dur": "1:05:30"}, {"id": "SAq-fD2hRaE", "title": "Jill Scott – Soulful Serenity 🌿 | Neo Soul, Jazz & Conscious Groove Vibes", "thumb": "https://i.ytimg.com/vi/SAq-fD2hRaE/mqdefault.jpg", "dur": "1:05:55"}, {"id": "KkCwAKrOQS8", "title": "Cynthia Layne – Midnight Soul Reflections ✨ | Neo Soul, Jazz & Smooth R&B Vibes", "thumb": "https://i.ytimg.com/vi/KkCwAKrOQS8/mqdefault.jpg", "dur": "1:06:28"}, {"id": "a4xqt1Rv_9E", "title": "Lauryn Hill – Soul In The Shadows 🎤 | Neo Soul, Hip Hop Soul & Conscious Rap Vibes", "thumb": "https://i.ytimg.com/vi/a4xqt1Rv_9E/mqdefault.jpg", "dur": "1:05:20"}, {"id": "RUt6a_6B_nY", "title": "Erykah Badu – Soulful Reflections 🌿 | Neo Soul, Hip Hop Soul & Conscious Vibes", "thumb": "https://i.ytimg.com/vi/RUt6a_6B_nY/mqdefault.jpg", "dur": "1:09:07"}, {"id": "Z_a9s_Dk678", "title": "Alicia Keys – Soulful Reflections ✨ | Neo Soul, Hip Hop Jazz & Smooth R&B Vibes", "thumb": "https://i.ytimg.com/vi/Z_a9s_Dk678/mqdefault.jpg", "dur": "1:07:19"}, {"id": "QNFRwzj2id4", "title": "Sade – Velvet Midnight 🌙 | Neo Soul, Hip Hop & Jazz Vibes", "thumb": "https://i.ytimg.com/vi/QNFRwzj2id4/mqdefault.jpg", "dur": "1:10:41"}, {"id": "6nXPmOSx-EY", "title": "Mary J. Blige – Queen of Soulful Nights 👑 | Neo Soul, Hip Hop & Jazz Mix", "thumb": "https://i.ytimg.com/vi/6nXPmOSx-EY/mqdefault.jpg", "dur": "1:09:14"}, {"id": "c8uaqElD1nM", "title": "Angie Stone – Midnight Soul Sessions 🌙 | Neo Soul & Smooth Jazz Vibes", "thumb": "https://i.ytimg.com/vi/c8uaqElD1nM/mqdefault.jpg", "dur": "1:08:46"}, {"id": "iqRR9bL7Byw", "title": "Jill Scott – Timeless Neo Soul Grooves 💜 | Jazz, Hip Hop & Smooth Vibes", "thumb": "https://i.ytimg.com/vi/iqRR9bL7Byw/mqdefault.jpg", "dur": "1:05:24"}, {"id": "VzCjh5C78-U", "title": "Lauryn Hill – Soul In The Shadows | Neo Soul, Hip Hop Soul & Jazz Vibes", "thumb": "https://i.ytimg.com/vi/VzCjh5C78-U/mqdefault.jpg", "dur": "1:05:25"}, {"id": "sr0Z7UrjQ8k", "title": "Erykah Badu – Soul In The Shadows | Neo Soul & Smooth Jazz Vibes", "thumb": "https://i.ytimg.com/vi/sr0Z7UrjQ8k/mqdefault.jpg", "dur": "1:05:52"}, {"id": "kBooEaEyhKw", "title": "Alicia Keys – Soul in the Shadows | Hip Hop Soul, Neo Soul & Midnight Jazz Vibes (Timeless Mix)", "thumb": "https://i.ytimg.com/vi/kBooEaEyhKw/mqdefault.jpg", "dur": "1:11:57"}, {"id": "hdYvDOqrYzg", "title": "Queen Latifah – Crown & Soul Sessions | Hip Hop Soul, Jazz Rap & Conscious Groove (Timeless Mix)", "thumb": "https://i.ytimg.com/vi/hdYvDOqrYzg/mqdefault.jpg", "dur": "1:11:41"}, {"id": "ySNNMCKlXwQ", "title": "Faith Evans – Soul In The Shadows | Hip Hop Soul & Smooth Jazz Nights", "thumb": "https://i.ytimg.com/vi/ySNNMCKlXwQ/mqdefault.jpg", "dur": "1:07:55"}, {"id": "Ug4xtHmkJKI", "title": "Sade – Soul In The Shadows | Hip Hop Soul & Midnight Jazz Vibes", "thumb": "https://i.ytimg.com/vi/Ug4xtHmkJKI/mqdefault.jpg", "dur": "1:06:58"}, {"id": "aD3XMmqE4gY", "title": "Angie Stone – Neo Soul Groove Sessions 🎙️ Hip Hop Soul, Smooth Jazz & Late Night Vibes", "thumb": "https://i.ytimg.com/vi/aD3XMmqE4gY/mqdefault.jpg", "dur": "1:07:22"}, {"id": "8YgpFfgBSl8", "title": "Mary J. Blige – Queen of Hip Hop Soul 👑 Neo Soul, R&B & Smooth Jazz Vibes", "thumb": "https://i.ytimg.com/vi/8YgpFfgBSl8/mqdefault.jpg", "dur": "1:09:37"}, {"id": "yVs8A-GHf2w", "title": "Jill Scott – Hip Hop Soul in the Shadows 🌙 Neo Soul, Jazz & Conscious Groove Vibes", "thumb": "https://i.ytimg.com/vi/yVs8A-GHf2w/mqdefault.jpg", "dur": "1:11:57"}, {"id": "rDbthwHxzDQ", "title": "Lauryn Hill – Soul in the Shadows 🌙 Neo Soul, Hip Hop Soul & Conscious Jazz Vibes", "thumb": "https://i.ytimg.com/vi/rDbthwHxzDQ/mqdefault.jpg", "dur": "1:09:24"}, {"id": "kEMHtL8e_cU", "title": "Ledisi – Midnight Neo Soul Sessions | Smooth Jazz, Soul & Late Night Vibes", "thumb": "https://i.ytimg.com/vi/kEMHtL8e_cU/mqdefault.jpg", "dur": "1:02:27"}, {"id": "y6YkocQKqzM", "title": "Erykah Badu – Hip Hop Soul Vibes | Neo Soul, Conscious R&B & Deep Chill Sessions", "thumb": "https://i.ytimg.com/vi/y6YkocQKqzM/mqdefault.jpg", "dur": "1:01:23"}, {"id": "MrZz-fl3HgM", "title": "Lauryn Hill – Soul in the Shadows | Hip Hop Soul & Neo Soul Mix", "thumb": "https://i.ytimg.com/vi/MrZz-fl3HgM/mqdefault.jpg", "dur": "1:09:55"}, {"id": "QnoZKb2jgRk", "title": "Angie Stone – Late Night Soul Grooves | Neo Soul & Jazz Vibes", "thumb": "https://i.ytimg.com/vi/QnoZKb2jgRk/mqdefault.jpg", "dur": "1:08:06"}, {"id": "bF7L1SJkAI0", "title": "Jill Scott – Neo Soul Hip Hop Jazz Sessions 🎙️ Soulful Vibes & Conscious R&B Classics", "thumb": "https://i.ytimg.com/vi/bF7L1SJkAI0/mqdefault.jpg", "dur": "1:11:48"}, {"id": "z6ecFEWy0dw", "title": "India Arie – Deep Midnight Soul | Neo Soul, Jazz & Smooth R&B (Late Night Mood)", "thumb": "https://i.ytimg.com/vi/z6ecFEWy0dw/mqdefault.jpg", "dur": "1:07:29"}, {"id": "o7N0yDZcg38", "title": "Alicia Keys – Neo Soul Midnight Spirit | Hip Hop Jazz & Smooth Soul", "thumb": "https://i.ytimg.com/vi/o7N0yDZcg38/mqdefault.jpg", "dur": "1:07:10"}, {"id": "ynGMHqqRfns", "title": "Mary J. Blige – Midnight Soul 🎙 Neo Soul & Smooth R&B Vibes (Late Night)", "thumb": "https://i.ytimg.com/vi/ynGMHqqRfns/mqdefault.jpg", "dur": "1:04:01"}, {"id": "QOUbVm6u1Vg", "title": "Lauryn Hill – 90s Hip Hop Soul 🎤 Neo Soul & Conscious Rap Vibes", "thumb": "https://i.ytimg.com/vi/QOUbVm6u1Vg/mqdefault.jpg", "dur": "1:10:28"}, {"id": "jY6HpMs6624", "title": "Queen Latifah – Crown & Soul 🎤 90s Hip Hop Soul & Jazz Rap Vibes (Full Album Inspired)", "thumb": "https://i.ytimg.com/vi/jY6HpMs6624/mqdefault.jpg", "dur": "1:11:42"}, {"id": "mqXHk52juzg", "title": "Jill Scott – Neo Soul & Hip Hop Soul 🎶 Jazz Groove, Smooth & Timeless Vibes", "thumb": "https://i.ytimg.com/vi/mqXHk52juzg/mqdefault.jpg", "dur": "52:04"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  // Meta-Daten für Best-Of mitspeichern
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
