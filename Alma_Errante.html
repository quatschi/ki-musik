  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }

  .status-msg { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }

  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>

<body>

    <input type="password" id="token-input" placeholder="github_pat_...">

</div>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">

  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/6gC6_QgY-mQtB7KaR6PBnujdQgwRdjf0MBpCVqvUsaaC41sxXfrFeJ7beJDT_4O0gFQq7AJf=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Alma Errante</div>
      <div class="channel-count">32 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "Alma Errante";
const VIDEOS = [{"id": "QQVyRJlQv8k", "title": "Bolero en la Vieja Habana", "thumb": "https://i.ytimg.com/vi/QQVyRJlQv8k/mqdefault.jpg", "dur": "1:27:01"}, {"id": "rjfE4YTlpck", "title": "Bolero en la Vieja Habana", "thumb": "https://i.ytimg.com/vi/rjfE4YTlpck/mqdefault.jpg", "dur": "1:12:44"}, {"id": "BE4zk_jQqMw", "title": "Cuando La Habana Suspira – Sombras, Lluvia y Recuerdos", "thumb": "https://i.ytimg.com/vi/BE4zk_jQqMw/mqdefault.jpg", "dur": "1:18:29"}, {"id": "-jRbT5jKw0w", "title": "Susurros de La Habana – Bolero en la Madrugada", "thumb": "https://i.ytimg.com/vi/-jRbT5jKw0w/mqdefault.jpg", "dur": "1:33:42"}, {"id": "thU6D6-8hwk", "title": "Bolero en la Madrugada – Noches de La Habana", "thumb": "https://i.ytimg.com/vi/thU6D6-8hwk/mqdefault.jpg", "dur": "1:17:05"}, {"id": "JjsbdjBLqsE", "title": "Noches de La Habana – Sombras y Nostalgia", "thumb": "https://i.ytimg.com/vi/JjsbdjBLqsE/mqdefault.jpg", "dur": "1:07:18"}, {"id": "0YOwQtiLydo", "title": "Hasta la Vejez – Amor para Siempre", "thumb": "https://i.ytimg.com/vi/0YOwQtiLydo/mqdefault.jpg", "dur": "1:36:04"}, {"id": "KuMhx8elws8", "title": "Como en una Película Vieja | Retro Cuban Bolero", "thumb": "https://i.ytimg.com/vi/KuMhx8elws8/mqdefault.jpg", "dur": "1:22:44"}, {"id": "nlrUTXGVjCk", "title": "Susurros de La Habana – Bolero Bajo la Luna", "thumb": "https://i.ytimg.com/vi/nlrUTXGVjCk/mqdefault.jpg", "dur": "1:06:30"}, {"id": "ICYEvL0TA3k", "title": "Cuando La Habana Suspira – Sombras, Lluvia y Recuerdos", "thumb": "https://i.ytimg.com/vi/ICYEvL0TA3k/mqdefault.jpg", "dur": "1:18:29"}, {"id": "NcuikxapcSQ", "title": "Hasta la Vejez – Amor para Siempre", "thumb": "https://i.ytimg.com/vi/NcuikxapcSQ/mqdefault.jpg", "dur": "1:33:42"}, {"id": "b8rPJ3Vs71Q", "title": "Susurros de La Habana – Bolero en la Madrugada", "thumb": "https://i.ytimg.com/vi/b8rPJ3Vs71Q/mqdefault.jpg", "dur": "1:15:37"}, {"id": "NCkUwDgLWXU", "title": "La Habana en la Madrugada – Bolero y Nostalgia", "thumb": "https://i.ytimg.com/vi/NCkUwDgLWXU/mqdefault.jpg", "dur": "1:27:01"}, {"id": "0VOl_sq-5L0", "title": "Madrugada en La Habana – Café y Bolero", "thumb": "https://i.ytimg.com/vi/0VOl_sq-5L0/mqdefault.jpg", "dur": "1:12:44"}, {"id": "a4OwZdXD6hI", "title": "Bolero en la Vieja Habana", "thumb": "https://i.ytimg.com/vi/a4OwZdXD6hI/mqdefault.jpg", "dur": "1:06:27"}, {"id": "kLECOPPhQFA", "title": "Susurros de La Habana – Bolero Bajo la Luna", "thumb": "https://i.ytimg.com/vi/kLECOPPhQFA/mqdefault.jpg", "dur": "1:14:08"}, {"id": "TWKg1yK_Q9M", "title": "Susurros de La Habana – Bolero Bajo la Luna", "thumb": "https://i.ytimg.com/vi/TWKg1yK_Q9M/mqdefault.jpg", "dur": "1:07:11"}, {"id": "qTnQ7B3Dr1o", "title": "Madrugada en La Habana – Café y Bolero", "thumb": "https://i.ytimg.com/vi/qTnQ7B3Dr1o/mqdefault.jpg", "dur": "1:12:08"}, {"id": "H13bez8nyiw", "title": "Como en una Película Vieja | Retro Cuban Bolero", "thumb": "https://i.ytimg.com/vi/H13bez8nyiw/mqdefault.jpg", "dur": "1:21:57"}, {"id": "m9d_n4JeMo0", "title": "Bolero en la Madrugada – Noches de La Habana", "thumb": "https://i.ytimg.com/vi/m9d_n4JeMo0/mqdefault.jpg", "dur": "1:17:30"}, {"id": "A2O9l6GUMqw", "title": "La Habana en la Madrugada – Bolero y Nostalgia", "thumb": "https://i.ytimg.com/vi/A2O9l6GUMqw/mqdefault.jpg", "dur": "1:22:43"}, {"id": "swdbuasAZTA", "title": "Bolero de Amor en la Madrugada – La Habana", "thumb": "https://i.ytimg.com/vi/swdbuasAZTA/mqdefault.jpg", "dur": "1:26:01"}, {"id": "qktdoAY2Azk", "title": "Susurros de La Habana – Bolero en la Madrugada", "thumb": "https://i.ytimg.com/vi/qktdoAY2Azk/mqdefault.jpg", "dur": "1:09:41"}, {"id": "Uj_LP8M-9Gg", "title": "Como en una Película Vieja | Retro Cuban Bolero", "thumb": "https://i.ytimg.com/vi/Uj_LP8M-9Gg/mqdefault.jpg", "dur": "1:25:18"}, {"id": "b5DWmxvIZoY", "title": "Susurros de La Habana – Bolero en la Madrugada", "thumb": "https://i.ytimg.com/vi/b5DWmxvIZoY/mqdefault.jpg", "dur": "1:36:44"}, {"id": "LksyUQL-kps", "title": "Noches de La Habana – Susurros y Bolero", "thumb": "https://i.ytimg.com/vi/LksyUQL-kps/mqdefault.jpg", "dur": "1:11:53"}, {"id": "ravL7rLhsNA", "title": "La Habana Suspira – Bolero de Medianoche", "thumb": "https://i.ytimg.com/vi/ravL7rLhsNA/mqdefault.jpg", "dur": "1:44:40"}, {"id": "bn6i1Dx6R88", "title": "Entre Café y Bolero en la Madrugada – Noches de La Habana", "thumb": "https://i.ytimg.com/vi/bn6i1Dx6R88/mqdefault.jpg", "dur": "1:13:55"}, {"id": "rI4QS1aMk1E", "title": "La Habana Suspira – Bolero de Medianoche", "thumb": "https://i.ytimg.com/vi/rI4QS1aMk1E/mqdefault.jpg", "dur": "1:15:09"}, {"id": "-FcFf1GSjBk", "title": "Susurros de La Habana – Bolero Bajo la Luna", "thumb": "https://i.ytimg.com/vi/-FcFf1GSjBk/mqdefault.jpg", "dur": "1:04:17"}, {"id": "gnlzLqvBcJc", "title": "Madrugada en La Habana – Café y Bolero", "thumb": "https://i.ytimg.com/vi/gnlzLqvBcJc/mqdefault.jpg", "dur": "1:23:50"}, {"id": "RpdhrxQPYgo", "title": "Bolero en la Madrugada – Noches de La Habana", "thumb": "https://i.ytimg.com/vi/RpdhrxQPYgo/mqdefault.jpg", "dur": "1:04:31"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
