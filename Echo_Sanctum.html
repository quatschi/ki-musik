ional Calm | 1 Hour+", "thumb": "https://i.ytimg.com/vi/vKP4rJX0VXQ/mqdefault.jpg", "dur": "1:21:00"}, {"id": "fUBbp-QgLP0", "title": "Northern Awakening — Nordic Ambient for Inner Peace & Emotional Uplift | 1 Hour", "thumb": "https://i.ytimg.com/vi/fUBbp-QgLP0/mqdefault.jpg", "dur": "1:15:16"}, {"id": "eAU0O5KzHhU", "title": "Deep Calm — African Ambient for Relaxation & Inner Peace | 1 Hour", "thumb": "https://i.ytimg.com/vi/eAU0O5KzHhU/mqdefault.jpg", "dur": "56:57"}, {"id": "ZWAonIw5LkA", "title": "Japanese Relaxing Music – Kyoto Zen Ambient for Sleep & Meditation I 1 Hour", "thumb": "https://i.ytimg.com/vi/ZWAonIw5LkA/mqdefault.jpg", "dur": "1:21:06"}, {"id": "vZmtpWPNjlM", "title": "Native American Flute — Deep Healing Music for Sleep & Meditation | 1 Hour+", "thumb": "https://i.ytimg.com/vi/vZmtpWPNjlM/mqdefault.jpg", "dur": "1:21:47"}, {"id": "tZ4RpYhmWwg", "title": "Himalayan Awakening — Tibetan Ambient for Deep Meditation & Inner Peace | 1 Hour", "thumb": "https://i.ytimg.com/vi/tZ4RpYhmWwg/mqdefault.jpg", "dur": "1:01:11"}, {"id": "ZJakQsD0ZyI", "title": "Celtic Shores — Irish Ambient for Deep Relaxation & Meditation | 1 Hour", "thumb": "https://i.ytimg.com/vi/ZJakQsD0ZyI/mqdefault.jpg", "dur": "1:09:14"}, {"id": "pxnHrXky7d8", "title": "Nordic Fjords — Norse Viking Ambient for Strength & Deep Focus | 1 Hour", "thumb": "https://i.ytimg.com/vi/pxnHrXky7d8/mqdefault.jpg", "dur": "1:17:18"}, {"id": "_e4DjMIlJWU", "title": "Zulu Earth — African Ambient for Deep Calm | 1 Hour", "thumb": "https://i.ytimg.com/vi/_e4DjMIlJWU/mqdefault.jpg", "dur": "57:48"}, {"id": "Mloxatn8v8M", "title": "Inca Highlands — Andean Ambient for Meditation | 1 Hour", "thumb": "https://i.ytimg.com/vi/Mloxatn8v8M/mqdefault.jpg", "dur": "1:08:08"}, {"id": "WzatoyfCawU", "title": "Calm Japanese Ambient for Meditation & Relaxation 日本の静寂", "thumb": "https://i.ytimg.com/vi/WzatoyfCawU/mqdefault.jpg", "dur": "1:32:57"}, {"id": "LtnaQSUEg7w", "title": "Celtic Forest & Ocean – Irish Ambient for Calm & Inner Peace (1 Hour)", "thumb": "https://i.ytimg.com/vi/LtnaQSUEg7w/mqdefault.jpg", "dur": "1:17:12"}, {"id": "BnImmHYxyXI", "title": "Andean Healing Ambient – Inca Inspired Music for Emotional Balance & Meditation (1 Hour)", "thumb": "https://i.ytimg.com/vi/BnImmHYxyXI/mqdefault.jpg", "dur": "1:28:06"}, {"id": "Nc59KI3x7h0", "title": "Zulu Tribal Calm – African Ambient for Relaxation & Inner Peace (1 Hour)", "thumb": "https://i.ytimg.com/vi/Nc59KI3x7h0/mqdefault.jpg", "dur": "1:05:34"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
