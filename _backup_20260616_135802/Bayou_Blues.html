"title": "Deep Southern Delta Blues Mississippi Born Muddy Grooves ~ Grizzly Bear Blues", "thumb": "https://i.ytimg.com/vi/ta8l7tDDnGY/mqdefault.jpg", "dur": "1:00:28"}, {"id": "_3FyUbsWQ2E", "title": "Experience the Delta Blues Slow Grooves on Old Wood Floors Sunset", "thumb": "https://i.ytimg.com/vi/_3FyUbsWQ2E/mqdefault.jpg", "dur": "2:17:31"}, {"id": "hxEylqzAfws", "title": "Southern Delta Blues Raw Guitar Magic Under the Night Smoke Sky", "thumb": "https://i.ytimg.com/vi/hxEylqzAfws/mqdefault.jpg", "dur": "2:19:48"}, {"id": "KkgPAgHkTpQ", "title": "Southern Delta Blues | Cat General's Midnight Slide & Whiskey Nights Steel Groove", "thumb": "https://i.ytimg.com/vi/KkgPAgHkTpQ/mqdefault.jpg", "dur": "2:20:32"}, {"id": "8XK-VmSx97g", "title": "Deep Southern Delta Blues 🎸 Mississippi Born Delta Soul & Muddy Grooves Live", "thumb": "https://i.ytimg.com/vi/8XK-VmSx97g/mqdefault.jpg", "dur": "2:15:49"}, {"id": "gjss4LGolGg", "title": "Authentic Delta Blues Smoke Steel & Whiskey Sessions", "thumb": "https://i.ytimg.com/vi/gjss4LGolGg/mqdefault.jpg", "dur": "2:23:52"}, {"id": "3tG1fawVp5k", "title": "Deep Southern Delta Blues – Mississippi Born Grooves & Raw Soulful Juke Joint Vibes", "thumb": "https://i.ytimg.com/vi/3tG1fawVp5k/mqdefault.jpg", "dur": "2:16:09"}, {"id": "OvQVAWL62dA", "title": "Southern Delta Blues Night Smoke Steel Soulful Slide Guitar Whiskey Vibes", "thumb": "https://i.ytimg.com/vi/OvQVAWL62dA/mqdefault.jpg", "dur": "2:19:15"}, {"id": "YD5iYr1C2Gs", "title": "Delta Blues & Poker Night ~ Old Wood Floors & Slow Grooves Vibe", "thumb": "https://i.ytimg.com/vi/YD5iYr1C2Gs/mqdefault.jpg", "dur": "2:17:57"}, {"id": "ouk92bG8V24", "title": "Delta Blues Nights ~ Mississippi Slide Guitar & Whiskey Smoke", "thumb": "https://i.ytimg.com/vi/ouk92bG8V24/mqdefault.jpg", "dur": "2:17:29"}, {"id": "lXux48J_kZ4", "title": "Deep South Echoes | Raw Southern Blues & Old Guitars | Night Smoke Acoustic Session", "thumb": "https://i.ytimg.com/vi/lXux48J_kZ4/mqdefault.jpg", "dur": "2:19:18"}, {"id": "GzgIfx0NXWM", "title": "Deep Southern Delta Blues Poker Night ~ Gritty Mississippi Sound & Muddy Grooves Live Stream", "thumb": "https://i.ytimg.com/vi/GzgIfx0NXWM/mqdefault.jpg", "dur": "2:18:19"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
