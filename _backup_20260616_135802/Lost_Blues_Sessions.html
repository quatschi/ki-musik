<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 30px 20px 70px; color: white; }
  .back { display: inline-block; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.05em; }
  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(180,150,255,0.4); }
  .channel-title { font-size: 1.5rem; font-weight: 300; color: #e0d7ff; letter-spacing: 0.05em; }
  .channel-count { font-size: 0.8rem; color: #7a6fa0; margin-top: 4px; }
  .grid { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .nothumb { width: 120px; height: 68px; background: rgba(255,255,255,0.08); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #cc0000; flex-shrink: 0; }
  .video-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .video-title { font-size: 0.92rem; color: #e8e0ff; line-height: 1.3; }
  .video-dur { font-size: 0.78rem; color: #7a6fa0; }
  .rating-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .save-btn:disabled { background: #3a2a70; cursor: wait; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; font-style: italic; color: #7a6fa0; }
  .status-ok { color: #6fcf97; }
  .status-err { color: #eb5757; }
  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>

<body>

<div class="token-overlay" id="token-overlay">
  <div class="token-box">
    <h2>🔑 GitHub Token eingeben</h2>
    <p>Das Token wird nur in diesem Browser gespeichert und direkt an GitHub übertragen.</p>
    <input type="password" id="token-input" placeholder="github_pat_...">
    <button class="token-confirm" onclick="saveToken()">Bestätigen</button>
  </div>
</div>

  <div style="max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <a class="back" href="index.html">← Zurück zur Übersicht</a>
    <a class="back" href="radio2.html?kanal=Lost_Blues_Sessions.html" style="border:1px solid rgba(180,150,255,0.4);padding:6px 14px;border-radius:20px">▶ Nur diesen Kanal im Radio</a>
  </div>
  <div class="channel-header">
    <img class='channel-avatar' src='https://yt3.ggpht.com/2zL_v0zhRPHE4D5d37prAysvCWgL3saPZ4RMj2hF6Z8rNNcz8-NnWHExUbb_jYWugDxCCmStJQ=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Lost Blues Sessions</div>
      <div class="channel-count">29 Videos</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn" id="save-btn" onclick="saveRatings()">💾 Speichern</button>
  </div>

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "Lost Blues Sessions";
const VIDEOS = [{"id": "SFwyxYG4m_k", "title": "B.B. King • Eric Clapton • Gary Moore • Santana – The Thrill Is Gone 🌄 | Midnight Blues Tribute", "thumb": "https://i.ytimg.com/vi/SFwyxYG4m_k/mqdefault.jpg", "dur": "55:45"}, {"id": "DHVU9T096yc", "title": "B.B. King & Janis Joplin 🔥 Soul Blues Explosion | Live Newport Folk Festival 1968 (Tribute)", "thumb": "https://i.ytimg.com/vi/DHVU9T096yc/mqdefault.jpg", "dur": "53:27"}, {"id": "YNk8e0Sbzc0", "title": "Eric Clapton & Janis Joplin 🔥 Midnight Monterey 1967 | Raw Soul Blues Fire  | Tribute", "thumb": "https://i.ytimg.com/vi/YNk8e0Sbzc0/mqdefault.jpg", "dur": "1:04:17"}, {"id": "q-N-1k-0iW0", "title": "BB King, Eric Clapton, Jimi Hendrix,santana – Kings of the Midnight Psychedelic blues V.2 | Tribute", "thumb": "https://i.ytimg.com/vi/q-N-1k-0iW0/mqdefault.jpg", "dur": "51:55"}, {"id": "b27T9S-72SE", "title": "B.B. King & Muddy Waters – Midnight at Chess Records 🎸 | Kings of Chicago Blues | Tribute", "thumb": "https://i.ytimg.com/vi/b27T9S-72SE/mqdefault.jpg", "dur": "1:01:45"}, {"id": "JWycq6L138Y", "title": "BB King • Stevie Ray Vaughan • Jimi Hendrix • santana – Kings of the Midnight blues | Tribute", "thumb": "https://i.ytimg.com/vi/JWycq6L138Y/mqdefault.jpg", "dur": "57:37"}, {"id": "iRVQtQZmvbY", "title": "BB King • Eric Clapton • Jimi Hendrix • santana – Kings of the Midnight Psychedelic blues | Tribute", "thumb": "https://i.ytimg.com/vi/iRVQtQZmvbY/mqdefault.jpg", "dur": "54:10"}, {"id": "hYOLGhEHqI4", "title": "Stevie Ray Vaughan & Double Trouble – Pride and Joy 🎸Live at Montreux 1982 | Inspired Tribute", "thumb": "https://i.ytimg.com/vi/hYOLGhEHqI4/mqdefault.jpg", "dur": "57:22"}, {"id": "WkUp4s1jMso", "title": "BB King & Gary Moore 🔥 The Blues of Sacred Fire | Lost Blues Sessions (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/WkUp4s1jMso/mqdefault.jpg", "dur": "59:54"}, {"id": "utDD7VVIeQw", "title": "BB King, Clapton, Muddy Waters & Santana 🔥 Delta Latin Soul Fire | Impossible Tribute", "thumb": "https://i.ytimg.com/vi/utDD7VVIeQw/mqdefault.jpg", "dur": "1:06:56"}, {"id": "OwWo7-nUkv0", "title": "B.B. King • Clapton • Muddy Waters • Santana – Midnight Blues Rock Explosion | Full Tribute Session", "thumb": "https://i.ytimg.com/vi/OwWo7-nUkv0/mqdefault.jpg", "dur": "59:03"}, {"id": "WOMZnmjhspg", "title": "Muddy Waters & The Rolling Stones – Checkerboard Lounge 🎸 | Raw Blues Soul Fire | Live Session 1981", "thumb": "https://i.ytimg.com/vi/WOMZnmjhspg/mqdefault.jpg", "dur": "1:00:50"}, {"id": "aT0_NssMjTc", "title": "Janis Joplin & BB King 🔥 Live Newport Folk Festival 1968 | Soul Blues Explosion Tribute", "thumb": "https://i.ytimg.com/vi/aT0_NssMjTc/mqdefault.jpg", "dur": "54:50"}, {"id": "_AsQyvu1hK4", "title": "BB King & Muddy Waters  – Two Kings of Chicago 🔥 Live Blues Festival 1969 | Tribute", "thumb": "https://i.ytimg.com/vi/_AsQyvu1hK4/mqdefault.jpg", "dur": "48:40"}, {"id": "b69f4A9bOHY", "title": "Robert Johnson • BB King • Muddy Waters • Howlin' Wolf 🔥 Live Newport 1964 - Delta Blues Explosion", "thumb": "https://i.ytimg.com/vi/b69f4A9bOHY/mqdefault.jpg", "dur": "53:38"}, {"id": "Ypxet7lOsBA", "title": "Jimi Hendrix & Stevie Ray Vaughan 🔥 Texas Blues Meets Psychedelic Fire Legendary (Inspired Tribute)", "thumb": "https://i.ytimg.com/vi/Ypxet7lOsBA/mqdefault.jpg", "dur": "1:09:53"}, {"id": "gASzS0Bd1AA", "title": "B.B. King • Clapton • Muddy Waters • Santana – Kings of the Midnight Blues | Tribute", "thumb": "https://i.ytimg.com/vi/gASzS0Bd1AA/mqdefault.jpg", "dur": "1:08:39"}, {"id": "25BibZUuEyo", "title": "B.B. King • Clapton • Muddy Waters • Santana – Midnight Blues Rock Explosion | Full Tribute Session", "thumb": "https://i.ytimg.com/vi/25BibZUuEyo/mqdefault.jpg", "dur": "1:01:48"}, {"id": "VoaMldtgu4Y", "title": "BB King • Robert Johnson • Muddy Waters • Howlin' Wolf – Raw Delta Heartbreak | Lost Sessions 1952 🎸", "thumb": "https://i.ytimg.com/vi/VoaMldtgu4Y/mqdefault.jpg", "dur": "57:23"}, {"id": "RNGEhQKHMGU", "title": "B.B. King & Etta James – At Last The Blues Found Us 🎸The Greatest Soul Blues Session Vol. 2", "thumb": "https://i.ytimg.com/vi/RNGEhQKHMGU/mqdefault.jpg", "dur": "57:23"}, {"id": "Prli3uYkwaw", "title": "B.B. King • Clapton • Muddy Waters • Santana – Kings of the Midnight Blues Vol. 2 | Tribute", "thumb": "https://i.ytimg.com/vi/Prli3uYkwaw/mqdefault.jpg", "dur": "1:06:57"}, {"id": "YiP5hqb9Igc", "title": "B.B. King — Lucille After Midnight | Midnight Blues Sessions", "thumb": "https://i.ytimg.com/vi/YiP5hqb9Igc/mqdefault.jpg", "dur": "52:40"}, {"id": "HuqKYCxx5Hs", "title": "Muddy Waters & BB King – Soulful Heartbreak Tribute | Lost Clarksdale Sessions 1955", "thumb": "https://i.ytimg.com/vi/HuqKYCxx5Hs/mqdefault.jpg", "dur": "1:01:45"}, {"id": "zShLGUUYSQE", "title": "Marvin Gaye & Tammi Terrell – You're All I Need 🎵Legendary Love Soul Sessions 1960s Style", "thumb": "https://i.ytimg.com/vi/zShLGUUYSQE/mqdefault.jpg", "dur": "56:33"}, {"id": "43VUq3CvH-M", "title": "B.B. King & Ray Charles – Midnight Soul at Chess Records 🎸Legendary Blues Session 1960s Style", "thumb": "https://i.ytimg.com/vi/43VUq3CvH-M/mqdefault.jpg", "dur": "1:09:31"}, {"id": "2mUu1Mu68n0", "title": "Stevie Ray Vaughan – They Said These Tapes Were Lost Forever - Legendary Blues Sessions Texas Style", "thumb": "https://i.ytimg.com/vi/2mUu1Mu68n0/mqdefault.jpg", "dur": "1:03:50"}, {"id": "Crivhvz0xc4", "title": "B.B. King & Etta James – At Last 🎸The Greatest Soul Blues Session Never Recorded", "thumb": "https://i.ytimg.com/vi/Crivhvz0xc4/mqdefault.jpg", "dur": "1:03:19"}, {"id": "R4Cpc0wKJrg", "title": "Muddy Waters & Howlin' Wolf – Kings of Chess Records 🎸 Raw Chicago Blues Sessions 1950s Style", "thumb": "https://i.ytimg.com/vi/R4Cpc0wKJrg/mqdefault.jpg", "dur": "59:32"}, {"id": "rW8Hs2GqViI", "title": "B.B. King • Clapton • Muddy Waters • Santana – Kings of the Midnight Blues | Full Tribute Session 🎸", "thumb": "https://i.ytimg.com/vi/rW8Hs2GqViI/mqdefault.jpg", "dur": "1:01:48"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
</html>
