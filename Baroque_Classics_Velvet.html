ps://i.ytimg.com/vi/Tqiv53xzeEs/mqdefault.jpg", "dur": "2:00:52"}, {"id": "nEVuJ4drNgk", "title": "Baroque Classics | Elegant Orchestral Masterpieces - Vivaldi Bach Handel For Deep Focus Now!!", "thumb": "https://i.ytimg.com/vi/nEVuJ4drNgk/mqdefault.jpg", "dur": "2:04:15"}, {"id": "cKGYA2n_p8k", "title": "Baroque Classics | Elegant Orchestral Masterpieces for Studying and Deep Focus Relaxation", "thumb": "https://i.ytimg.com/vi/cKGYA2n_p8k/mqdefault.jpg", "dur": "2:01:18"}, {"id": "WrvW-l3f8nk", "title": "Baroque Classics - Majestic Vivaldi & Bach for Study - Timeless Classical Masterpieces Set !!", "thumb": "https://i.ytimg.com/vi/WrvW-l3f8nk/mqdefault.jpg", "dur": "2:03:15"}, {"id": "1dK1dTRdxqY", "title": "Baroque Classics | Elegant Orchestral Masterpieces - Timeless Classical for Deep Focus Work", "thumb": "https://i.ytimg.com/vi/1dK1dTRdxqY/mqdefault.jpg", "dur": "2:01:04"}, {"id": "sBKc8WAodJk", "title": "Baroque Classics | Royal Orchestral Masterpieces | Elegant Vivaldi & Bach Harpsichord Music", "thumb": "https://i.ytimg.com/vi/sBKc8WAodJk/mqdefault.jpg", "dur": "2:05:25"}, {"id": "t75gP1jdikU", "title": "Baroque Classics | Elegant Vivaldi & Bach Masterpieces - Timeless Classical Music for Study", "thumb": "https://i.ytimg.com/vi/t75gP1jdikU/mqdefault.jpg", "dur": "2:02:04"}, {"id": "k3_mo9igSDs", "title": "Baroque Classics | Timeless Classical Masterpieces and Baroque Music for Elegant Study &", "thumb": "https://i.ytimg.com/vi/k3_mo9igSDs/mqdefault.jpg", "dur": "2:03:59"}, {"id": "BJnrvKLrxQ8", "title": "Baroque classics | Timeless classical music for relaxation & study - Baroque playlist 2026", "thumb": "https://i.ytimg.com/vi/BJnrvKLrxQ8/mqdefault.jpg", "dur": "2:01:38"}, {"id": "YVwrCAlR3Bk", "title": "Baroque Classics & Timeless Classical Music - Elegant Harpsichord and Orchestral Masterpiece", "thumb": "https://i.ytimg.com/vi/YVwrCAlR3Bk/mqdefault.jpg", "dur": "2:05:06"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
