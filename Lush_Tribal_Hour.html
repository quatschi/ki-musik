<style>

  .back:hover { color: #e0d7ff; }
  .channel-header { display: flex; align-items: center; gap: 20px; max-width: 860px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }

  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }

  .play-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(180,150,255,0.15); border: 1px solid rgba(180,150,255,0.4); color: #b496ff; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s ease; }

  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }

  .save-btn:hover { background: #7a5fc0; }

  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }

{"id": "ZIXXRA9xlI8", "title": "Deep Tribal Jazz Instrumental | Midnight Afro Ritual ~ Hypnotic Sacred Grooves for Focus", "thumb": "https://i.ytimg.com/vi/ZIXXRA9xlI8/mqdefault.jpg", "dur": "2:03:59"}, {"id": "hInohte5m1w", "title": "Tribal Lounge Jazz | Sacred Grooves | Deep Instrumental for Late Night Rituals and Focus Now", "thumb": "https://i.ytimg.com/vi/hInohte5m1w/mqdefault.jpg", "dur": "2:03:32"}, {"id": "SCFpL_LJl80", "title": "Deep Tribal Jazz Instrumental - Sacred Grooves & Midnight Afro Ritual for Late Night Calm", "thumb": "https://i.ytimg.com/vi/SCFpL_LJl80/mqdefault.jpg", "dur": "2:02:31"}, {"id": "1CwpYK5qstM", "title": "Tribal Lounge Jazz | Hypnotic Tribal Grooves | After Hours Ritual Jazz | Relaxing Music", "thumb": "https://i.ytimg.com/vi/1CwpYK5qstM/mqdefault.jpg", "dur": "2:04:39"}, {"id": "3a4-GtkwMSg", "title": "Deep Tribal Jazz Instrumental - Sacred Grooves for Midnight Afro Ritual & Tribal Lounge Jazz", "thumb": "https://i.ytimg.com/vi/3a4-GtkwMSg/mqdefault.jpg", "dur": "2:07:45"}, {"id": "bNBjqGomYvg", "title": "midnight afro ritual - ritual jazz - hypnotic tribal grooves - late night tribal jazz & co", "thumb": "https://i.ytimg.com/vi/bNBjqGomYvg/mqdefault.jpg", "dur": "2:05:15"}, {"id": "sybQP86c05E", "title": "Midnight Afro Ritual | Tribal Lounge Jazz - Sacred Grooves for Late Night Deep Focus Chill", "thumb": "https://i.ytimg.com/vi/sybQP86c05E/mqdefault.jpg", "dur": "2:04:11"}, {"id": "TlaxOHLggE0", "title": "Tribal Lounge Jazz - Sacred Grooves & Midnight Afro Ritual Music for Deep Focus and Chill", "thumb": "https://i.ytimg.com/vi/TlaxOHLggE0/mqdefault.jpg", "dur": "2:06:40"}, {"id": "YPSc9wc4Jc8", "title": "Deep Tribal Jazz Instrumental - Sacred Grooves & Midnight Afro Ritual for After Hours Study", "thumb": "https://i.ytimg.com/vi/YPSc9wc4Jc8/mqdefault_live.jpg", "dur": ""}, {"id": "hY6CHtKrR5Y", "title": "Deep Tribal Jazz Instrumental | Midnight Afro Ritual | Relaxing Tribal Lounge Jazz Rhythms", "thumb": "https://i.ytimg.com/vi/hY6CHtKrR5Y/mqdefault.jpg", "dur": "2:04:57"}, {"id": "fbVSadQTBO0", "title": "Midnight Afro Ritual ~ Deep Tribal Jazz Instrumental for Sacred Grooves and Late Night Focus", "thumb": "https://i.ytimg.com/vi/fbVSadQTBO0/mqdefault.jpg", "dur": "1:01:06"}, {"id": "picE14n_xXU", "title": "After Hours Ritual Jazz | Hypnotic Tribal Grooves and Relaxing Nocturnal Jazz Instrumental", "thumb": "https://i.ytimg.com/vi/picE14n_xXU/mqdefault.jpg", "dur": "1:03:25"}, {"id": "8FqoGRXbMGU", "title": "Tribal Lounge Jazz - Sacred Grooves ~ Deep Tribal Jazz Instrumental & After Hours Ritual Jazz", "thumb": "https://i.ytimg.com/vi/8FqoGRXbMGU/mqdefault.jpg", "dur": "1:01:09"}, {"id": "R15uCApKrPc", "title": "Tribal Lounge Jazz - After Hours Ritual Jazz & Relaxing Nocturnal Tribal Jazz Melodies", "thumb": "https://i.ytimg.com/vi/R15uCApKrPc/mqdefault.jpg", "dur": "1:03:09"}, {"id": "wEW98-m9erk", "title": "Deep Tribal Jazz Instrumental | Sacred Grooves & Midnight Afro Ritual for After Hours Bliss", "thumb": "https://i.ytimg.com/vi/wEW98-m9erk/mqdefault.jpg", "dur": "1:02:28"}, {"id": "Gyl4i6DUJDc", "title": "Deep Tribal Jazz Instrumental | After Hours Ritual Jazz ~ Relaxing Midnight Afro Rituals", "thumb": "https://i.ytimg.com/vi/Gyl4i6DUJDc/mqdefault.jpg", "dur": "1:01:02"}, {"id": "ZkLorSzF468", "title": "Tribal lounge jazz - Sacred grooves - Midnight afro ritual & deep tribal jazz instrumental", "thumb": "https://i.ytimg.com/vi/ZkLorSzF468/mqdefault.jpg", "dur": "1:00:12"}, {"id": "sTfZ5D2ToPg", "title": "Hypnotic Tribal Lounge Jazz ~ Deep Focus Ritual Grooves for Relaxation", "thumb": "https://i.ytimg.com/vi/sTfZ5D2ToPg/mqdefault.jpg", "dur": "1:03:29"}, {"id": "mSQ2Dh3J-hM", "title": "Midnight Afro Ritual | Deep Tribal Jazz Instrumental & Sacred Grooves for Late Night Focus", "thumb": "https://i.ytimg.com/vi/mSQ2Dh3J-hM/mqdefault.jpg", "dur": "1:01:01"}, {"id": "H_1d9pISVvs", "title": "Hypnotic Tribal Grooves | After Hours Ritual Jazz | Deep Tribal Jazz Instrumental Relaxation", "thumb": "https://i.ytimg.com/vi/H_1d9pISVvs/mqdefault.jpg", "dur": "1:03:35"}, {"id": "YCnE6-V_K-4", "title": "Deep Tribal Jazz Instrumental | Midnight Afro Ritual ~ After Hours Sacred Grooves Relaxing", "thumb": "https://i.ytimg.com/vi/YCnE6-V_K-4/mqdefault.jpg", "dur": "1:01:38"}, {"id": "S-dl8SIZrpA", "title": "Tribal lounge jazz | Sacred grooves for deep focus and midnight afro ritual at after hours", "thumb": "https://i.ytimg.com/vi/S-dl8SIZrpA/mqdefault.jpg", "dur": "1:00:26"}, {"id": "RdV_UxV3G-U", "title": "Midnight Afro Ritual - Hypnotic Tribal Grooves | Relaxing Tribal Lounge Jazz For Deep Focus", "thumb": "https://i.ytimg.com/vi/RdV_UxV3G-U/mqdefault.jpg", "dur": "1:01:54"}, {"id": "eZXB572z52c", "title": "Midnight Afro Ritual | Deep Tribal Jazz Instrumental | Sacred Grooves for Spiritual Focus", "thumb": "https://i.ytimg.com/vi/eZXB572z52c/mqdefault.jpg", "dur": "1:00:14"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
