  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }

  <div class="save-bar">

<script>
const GITHUB_USER = 'quatschi';
const GITHUB_REPO = 'ki-musik';
const GITHUB_FILE = 'noten.json';
const CHANNEL = "The Bloom Jazz";
const VIDEOS = [{"id": "INUN7hM0bV8", "title": "Midnight Smooth Jazz | Cozy Female Vocals & Gentle Piano for Peaceful Nights (1 Hour)", "thumb": "https://i.ytimg.com/vi/INUN7hM0bV8/mqdefault.jpg", "dur": "1:02:24"}, {"id": "aRSQMgRIxfY", "title": "Relaxing Smooth Jazz | Warm Female Vocals & Gentle Lyrics for Stress Relief (1 Hour)", "thumb": "https://i.ytimg.com/vi/aRSQMgRIxfY/mqdefault.jpg", "dur": "1:12:42"}, {"id": "L9v8Y8Zi5wQ", "title": "Relaxing Smooth Jazz | Soft Female Vocals & Uplifting Lyrics to Heal Your Heart (1 Hour)", "thumb": "https://i.ytimg.com/vi/L9v8Y8Zi5wQ/mqdefault.jpg", "dur": "1:08:41"}, {"id": "QyyVVkmnyX8", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Gentle Lyrics to Slow Down and Unwind (1 Hour)", "thumb": "https://i.ytimg.com/vi/QyyVVkmnyX8/mqdefault.jpg", "dur": "1:14:36"}, {"id": "IH4p_wOoGyc", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Intimate Lyrics for a Late Night at the Grand Hotel", "thumb": "https://i.ytimg.com/vi/IH4p_wOoGyc/mqdefault.jpg", "dur": "56:21"}, {"id": "yEW-iHY5_sI", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Intimate Lyrics for the Quiet Storm Hour", "thumb": "https://i.ytimg.com/vi/yEW-iHY5_sI/mqdefault.jpg", "dur": "1:51:44"}, {"id": "0so98OqePMc", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Last Call at a Jazz Club", "thumb": "https://i.ytimg.com/vi/0so98OqePMc/mqdefault.jpg", "dur": "1:47:17"}, {"id": "-JrdhUPsZOA", "title": "Relaxing Smooth Jazz |  Breathy Vocals & Intimate Lyrics for a Late Reading Night", "thumb": "https://i.ytimg.com/vi/-JrdhUPsZOA/mqdefault.jpg", "dur": "1:55:05"}, {"id": "rwJPnb9iOTc", "title": "A Late Moonlit Night | Intimate Jazz & Breathy Female Vocals", "thumb": "https://i.ytimg.com/vi/rwJPnb9iOTc/mqdefault.jpg", "dur": "1:55:55"}, {"id": "rhgcXrFUmD8", "title": "Intimate Jazz on a Late Night Train | Breathy Female Vocals", "thumb": "https://i.ytimg.com/vi/rhgcXrFUmD8/mqdefault.jpg", "dur": "2:02:51"}, {"id": "XmU2Is-pSRQ", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Intimate Lyrics for a Late Sleepless Night", "thumb": "https://i.ytimg.com/vi/XmU2Is-pSRQ/mqdefault.jpg", "dur": "2:05:02"}, {"id": "Or9lx21xmps", "title": "Late Rainy Night at the Bar | Intimate Jazz & Breathy Female Vocals", "thumb": "https://i.ytimg.com/vi/Or9lx21xmps/mqdefault.jpg", "dur": "1:57:55"}, {"id": "vGKCci8vgys", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Tender Night Melodies for Healing and Becoming Whole", "thumb": "https://i.ytimg.com/vi/vGKCci8vgys/mqdefault.jpg", "dur": "1:40:29"}, {"id": "4OhKiitnTaE", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Amber Night Melodies", "thumb": "https://i.ytimg.com/vi/4OhKiitnTaE/mqdefault.jpg", "dur": "1:41:15"}, {"id": "txtgxOGkN7Y", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Quiet Lyrics for One Night at the Hotel", "thumb": "https://i.ytimg.com/vi/txtgxOGkN7Y/mqdefault.jpg", "dur": "1:55:56"}, {"id": "sv69RhYPTSo", "title": "Relaxing Smooth Jazz | Soft Female Vocals & Gentle Lyrics for a Late Night Alone at Home", "thumb": "https://i.ytimg.com/vi/sv69RhYPTSo/mqdefault.jpg", "dur": "1:17:50"}, {"id": "ehXDl5Rvjf4", "title": "Relaxing Smooth Jazz | Breathy Female Vocals & Intimate Lyrics for a Late Rainy Night", "thumb": "https://i.ytimg.com/vi/ehXDl5Rvjf4/mqdefault.jpg", "dur": "1:14:44"}, {"id": "c_A7Wvg3wx4", "title": "Relaxing Smooth Jazz | Warm Female Vocals & Cozy Night Melodies to Rest and Let Go", "thumb": "https://i.ytimg.com/vi/c_A7Wvg3wx4/mqdefault.jpg", "dur": "1:32:15"}, {"id": "scKuJOZOOzc", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Gentle Lyrics for Stress Relief and Quiet Healing", "thumb": "https://i.ytimg.com/vi/scKuJOZOOzc/mqdefault.jpg", "dur": "1:25:48"}, {"id": "mw7YsyMz-O8", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Uplifting Lyrics to Rest and Rise for the Week", "thumb": "https://i.ytimg.com/vi/mw7YsyMz-O8/mqdefault.jpg", "dur": "1:23:24"}, {"id": "JRBnRaYhODA", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Lazy Weekend Vibes to Unwind and Enjoy", "thumb": "https://i.ytimg.com/vi/JRBnRaYhODA/mqdefault.jpg", "dur": "1:27:04"}, {"id": "zamnZIHtsdA", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Glowing Lyrics for Friday Night", "thumb": "https://i.ytimg.com/vi/zamnZIHtsdA/mqdefault.jpg", "dur": "1:20:45"}, {"id": "QCxPfb9lIPQ", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Warm Lyrics to End the Week and Breathe Easy", "thumb": "https://i.ytimg.com/vi/QCxPfb9lIPQ/mqdefault.jpg", "dur": "1:27:47"}, {"id": "-BCJWVOKZu4", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Gentle Lyrics to Quiet Your Mind and Sleep", "thumb": "https://i.ytimg.com/vi/-BCJWVOKZu4/mqdefault.jpg", "dur": "1:27:11"}, {"id": "7btoE1Zin8g", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Hopeful Lyrics to Rest and Rise Again", "thumb": "https://i.ytimg.com/vi/7btoE1Zin8g/mqdefault.jpg", "dur": "1:28:38"}, {"id": "GoPjNcFzs_8", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Uplifting Lyrics to Heal and Recharge", "thumb": "https://i.ytimg.com/vi/GoPjNcFzs_8/mqdefault.jpg", "dur": "1:22:41"}, {"id": "YwbTxX6o224", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Soft Lyrics to Rest and Heal", "thumb": "https://i.ytimg.com/vi/YwbTxX6o224/mqdefault.jpg", "dur": "1:11:56"}, {"id": "GX_Juzxeaa4", "title": "Smooth Jazz Harmony | Soulful Female Vocals & Healing Lyrics to Breathe and Come Home", "thumb": "https://i.ytimg.com/vi/GX_Juzxeaa4/mqdefault.jpg", "dur": "1:08:21"}, {"id": "puEQmH406l8", "title": "Relaxing Smooth Jazz | Soulful Female Vocals & Gentle Lyrics to Unwind and Let Go", "thumb": "https://i.ytimg.com/vi/puEQmH406l8/mqdefault.jpg", "dur": "1:11:33"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
</body>
