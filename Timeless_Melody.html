 "dur": "1:09:16"}, {"id": "K_Uz2KziZfY", "title": "🎷 Best Smooth Jazz Hits of All Time | Ultimate Chill Vibes", "thumb": "https://i.ytimg.com/vi/K_Uz2KziZfY/mqdefault.jpg", "dur": "1:14:17"}, {"id": "HwKST0MzlFk", "title": "🎷 Best Oldies Jazz Covers | Relaxing Classic Songs Collection", "thumb": "https://i.ytimg.com/vi/HwKST0MzlFk/mqdefault.jpg", "dur": "1:15:03"}, {"id": "6xbww6ffVdE", "title": "🎷 Smooth Jazz Paradise – Chill Lounge Music to Relax & Unwind", "thumb": "https://i.ytimg.com/vi/6xbww6ffVdE/mqdefault.jpg", "dur": "1:11:48"}, {"id": "9sLh6nBaUWA", "title": "🎷 Timeless Vintage Jazz Echoes | Golden Jazz Classics (70s 80s 90s  Smooth Vibes)", "thumb": "https://i.ytimg.com/vi/9sLh6nBaUWA/mqdefault.jpg", "dur": "35:11"}, {"id": "rkFE3nP_keM", "title": "🎷Golden Night Jazz Collection  Smooth Lounge Covers & Relaxing Tunes", "thumb": "https://i.ytimg.com/vi/rkFE3nP_keM/mqdefault.jpg", "dur": "40:39"}, {"id": "3-Z8scn4W48", "title": "🎷The Best of Smooth Jazz Lounge – Relaxing Evening Music", "thumb": "https://i.ytimg.com/vi/3-Z8scn4W48/mqdefault.jpg", "dur": "36:36"}, {"id": "qBGTC-eRF8M", "title": "Golden Sunset Jazz – Ultimate Smooth Jazz & Chill Lounge Playlist", "thumb": "https://i.ytimg.com/vi/qBGTC-eRF8M/mqdefault.jpg", "dur": "37:15"}, {"id": "tImdyDp6o8g", "title": "Deep Jazz Espace – Best Smooth Jazz for Work & Chill | Relaxing Jazz Playlist", "thumb": "https://i.ytimg.com/vi/tImdyDp6o8g/mqdefault.jpg", "dur": "35:53"}, {"id": "87AynDtD3zo", "title": "🎷 Classic Smooth Jazz Covers – Elegant Lounge Music Collection", "thumb": "https://i.ytimg.com/vi/87AynDtD3zo/mqdefault.jpg", "dur": "4:26"}, {"id": "djkG2Fpla_s", "title": "🎷 Smooth Jazz Lounge Essentials – Relaxing Covers for Peaceful Moments", "thumb": "https://i.ytimg.com/vi/djkG2Fpla_s/mqdefault.jpg", "dur": "4:48"}, {"id": "kXoN8XOSIHo", "title": "Timeless Smooth Jazz Collection – Relaxing Lounge Music for Work & Evening Chill", "thumb": "https://i.ytimg.com/vi/kXoN8XOSIHo/mqdefault.jpg", "dur": "4:58"}, {"id": "sGFDdVk_t7E", "title": "Timeless Love Echoes–Cover Popular Songs | Romantic Jazz Lounge, Chill Bar Music for Relaxing Nights", "thumb": "https://i.ytimg.com/vi/sGFDdVk_t7E/mqdefault.jpg", "dur": "1:47:24"}, {"id": "yxOVfjHGG8M", "title": "Best Smooth Jazz Collection | Relaxing Jazz Music for Work & Chill 🎷", "thumb": "https://i.ytimg.com/vi/yxOVfjHGG8M/mqdefault.jpg", "dur": "1:08:18"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}
</script>
