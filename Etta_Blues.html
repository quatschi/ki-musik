", "title": "Led Zeppelin, Amy Winehouse Style 🌃 Slow Blues Rock Guitar Riffs | Electric Midnight Blues", "thumb": "https://i.ytimg.com/vi/WLOgC2bhVLc/mqdefault.jpg", "dur": "1:42:37"}, {"id": "v3zfQIWbJXw", "title": "Amy Winehouse, Etta James, Janis Joplin Style 🎙️ Slow Blues Rock Guitar Riffs | Deep Soul Blues", "thumb": "https://i.ytimg.com/vi/v3zfQIWbJXw/mqdefault.jpg", "dur": "1:32:13"}, {"id": "0P7tipTIbr4", "title": "Janis Joplin, Etta James, Amy Winehouse Style | Slow Blues Rock Guitar Riffs | Soulful Whiskey Blues", "thumb": "https://i.ytimg.com/vi/0P7tipTIbr4/mqdefault.jpg", "dur": "1:23:17"}, {"id": "Fz_taYCD4hA", "title": "Led Zeppelin, Janis Joplin, Etta James Style 🌙 Slow Blues Rock Guitar Riffs | Midnight Guitar Blues", "thumb": "https://i.ytimg.com/vi/Fz_taYCD4hA/mqdefault.jpg", "dur": "1:24:26"}, {"id": "Es3quvdo5go", "title": "Etta James, Led Zeppelin, Amy Winehouse Style 🌙 Slow Blues Rock Guitar Riffs | Deep Midnight Blues", "thumb": "https://i.ytimg.com/vi/Es3quvdo5go/mqdefault.jpg", "dur": "1:41:25"}, {"id": "BLilBrxjE6w", "title": "Led Zeppelin, Etta James, Amy Winehouse Style 🎸 Slow Blues Rock Guitar Riffs | Dark Vintage Blues", "thumb": "https://i.ytimg.com/vi/BLilBrxjE6w/mqdefault.jpg", "dur": "1:22:42"}, {"id": "2mXS7i--vMk", "title": "Janis Joplin, Etta James, Amy Winehouse Style 🎙️ Slow Blues Rock Guitar Riffs | Whiskey Blues", "thumb": "https://i.ytimg.com/vi/2mXS7i--vMk/mqdefault.jpg", "dur": "1:28:35"}, {"id": "jWvE17abBqw", "title": "Etta James, Led Zeppelin, Amy Winehouse Style 🎤 Slow Blues Rock Guitar Riffs | After Hours Blues", "thumb": "https://i.ytimg.com/vi/jWvE17abBqw/mqdefault.jpg", "dur": "1:25:55"}, {"id": "Ya6-UwMkZf0", "title": "Janis Joplin, Etta James, Amy Winehouse | Slow Blues Rock Guitar Riffs | Late Night Whiskey Blues", "thumb": "https://i.ytimg.com/vi/Ya6-UwMkZf0/mqdefault.jpg", "dur": "1:22:04"}, {"id": "8uzLFecFnZg", "title": "Etta James, Led Zeppelin, Janis Joplin Style | Slow Blues Rock Guitar Riffs | After Hours Blues", "thumb": "https://i.ytimg.com/vi/8uzLFecFnZg/mqdefault.jpg", "dur": "1:42:14"}, {"id": "kHrInxU4DSw", "title": "Etta James, Led Zeppelin, Janis Joplin Style 🌃 Slow Blues Rock Guitar Riffs | Night Whiskey Vibes", "thumb": "https://i.ytimg.com/vi/kHrInxU4DSw/mqdefault.jpg", "dur": "1:27:44"}, {"id": "V3m_J0ng2lM", "title": "Janis Joplin, Led Zeppelin, Etta James, Amy Winehouse Style 🎸 Slow Blues Rock Guitar Riffs", "thumb": "https://i.ytimg.com/vi/V3m_J0ng2lM/mqdefault.jpg", "dur": "1:26:28"}, {"id": "PTsu5klYmQk", "title": "Etta James, Led Zeppelin, Amy Winehouse Style 🌙 Slow Blues Rock Guitar Riffs | Midnight Blues", "thumb": "https://i.ytimg.com/vi/PTsu5klYmQk/mqdefault.jpg", "dur": "1:28:03"}, {"id": "rRByJR4q-TQ", "title": "Janis Joplin, Etta James, Amy Winehouse Style 🥃 Slow Blues Rock Guitar Riffs | Whiskey Night Vibes", "thumb": "https://i.ytimg.com/vi/rRByJR4q-TQ/mqdefault.jpg", "dur": "1:23:54"}];
const TOKEN_KEY = 'gh_token_ki_musik';
let ratings = {}, meta = {}, changed = false;

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById('token-overlay').style.display = 'none';
  init();
}

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function setStatus(msg, cls) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (cls || '');
}

window.addEventListener('load', () => {
  if (getToken()) {
    document.getElementById('token-overlay').style.display = 'none';
    init();
  }
});

async function init() {
  await loadRatings();
  renderGrid();
}

async function loadRatings() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (resp.ok) {
      const data = await resp.json();
      const content = JSON.parse(atob(data.content));
      ratings = content.ratings || {};
      meta = content.meta || {};
    }
  } catch(e) {}
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  const v = VIDEOS.find(v => v.id === id);
  if (val >= 4 && v) {
    meta[id] = { title: v.title, channel: CHANNEL };
  } else {
    delete meta[id];
  }
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

async function saveRatings() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Speichern...', '');
  const json = JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings, meta }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  try {
    let sha = null;
    const getResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
    );
    if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
    const body = { message: 'Bewertung aktualisiert', content: encoded };
    if (sha) body.sha = sha;
    const putResp = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );
    if (putResp.ok) {
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      setStatus('✓ In GitHub gespeichert', 'status-ok');
    } else {
      const err = await putResp.json();
      setStatus('Fehler: ' + (err.message || putResp.status), 'status-err');
    }
  } catch(e) {
    setStatus('Netzwerkfehler: ' + e.message, 'status-err');
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
