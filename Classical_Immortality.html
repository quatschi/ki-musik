<style>

  .video-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 16px 10px 10px; color: white; transition: all 0.2s ease; }
  .video-card:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); }
  .thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }

  .stars { display: flex; gap: 3px; }
  .star { font-size: 1.3rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-btn { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,15,50,0.97); border-top: 1px solid rgba(180,150,255,0.3); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-bar span { font-size: 0.85rem; color: #9b8fc0; }
  .save-btn { background: #5a3fa0; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
  .save-btn:hover { background: #7a5fc0; }
  .changed-hint { font-size: 0.75rem; color: #f0c040; display: none; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; font-style: italic; }
  .status-ok { color: #6fcf97; }
</style>
</head>
<body>

    <img class='channel-avatar' src='https://yt3.ggpht.com/OqGxKqgMr0eVt1GttJQLYmdkIRdGUvbXCDprdO1TNBxlSE2jVv_NitvBvjARJyNxJhE_cgLf=s800-c-k-c0x00ffffff-no-rj'>
    <div>
      <div class="channel-title">Classical Immortality</div>

  </div>

  <div class="save-bar">
    <span>Bewertet: <strong id="rated-count">0</strong> &nbsp;<span class="changed-hint" id="changed-hint">● ungespeichert</span></span>

<script>
const CHANNEL = "Classical Immortality";
const VIDEOS = [{"id": "1Vdj4CSDyXY", "title": "🎬 HOW I CREATE A CLASSICAL MUSIC VIDEO FROM START TO FINISH", "thumb": "https://i.ytimg.com/vi/1Vdj4CSDyXY/mqdefault.jpg", "dur": "8:29"}, {"id": "1B-RYpLZDQQ", "title": "25 Most Famous Emotional Classical Symphony Melodies That Touch the Heart & Healing The Soul 🎧🎧🎧", "thumb": "https://i.ytimg.com/vi/1B-RYpLZDQQ/mqdefault.jpg", "dur": "3:15:08"}, {"id": "tLH8Q3Obh2g", "title": "Romantic Symphonies Classical Era — 30 Most Beautiful Classical Music of All Time | Relaxing Music", "thumb": "https://i.ytimg.com/vi/tLH8Q3Obh2g/mqdefault.jpg", "dur": "3:05:44"}, {"id": "aPcyYfm-I24", "title": "3 Hours of Famous Classical Music | Symphonic Orchestral Masterpieces for Relaxation | Vivaldi,...", "thumb": "https://i.ytimg.com/vi/aPcyYfm-I24/mqdefault.jpg", "dur": "3:46:54"}, {"id": "T9e2W6O133I", "title": "The Best Famous Classical Symphony Melodies of All Time 🎻 Relaxing Music for Stress Relief & Sleep", "thumb": "https://i.ytimg.com/vi/T9e2W6O133I/mqdefault.jpg", "dur": "3:35:52"}, {"id": "dt2q8Wm4ezw", "title": "4 Hours of Legendary Symphony Masterpieces✨Relaxing Orchestral Classical Music That Touches the Soul", "thumb": "https://i.ytimg.com/vi/dt2q8Wm4ezw/mqdefault.jpg", "dur": "3:25:42"}, {"id": "TRzIAQ_R76o", "title": "35 Famous Emotional Classical Symphony Music Everyone Listens To 🎻Vivaldi, Mozart,...🎧Relax, Heal", "thumb": "https://i.ytimg.com/vi/TRzIAQ_R76o/mqdefault.jpg", "dur": "3:34:59"}, {"id": "7Z2VWLIFocA", "title": "25 Most Listened Symphony Orchestra Classical Melodies (No Ads) | Mozart, Vivaldi | Relaxa & Healing", "thumb": "https://i.ytimg.com/vi/7Z2VWLIFocA/mqdefault.jpg", "dur": "3:38:01"}, {"id": "GYpiCw5i-BU", "title": "55 Most Listened Symphony Classical Music (No Ads) | Bach, Mozart, Vivaldi | Relaxation & Healing", "thumb": "https://i.ytimg.com/vi/GYpiCw5i-BU/mqdefault.jpg", "dur": "3:45:15"}, {"id": "s8ArjiNbYT0", "title": "25 Famous Classical Symphony Melodies Everyone Most Listened One in Life 🎵 Mozart, Bach, Vivaldi,..", "thumb": "https://i.ytimg.com/vi/s8ArjiNbYT0/mqdefault.jpg", "dur": "3:17:57"}, {"id": "pJ41Vfb97Do", "title": "3 Hours Famous Classical | Symphonic Orchestral Non Stop Music | Relaxing Classical of All Time 🎧", "thumb": "https://i.ytimg.com/vi/pJ41Vfb97Do/mqdefault.jpg", "dur": "2:53:48"}, {"id": "xeoPioickvk", "title": "50 Best of Classical Music that You Should Listen to Once In Your Life🎻Mozart, Beethoven, Vivaldi..", "thumb": "https://i.ytimg.com/vi/xeoPioickvk/mqdefault.jpg", "dur": "3:35:13"}, {"id": "QW7JVGqrdPo", "title": "( No Ads ) 45 Famous Emotional Classical Symphony Masterpieces makes you unable to sit still ️🎶", "thumb": "https://i.ytimg.com/vi/QW7JVGqrdPo/mqdefault.jpg", "dur": "3:24:29"}, {"id": "l9U9ZV3h930", "title": "30 Most Famous Beautiful Classical Symphony Music of All Time - Beethoven, Mozart, Bach, Vivaldi,...", "thumb": "https://i.ytimg.com/vi/l9U9ZV3h930/mqdefault.jpg", "dur": "3:43:44"}, {"id": "0DxemC0-Eew", "title": "35 Famous Emotional Classical Symphony Melodies That Touch the Heart & Can't stop listened 🎻🎻🎻", "thumb": "https://i.ytimg.com/vi/0DxemC0-Eew/mqdefault.jpg", "dur": "3:21:50"}, {"id": "TQoC6uVboQ4", "title": "50 Most Famous Emotional Classical Symphony Melodies Everyone Knows & Never Stops Listening To 🎻", "thumb": "https://i.ytimg.com/vi/TQoC6uVboQ4/mqdefault.jpg", "dur": "3:35:14"}, {"id": "A6qMqAs9txs", "title": "35 Famous Emotional Classical Symphony Melodies Everyone Knows & Can't stop listened 🎻🎻🎻", "thumb": "https://i.ytimg.com/vi/A6qMqAs9txs/mqdefault.jpg", "dur": "3:34:25"}, {"id": "69wRTUCs2Mg", "title": "( No Ads ) 4 Hours of Emotional Classical Music | Famous Symphony Orchestra – Mozart, Vivaldi", "thumb": "https://i.ytimg.com/vi/69wRTUCs2Mg/mqdefault.jpg", "dur": "3:35:05"}, {"id": "euhdAoseRgA", "title": "50 Most Emotional Classical Symphony Everyone Knows | Greatest Works by Rossini, Mozart, Tchaikovsky", "thumb": "https://i.ytimg.com/vi/euhdAoseRgA/mqdefault.jpg", "dur": "3:05:51"}, {"id": "-GuTPmjEJ_8", "title": "🎧 One Minute of Pure Relax – Immortal Timeless Classical Escape", "thumb": "https://i.ytimg.com/vi/-GuTPmjEJ_8/mqdefault.jpg", "dur": "2:21"}, {"id": "cZcsRHvP74k", "title": "50 Mozart Piano Pieces 🎻 Immortal Melodies of Classical Music Mix for Studying, Reading, Relaxing", "thumb": "https://i.ytimg.com/vi/cZcsRHvP74k/mqdefault.jpg", "dur": "3:34:12"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
</body>
