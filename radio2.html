<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Musik Radio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: white; padding: 20px; }
  .back { align-self: flex-start; color: #9b8fc0; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
  .back:hover { color: #e0d7ff; }
  h1 { font-size: 1.8rem; font-weight: 300; color: #e0d7ff; margin-bottom: 6px; text-align: center; }
  .subtitle { font-size: 0.8rem; color: #9b8fc0; margin-bottom: 20px; text-align: center; }
  .filter-section { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; width: 100%; }
  .filter-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: #9b8fc0; padding: 6px 16px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s ease; }
  .filter-btn.active { background: rgba(180,150,255,0.25); border-color: rgba(180,150,255,0.6); color: #e8e0ff; }
  .filter-btn.excluded { background: rgba(255,80,80,0.15); border-color: rgba(255,100,100,0.5); color: #ff9999; text-decoration: line-through; }
  .mode-toggle { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; color: #7a6fa0; padding: 6px 16px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s ease; margin-bottom: 8px; }
  .mode-toggle.excl-mode { background: rgba(255,80,80,0.15); border-color: rgba(255,100,100,0.4); color: #ff9999; }
  .player-container { width: 100%; max-width: 640px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; overflow: hidden; }
  .video-frame { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
  .video-frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .video-frame .placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #9b8fc0; font-size: 0.9rem; flex-direction: column; gap: 10px; }
  .info { padding: 16px 20px; }
  .channel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .channel-thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(180,150,255,0.3); flex-shrink: 0; }
  .channel-name { font-size: 0.75rem; color: #9b8fc0; }
  .video-title { font-size: 0.95rem; color: #e8e0ff; line-height: 1.4; margin-bottom: 4px; }
  .video-dur { font-size: 0.75rem; color: #7a6fa0; margin-bottom: 16px; }
  .btn-next { background: rgba(180,150,255,0.2); border: 1px solid rgba(180,150,255,0.5); border-radius: 50px; color: #e8e0ff; padding: 14px 32px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; display: block; width: 100%; font-family: inherit; }
  .btn-next:hover { background: rgba(180,150,255,0.35); }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(180,150,255,0.3); border-top-color: #b496ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  .status-msg { font-size: 0.78rem; color: #7a6fa0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rating-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; }
  .rating-label { font-size: 0.78rem; color: #7a6fa0; }
  .stars { display: flex; gap: 4px; }
  .star { font-size: 1.5rem; cursor: pointer; color: #4a4060; transition: color 0.15s; user-select: none; }
  .star:hover, .star.active { color: #f0c040; }
  .clear-star { font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; background: none; color: #9b8fc0; }
  .clear-star:hover { color: #fff; }
  .save-rating-btn { background: #5a3fa0; color: white; border: none; padding: 6px 16px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
  .save-rating-btn:hover { background: #7a5fc0; }
  .save-rating-btn:disabled { background: #3a2a70; cursor: wait; }
  .rating-status { font-size: 0.75rem; font-style: italic; color: #7a6fa0; }
  .rating-status.ok { color: #6fcf97; }
  .rating-status.err { color: #eb5757; }
  .bestof-btn { background: rgba(240,192,64,0.15); border: 1px solid rgba(240,192,64,0.4); border-radius: 20px; color: #f0c040; padding: 6px 16px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s ease; }
  .bestof-btn.active { background: rgba(240,192,64,0.35); border-color: rgba(240,192,64,0.8); }
  .token-overlay { position: fixed; inset: 0; background: rgba(10,8,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .token-box { background: #1a1535; border: 1px solid rgba(180,150,255,0.3); border-radius: 16px; padding: 30px; max-width: 420px; width: 90%; }
  .token-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; margin-bottom: 10px; }
  .token-box p { font-size: 0.82rem; color: #9b8fc0; margin-bottom: 18px; line-height: 1.5; }
  .token-box input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.85rem; font-family: monospace; margin-bottom: 14px; }
  .token-box input:focus { outline: none; border-color: rgba(180,150,255,0.6); }
  .token-confirm { background: #5a3fa0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; }
  .token-confirm:hover { background: #7a5fc0; }
</style>
</head>
<body>
<div class="token-overlay" id="token-overlay" style="display:none">
  <div class="token-box">
    <h2>🔑 GitHub Token eingeben</h2>
    <p>Das Token wird nur in diesem Browser gespeichert und direkt an GitHub übertragen.</p>
    <input type="password" id="token-input" placeholder="github_pat_...">
    <button class="token-confirm" onclick="saveToken()">Bestätigen</button>
  </div>
</div>
  <a class="back" href="index.html">← Übersicht</a>
  <h1>🎵 KI-Musik Radio</h1>
  <p class="subtitle" id="subtitle">Zufälliger Kanal · Zufälliges Video</p>
  <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">⊖ Ausschluss-Modus</button>
  <div class="filter-section" id="filters">
    <button class="filter-btn active" id="btn-alle" onclick="setFilter('Alle')">Alle</button>
  </div>
  <div class="player-container">
    <div class="video-frame">
      <div class="placeholder" id="placeholder">
        <span class="spinner"></span>
        <span class="status-msg" id="status-msg">Lade...</span>
      </div>
      <div id="yt-player"></div>
    </div>
    <div class="info" id="info"></div>
  </div>

<script>
  // YouTube Data API Schlüssel (nur für Einbettbarkeits-Check)
  const API_KEY = 'AIzaSyAMqQPFipnCXme2n5znJO4tcNBkVudntFc';
  const API_KEY2 = 'AIzaSyBBOUTQIbs9_xUbVqbEKyVBb5q7xc1y0oM';

  let channelList = [];
  let bestOfMode = false;      // true = nur bewertete Videos mit 4-5 Sternen
  let includedCats = new Set(); // im Einschluss-Modus gewählte Kategorien (leer = Alle)
  let excludeMode = false;      // false = Einschluss, true = Ausschluss
  let excludedCats = new Set(); // im Ausschluss-Modus ausgeschlossene Kategorien
  let ytPlayer = null;
  let playerReady = false;
  let isLoading = false;
  let playbackTimeout = null;

  const urlParams = new URLSearchParams(window.location.search);
  const startFilter = urlParams.get('kategorie') || 'Alle';
  const kanalParam = urlParams.get('kanal') || null;   // z.B. radio2.html?kanal=Blue_Flame_Rock.html
  let kanalVideosCache = null;                          // Videos des fixierten Kanals (nur einmal laden)
  let randomStartEnabled = true;                        // Zufälliger Zeiteinstieg an/aus

  // YouTube IFrame API laden
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      playerVars: { autoplay: 1, rel: 0 },
      events: {
        onReady: () => { playerReady = true; },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) {
            clearPlaybackTimeout();
            document.getElementById('placeholder').style.display = 'none';
          }
          if (e.data === YT.PlayerState.ENDED) {
            pickRandom();
          }
        },
        onError: (e) => {
          console.log('YouTube Fehler:', e.data);
          clearPlaybackTimeout();
          setTimeout(() => pickRandom(), 1000);
        }
      }
    });
  }

  function startPlaybackTimeout() {
    clearPlaybackTimeout();
    playbackTimeout = setTimeout(() => {
      if (ytPlayer && ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
        console.log('Timeout – weiter');
        pickRandom();
      }
    }, 7000);
  }

  function clearPlaybackTimeout() {
    if (playbackTimeout) { clearTimeout(playbackTimeout); playbackTimeout = null; }
  }

  // Prüft ob ein Video einbettbar ist via YouTube Data API
  async function isEmbeddable(videoId) {
    const keys = [API_KEY, API_KEY2];
    for (const key of keys) {
      try {
        const url = `https://www.googleapis.com/youtube/v3/videos?part=status&id=${videoId}&key=${key}`;
        const resp = await fetch(url);
        if (!resp.ok) continue;
        const data = await resp.json();
        const item = data.items && data.items[0];
        if (!item) return false;
        return item.status.embeddable === true;
      } catch(e) {
        continue;
      }
    }
    return true; // Im Zweifel versuchen
  }

  async function loadChannelList() {
    const resp = await fetch('index.html');
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const links = [];
    doc.querySelectorAll('a.card').forEach(a => {
      const href = a.getAttribute('href');
      const cats = a.getAttribute('data-cats') || '';
      const name = a.querySelector('.card-name')?.textContent?.trim() || '';
      const thumb = a.querySelector('.ch-thumb')?.getAttribute('src') || '';
      if (href && href.endsWith('.html') && href !== 'neu.html' && href !== 'radio.html' && href !== 'radio2.html') {
        links.push({ file: href, categories: cats, name, thumb });
      }
    });
    return links;
  }

  async function loadOneChannel(entry) {
    const resp = await fetch(entry.file);
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const videos = [];

    // Neue Struktur: VIDEOS-Array im Script-Tag (konvertierte Seiten)
    const scriptTags = doc.querySelectorAll('script');
    for (const script of scriptTags) {
      const m = script.textContent.match(/const VIDEOS\s*=\s*(\[[\s\S]*?\]);/);
      if (m) {
        try {
          const arr = JSON.parse(m[1]);
          arr.forEach(v => {
            if (v.id && v.title) {
              videos.push({
                videoId: v.id,
                url: 'https://www.youtube.com/watch?v=' + v.id,
                title: v.title,
                dur: v.dur || ''
              });
            }
          });
          return videos;
        } catch(e) {}
      }
    }

    // Alte Struktur: <a class="video-card" href="...">
    doc.querySelectorAll('.video-card').forEach(card => {
      const url = card.getAttribute('href') || card.querySelector('a[href*="youtube"]')?.getAttribute('href') || '';
      const title = card.querySelector('.video-title')?.textContent?.trim() || '';
      const dur = card.querySelector('.video-dur')?.textContent?.trim() || '';
      if (url && title) {
        const match = url.match(/v=([a-zA-Z0-9_-]{11})/);
        if (match) videos.push({ videoId: match[1], url, title, dur });
      }
    });
    return videos;
  }

  function toggleBestOf() {
    bestOfMode = !bestOfMode;
    const btn = document.getElementById('btn-bestof');
    if (btn) btn.classList.toggle('active', bestOfMode);
    document.getElementById('subtitle').textContent = bestOfMode
      ? '⭐ Best Of – nur 4 & 5 Sterne'
      : 'Alle Kategorien · Zufälliges Video';
    pickRandom();
  }

  // Gibt alle Videos mit 4-5 Sternen zurück als { video, channel } Liste
  async function getBestOfVideos() {
    const result = [];
    const topIds = Object.entries(allRatings)
      .filter(([id, stars]) => stars >= 4)
      .map(([id]) => id);
    if (!topIds.length) return result;
    const topSet = new Set(topIds);

    const filtered = getFiltered();
    for (const channel of filtered) {
      const videos = await loadOneChannel(channel);
      for (const v of videos) {
        if (topSet.has(v.videoId)) {
          result.push({ video: v, channel });
        }
      }
    }
    return result;
  }

  function toggleMode() {
    excludeMode = !excludeMode;
    excludedCats.clear();
    includedCats.clear();
    const toggle = document.getElementById('mode-toggle');
    toggle.textContent = excludeMode ? '⊕ Einschluss-Modus' : '⊖ Ausschluss-Modus';
    toggle.classList.toggle('excl-mode', excludeMode);
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active', 'excluded');
      if (!excludeMode && b.id === 'btn-alle') b.classList.add('active');
    });
    document.getElementById('subtitle').textContent = excludeMode
      ? 'Kategorien antippen zum Ausschließen'
      : 'Alle Kategorien · Zufälliges Video';
    pickRandom();
  }

  function setFilter(kat) {
    if (excludeMode) {
      // Im Ausschluss-Modus: Kategorie ein-/ausschließen
      const btn = [...document.querySelectorAll('.filter-btn')].find(b => b.textContent === kat);
      if (excludedCats.has(kat)) {
        excludedCats.delete(kat);
        if (btn) { btn.classList.remove('excluded'); }
      } else {
        excludedCats.add(kat);
        if (btn) { btn.classList.add('excluded'); }
      }
      const n = excludedCats.size;
      document.getElementById('subtitle').textContent = n === 0
        ? 'Kategorien antippen zum Ausschließen'
        : n + ' Kategorie' + (n > 1 ? 'n' : '') + ' ausgeschlossen';
      pickRandom();
    } else {
      // Einschluss-Modus: mehrere Kategorien togglebar
      if (kat === 'Alle') {
        includedCats.clear();
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-alle').classList.add('active');
        document.getElementById('subtitle').textContent = 'Alle Kategorien · Zufälliges Video';
      } else {
        if (includedCats.has(kat)) {
          includedCats.delete(kat);
        } else {
          includedCats.add(kat);
        }
        const btn = [...document.querySelectorAll('.filter-btn')].find(b => b.textContent === kat);
        if (btn) btn.classList.toggle('active', includedCats.has(kat));
        // Alle-Knopf: aktiv nur wenn nichts ausgewählt
        document.getElementById('btn-alle').classList.toggle('active', includedCats.size === 0);
        const n = includedCats.size;
        document.getElementById('subtitle').textContent = n === 0
          ? 'Alle Kategorien · Zufälliges Video'
          : [...includedCats].join(', ') + ' · Zufälliges Video';
      }
      pickRandom();
    }
  }

  function getFiltered() {
    if (excludeMode) {
      if (excludedCats.size === 0) return channelList;
      // Strikt: Kanal fällt raus, wenn er IRGENDEINE ausgeschlossene Kategorie enthält
      return channelList.filter(ch => {
        const chCats = ch.categories.split(',').map(s => s.trim()).filter(Boolean);
        return !chCats.some(cat => excludedCats.has(cat));
      });
    }
    // Einschluss: Kanal muss mindestens eine der gewählten Kategorien haben
    if (includedCats.size === 0) return channelList;
    return channelList.filter(ch => {
      const chCats = ch.categories.split(',').map(s => s.trim()).filter(Boolean);
      return chCats.some(cat => includedCats.has(cat));
    });
  }

  // "2:15:43" oder "12:34" -> Sekunden
  function durToSeconds(dur) {
    if (!dur) return 0;
    const parts = dur.trim().split(':').map(Number);
    if (parts.some(isNaN)) return 0;
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return 0;
  }

  // Zufälligen Startpunkt wählen: zwischen Minute 10 und 80% der Dauer,
  // nur bei Videos über 20 Minuten – kürzere starten normal bei 0
  function randomStartSeconds(dur) {
    if (!randomStartEnabled) return 0;
    const total = durToSeconds(dur);
    if (total < 1200) return 0;
    const min = 600;
    const max = Math.floor(total * 0.8);
    if (max <= min) return 0;
    return min + Math.floor(Math.random() * (max - min));
  }

  function toggleRandomStart() {
    randomStartEnabled = !randomStartEnabled;
    const btn = document.getElementById('btn-randomstart');
    if (btn) btn.classList.toggle('active', randomStartEnabled);
  }

  function setStatus(msg) {
    document.getElementById('status-msg').textContent = msg;
    document.getElementById('placeholder').style.display = 'flex';
  }

  async function pickRandom() {
    if (isLoading) return;
    isLoading = true;
    clearPlaybackTimeout();

    // Best-Of Modus: nur Videos mit 4-5 Sternen
    if (bestOfMode) {
      setStatus('Lade Best-Of Liste...');
      const bestOf = await getBestOfVideos();
      if (!bestOf.length) {
        document.getElementById('info').innerHTML = '<p style="color:#9b8fc0;text-align:center;padding:10px">Keine bewerteten Videos (4-5 Sterne) gefunden.</p>';
        isLoading = false;
        return;
      }
      const shuffled = bestOf.sort(() => Math.random() - 0.5);
      for (const { video, channel: ch } of shuffled.slice(0, 8)) {
        setStatus('Prüfe Video...');
        const ok = await isEmbeddable(video.videoId);
        if (ok) {
          document.getElementById('placeholder').style.display = 'flex';
          setStatus('Starte...');
          const startSec = randomStartSeconds(video.dur);
          if (ytPlayer && playerReady) {
            ytPlayer.loadVideoById({ videoId: video.videoId, startSeconds: startSec });
            startPlaybackTimeout();
          }
          currentVideoId = video.videoId;
          currentRating = allRatings[video.videoId] || 0;
          document.getElementById('info').innerHTML = `
            <div class="channel-row">
              ${ch.thumb ? `<img class="channel-thumb" src="${ch.thumb}" onerror="this.style.display='none'">` : ''}
              <span class="channel-name">${ch.name}</span>
            </div>
            <div class="video-title">${video.title}</div>
            <div class="video-dur">${video.dur}${startSec > 0 ? ' · Einstieg bei ' + Math.floor(startSec/60) + ' min' : ''}</div>
            <div class="rating-row">
              <span class="rating-label">Bewertung:</span>
              <div class="stars" id="radio-stars">
                ${[1,2,3,4,5].map(n => `<span class="star" onclick="setRadioRating(${n})">★</span>`).join('')}
              </div>
              <button class="clear-star" onclick="setRadioRating(0)">✕</button>
              <button class="save-rating-btn" id="radio-save-btn" onclick="saveRadioRating()">💾</button>
              <span class="rating-status" id="radio-status"></span>
            </div>
            <button class="btn-next" onclick="pickRandom()">⟳ Nächstes Best-Of Video</button>
          `;
          renderRadioStars();
          isLoading = false;
          return;
        }
      }
      document.getElementById('info').innerHTML = '<p style="color:#9b8fc0;text-align:center;padding:10px">Kein abspielbares Best-Of Video gefunden.</p>';
      isLoading = false;
      return;
    }

    let filtered;
    if (kanalParam) {
      const fixed = channelList.find(c => c.file === kanalParam);
      filtered = fixed ? [fixed] : [];
    } else {
      filtered = getFiltered();
    }
    if (!filtered.length) {
      document.getElementById('info').innerHTML = '<p style="color:#9b8fc0;text-align:center;padding:10px">Keine Kanäle in dieser Kategorie.</p>';
      isLoading = false;
      return;
    }

    let attempts = 0;
    while (attempts < 10) {
      attempts++;
      const channel = filtered[Math.floor(Math.random() * filtered.length)];
      setStatus('Lade ' + channel.name + '...');
      let videos;
      if (kanalParam) {
        if (!kanalVideosCache) kanalVideosCache = await loadOneChannel(channel);
        videos = kanalVideosCache;
      } else {
        videos = await loadOneChannel(channel);
      }
      if (!videos.length) { if (kanalParam) break; continue; }

      // Zufälliges Video wählen und auf Einbettbarkeit prüfen
      const shuffled = videos.sort(() => Math.random() - 0.5);
      let found = null;
      for (const video of shuffled.slice(0, 8)) { // max 8 API-Anfragen pro Versuch
        setStatus('Prüfe Video...');
        const ok = await isEmbeddable(video.videoId);
        if (ok) { found = { video, channel }; break; }
      }
      if (!found) continue;

      // Einbettbares Video gefunden – abspielen
      const { video, channel: ch } = found;
      document.getElementById('placeholder').style.display = 'flex';
      setStatus('Starte...');

      const startSec = randomStartSeconds(video.dur);
      if (ytPlayer && playerReady) {
        ytPlayer.loadVideoById({ videoId: video.videoId, startSeconds: startSec });
        startPlaybackTimeout();
      } else {
        const wait = setInterval(() => {
          if (playerReady) {
            clearInterval(wait);
            ytPlayer.loadVideoById({ videoId: video.videoId, startSeconds: startSec });
            startPlaybackTimeout();
          }
        }, 200);
      }

      currentVideoId = video.videoId;
      currentRating = 0;
      document.getElementById('info').innerHTML = `
        <div class="channel-row">
          ${ch.thumb ? `<img class="channel-thumb" src="${ch.thumb}" onerror="this.style.display='none'">` : ''}
          <span class="channel-name">${ch.name}</span>
        </div>
        <div class="video-title">${video.title}</div>
        <div class="video-dur">${video.dur}${startSec > 0 ? ' · Einstieg bei ' + Math.floor(startSec/60) + ' min' : ''}</div>
        <div class="rating-row">
          <span class="rating-label">Bewertung:</span>
          <div class="stars" id="radio-stars">
            ${[1,2,3,4,5].map(n => `<span class="star" onclick="setRadioRating(${n})">★</span>`).join('')}
          </div>
          <button class="clear-star" onclick="setRadioRating(0)">✕</button>
          <button class="save-rating-btn" id="radio-save-btn" onclick="saveRadioRating()">💾</button>
          <span class="rating-status" id="radio-status"></span>
        </div>
        <button class="btn-next" onclick="pickRandom()">⟳ Nächstes zufälliges Video</button>
      `;
      renderRadioStars();
      isLoading = false;
      return;
    }

    // Nach 10 Versuchen aufgeben
    setStatus('Kein abspielbares Video gefunden – tippe zum Wiederholen');
    document.getElementById('info').innerHTML = `<button class="btn-next" onclick="pickRandom()">⟳ Nochmal versuchen</button>`;
    isLoading = false;
  }

  // GitHub Bewertung
  const GITHUB_USER = 'quatschi';
  const GITHUB_REPO = 'ki-musik';
  const GITHUB_FILE = 'noten.json';
  const TOKEN_KEY = 'gh_token_ki_musik';
  let currentVideoId = null;
  let currentRating = 0;
  let allRatings = {};

  function getToken() { return localStorage.getItem(TOKEN_KEY); }

  function saveToken() {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    document.getElementById('token-overlay').style.display = 'none';
    saveRadioRatingNow();
  }

  async function loadAllRatings() {
    if (!getToken()) return;
    try {
      const resp = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
        { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
      );
      if (resp.ok) {
        const data = await resp.json();
        const content = JSON.parse(atob(data.content));
        allRatings = content.ratings || {};
      }
    } catch(e) {}
  }

  function setRadioRating(val) {
    currentRating = val;
    renderRadioStars();
  }

  function renderRadioStars() {
    const stars = document.querySelectorAll('#radio-stars .star');
    stars.forEach((s,i) => s.classList.toggle('active', i < currentRating));
  }

  function setRadioStatus(msg, cls) {
    const el = document.getElementById('radio-status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'rating-status ' + (cls || '');
  }

  async function saveRadioRating() {
    if (!getToken()) {
      document.getElementById('token-overlay').style.display = 'flex';
      return;
    }
    saveRadioRatingNow();
  }

  async function saveRadioRatingNow() {
    if (!currentVideoId) return;
    const btn = document.getElementById('radio-save-btn');
    if (btn) btn.disabled = true;
    setRadioStatus('Speichern...', '');

    allRatings[currentVideoId] = currentRating;
    const json = JSON.stringify({ channel: 'Radio', updated: new Date().toISOString(), ratings: allRatings }, null, 2);
    const encoded = btoa(unescape(encodeURIComponent(json)));

    try {
      let sha = null;
      const getResp = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
        { headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' } }
      );
      if (getResp.ok) { const existing = await getResp.json(); sha = existing.sha; }
      const body = { message: 'Bewertung aktualisiert', content: encoded };
      if (sha) body.sha = sha;
      const putResp = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
        {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }
      );
      if (putResp.ok) {
        setRadioStatus('✓ Gespeichert', 'ok');
      } else {
        const err = await putResp.json();
        setRadioStatus('Fehler: ' + (err.message || putResp.status), 'err');
      }
    } catch(e) {
      setRadioStatus('Netzwerkfehler', 'err');
    }
    if (btn) btn.disabled = false;
  }

  async function init() {
    channelList = await loadChannelList();
    await loadAllRatings();

    // Toggle-Button für zufälligen Zeiteinstieg
    const fdiv = document.getElementById('filters');
    const tbtn = document.createElement('button');
    tbtn.className = 'filter-btn active';
    tbtn.id = 'btn-randomstart';
    tbtn.textContent = '⏩ Zufallseinstieg';
    tbtn.onclick = toggleRandomStart;
    fdiv.appendChild(tbtn);

    // Best-Of Button
    const bbtn = document.createElement('button');
    bbtn.className = 'bestof-btn';
    bbtn.id = 'btn-bestof';
    bbtn.textContent = '⭐ Best Of';
    bbtn.onclick = toggleBestOf;
    fdiv.appendChild(bbtn);

    if (kanalParam) {
      // Kanal-Modus: Kategorie-Knöpfe ausblenden, Kanalname anzeigen
      document.querySelectorAll('.filter-btn').forEach(b => { if (b.id !== 'btn-randomstart') b.style.display = 'none'; });
      const mt = document.getElementById('mode-toggle'); if (mt) mt.style.display = 'none';
      const fixed = channelList.find(c => c.file === kanalParam);
      document.getElementById('subtitle').textContent = fixed
        ? '📌 Nur Kanal: ' + fixed.name
        : 'Kanal nicht gefunden: ' + kanalParam;
      const waitForPlayer0 = setInterval(() => {
        if (playerReady) { clearInterval(waitForPlayer0); pickRandom(); }
      }, 200);
      return;
    }

    const cats = new Set();
    channelList.forEach(c => {
      if (c.categories) c.categories.split(',').forEach(cat => { const t = cat.trim(); if (t) cats.add(t); });
    });
    const filterDiv = document.getElementById('filters');
    [...cats].sort().forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cat;
      btn.onclick = () => setFilter(cat);
      filterDiv.appendChild(btn);
    });

    if (startFilter !== 'Alle') {
      includedCats.add(startFilter);
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === startFilter));
      document.getElementById('btn-alle').classList.remove('active');
      document.getElementById('subtitle').textContent = startFilter + ' · Zufälliges Video';
    }

    const waitForPlayer = setInterval(() => {
      if (playerReady) { clearInterval(waitForPlayer); pickRandom(); }
    }, 200);
  }

  init();
</script>
</body>
</html>
