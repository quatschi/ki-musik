anoo, Goombay, Spirituals & Hotel Cabaret", "thumb": "https://i.ytimg.com/vi/XJtExUPzT4k/mqdefault.jpg", "dur": "2:00:59"}, {"id": "TT6rjW_xBMs", "title": "Azerbaijan 1955 | 2 Hours of Vintage Azerbaijani Mugham, Ashiq Folk, and Symphonic Mugham", "thumb": "https://i.ytimg.com/vi/TT6rjW_xBMs/mqdefault.jpg", "dur": "2:15:20"}, {"id": "qOLUCt6oeOo", "title": "Austria 1955 | 2 Hours of Vintage Austrian Alpine Folk, Schrammelmusik, and Vienna Waltz", "thumb": "https://i.ytimg.com/vi/qOLUCt6oeOo/mqdefault.jpg", "dur": "2:05:45"}, {"id": "u9TEQxPObAg", "title": "Australia 1955 | 2 Hours of Vintage Australian Folk and Dance Hall Music", "thumb": "https://i.ytimg.com/vi/u9TEQxPObAg/mqdefault.jpg", "dur": "2:06:03"}, {"id": "8-9jmPpe2o8", "title": "Armenia 1955 | 2 Hours of Vintage Armenian Duduk and Folk Music", "thumb": "https://i.ytimg.com/vi/8-9jmPpe2o8/mqdefault.jpg", "dur": "1:59:52"}, {"id": "nhYHLC0QKCQ", "title": "Argentina 1955 | 2 Hours of Vintage Argentine Tango and Folk Music", "thumb": "https://i.ytimg.com/vi/nhYHLC0QKCQ/mqdefault.jpg", "dur": "2:04:24"}, {"id": "WK079xmYCio", "title": "Antigua and Barbuda 1955 | 2 Hours of Vintage Antiguan Folk Music", "thumb": "https://i.ytimg.com/vi/WK079xmYCio/mqdefault.jpg", "dur": "1:54:36"}, {"id": "C3mCuQ_eL3I", "title": "Angola 1955 | 2 Hours of Vintage Angolan Folk Music", "thumb": "https://i.ytimg.com/vi/C3mCuQ_eL3I/mqdefault.jpg", "dur": "2:10:14"}, {"id": "y-XSv7JU8Z8", "title": "Andorra 1955 | 2 Hours of Vintage Andorran Pyrenean Folk Music", "thumb": "https://i.ytimg.com/vi/y-XSv7JU8Z8/mqdefault.jpg", "dur": "1:55:51"}, {"id": "mvMbnTUQge8", "title": "Algeria 1955 | 2 Hours of Vintage Algerian Classical Music", "thumb": "https://i.ytimg.com/vi/mvMbnTUQge8/mqdefault.jpg", "dur": "2:07:12"}, {"id": "Bk5lbda0m6w", "title": "Albania 1955 | 2 Hours of Vintage Albanian Folk Music", "thumb": "https://i.ytimg.com/vi/Bk5lbda0m6w/mqdefault.jpg", "dur": "1:51:34"}, {"id": "kWAP3aVrlSs", "title": "Afghanistan 1955 | 2 Hours of Vintage Afghan Classical Music", "thumb": "https://i.ytimg.com/vi/kWAP3aVrlSs/mqdefault.jpg", "dur": "1:56:39"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
