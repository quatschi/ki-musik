<script>
const CHANNEL = "Swingers' Lounge: New Bachelor Pad Cocktail Music";
const KANAL = "Swingers_Lounge_New_Bachelor_Pad_Cocktail_Music.html";
const VIDEOS = [{"id": "oGE1-WW9ORI", "title": "Daiquiris In Orbit: Space Age Cha-Cha Lounge Music", "thumb": "https://i.ytimg.com/vi/oGE1-WW9ORI/mqdefault.jpg", "dur": "1:14:19"}, {"id": "dGQTgxAdQ3U", "title": "Jungle Rhythms: Blood-Pounding Primitiva Style Exotica", "thumb": "https://i.ytimg.com/vi/dGQTgxAdQ3U/mqdefault.jpg", "dur": "1:00:19"}, {"id": "OClbbrGXp4s", "title": "Praia da Solidão: Samba Jazz to Carry You Away", "thumb": "https://i.ytimg.com/vi/OClbbrGXp4s/mqdefault.jpg", "dur": "1:31:20"}, {"id": "e0jnd77NSRo", "title": "Rio Rendezvous: Bossa Nova Background Music", "thumb": "https://i.ytimg.com/vi/e0jnd77NSRo/mqdefault.jpg", "dur": "1:12:43"}, {"id": "8Afa-ieasBM", "title": "Far East Fantasy: Asian Exotica Bachelor Pad Music", "thumb": "https://i.ytimg.com/vi/8Afa-ieasBM/mqdefault.jpg", "dur": "1:27:11"}, {"id": "qrGYWqAnFQ8", "title": "Smoky Intrigue: Cha Cha Noir Style Bachelor Pad Music", "thumb": "https://i.ytimg.com/vi/qrGYWqAnFQ8/mqdefault.jpg", "dur": "1:11:22"}, {"id": "qomyvZYThfw", "title": "Jazz Lounge On Ganymede: Space Age Jazz Background Music", "thumb": "https://i.ytimg.com/vi/qomyvZYThfw/mqdefault.jpg", "dur": "1:13:53"}, {"id": "7yFS4skd9_s", "title": "Ecdysiastic: Music to Strip By (Vintage Sleazy Horns Style)", "thumb": "https://i.ytimg.com/vi/7yFS4skd9_s/mqdefault.jpg", "dur": "1:04:17"}, {"id": "a7-m7_L-8g4", "title": "Jet Set Samba: Smooth Brazilian Rhythms for the Leisure Life", "thumb": "https://i.ytimg.com/vi/a7-m7_L-8g4/mqdefault.jpg", "dur": "1:26:34"}, {"id": "vr3tiiHimEE", "title": "Tiki Torches On the Beach: Exotic Music with A Late Night Mood", "thumb": "https://i.ytimg.com/vi/vr3tiiHimEE/mqdefault.jpg", "dur": "1:20:39"}, {"id": "Dn1CNhqYZHE", "title": "Havana Moon: Latin Lounge Background Music for Relaxation or Study", "thumb": "https://i.ytimg.com/vi/Dn1CNhqYZHE/mqdefault.jpg", "dur": "1:22:34"}, {"id": "XeVQTtS31Zo", "title": "Tropical Steam: New Exotica Background Music", "thumb": "https://i.ytimg.com/vi/XeVQTtS31Zo/mqdefault.jpg", "dur": "1:47:11"}, {"id": "hI6RFfiz3Do", "title": "Drinks By Earthlight: More Space Age Bachelor Pad Background Music", "thumb": "https://i.ytimg.com/vi/hI6RFfiz3Do/mqdefault.jpg", "dur": "1:08:22"}, {"id": "W-mADa1v1W4", "title": "Ultra-Lounge Vibes: Retro Swanky Background Music", "thumb": "https://i.ytimg.com/vi/W-mADa1v1W4/mqdefault.jpg", "dur": "1:01:24"}, {"id": "5E0BnmNnOL8", "title": "Undercover Noir: Spy-Fi/Crime Jazz Background Music", "thumb": "https://i.ytimg.com/vi/5E0BnmNnOL8/mqdefault.jpg", "dur": "1:06:04"}, {"id": "PZGkjV-VsQI", "title": "Sonic Shivers: Sound Sensations for Special Nights", "thumb": "https://i.ytimg.com/vi/PZGkjV-VsQI/mqdefault.jpg", "dur": "1:08:18"}, {"id": "WbFbr5Vjh_U", "title": "Cocktails On Mars: Space Age Bachelor Pad Music. Relaxing Background Instrumentals", "thumb": "https://i.ytimg.com/vi/WbFbr5Vjh_U/mqdefault.jpg", "dur": "27:25"}, {"id": "llYBDmri7K8", "title": "Hotel Lobby Interlude: Organ Lounge Background Music (Hammond Pop)", "thumb": "https://i.ytimg.com/vi/llYBDmri7K8/mqdefault.jpg", "dur": "1:04:49"}, {"id": "Rqmo8BWhzr4", "title": "Saturnian Cocktails for Two: Space Age Exotica Background Music", "thumb": "https://i.ytimg.com/vi/Rqmo8BWhzr4/mqdefault.jpg", "dur": "40:32"}, {"id": "OQV_hXkaJyY", "title": "Tiki Lounge Afternoon: Background Music for the Hip Life", "thumb": "https://i.ytimg.com/vi/OQV_hXkaJyY/mqdefault.jpg", "dur": "46:27"}];
let ratings = {}, changed = false, fileHandle = null;

async function loadRatings() {
  try {
    const r = await fetch('noten.json');
    if (r.ok) { const d = await r.json(); ratings = d.ratings || {}; }
  } catch(e) {}
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  VIDEOS.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    const cur = ratings[v.id] || 0;
    const radioUrl = `radio2.html?kanal=${KANAL}&video=${v.id}`;
    card.innerHTML = `
      <a href="${radioUrl}" title="Im Radio-Player abspielen" class="play-btn">▶</a>
      <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" style="display:flex;align-items:center;gap:14px;flex:1;text-decoration:none;color:inherit">
        ${v.thumb ? `<img src="${v.thumb}" class="thumb">` : '<div class="nothumb">▶</div>'}
        <div class="video-info">
          <span class="video-title">${v.title}</span>
          <span class="video-dur">${v.dur}</span>
        </div>
      </a>
      <div class="rating-area">
        <div class="stars" id="stars-${v.id}">
          ${[1,2,3,4,5].map(n => `<span class="star ${n <= cur ? 'active' : ''}" onclick="setRating('${v.id}',${n})">★</span>`).join('')}
        </div>
        <button class="clear-btn" onclick="setRating('${v.id}',0)">✕</button>
      </div>`;
    grid.appendChild(card);
  });
  updateCount();
}

function setRating(id, val) {
  ratings[id] = val;
  changed = true;
  document.getElementById('changed-hint').style.display = 'inline';
  document.querySelectorAll(`#stars-${id} .star`).forEach((s,i) => s.classList.toggle('active', i < val));
  updateCount();
}

function updateCount() {
  document.getElementById('rated-count').textContent = Object.values(ratings).filter(v => v > 0).length;
}

function buildJson() {
  return JSON.stringify({ channel: CHANNEL, updated: new Date().toISOString(), ratings }, null, 2);
}

async function saveRatings() {
  const json = buildJson();
  if ('showSaveFilePicker' in window) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'noten.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      changed = false;
      document.getElementById('changed-hint').style.display = 'none';
      document.getElementById('status-msg').textContent = '✓ Direkt gespeichert';
      document.getElementById('status-msg').className = 'status-msg status-ok';
      return;
    } catch(e) { if (e.name === 'AbortError') return; fileHandle = null; }
  }
  const blob = new Blob([json], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'noten.json'; a.click();
  changed = false;
  document.getElementById('changed-hint').style.display = 'none';
  document.getElementById('status-msg').textContent = '↓ Als Download gespeichert';
}

loadRatings();
</script>
